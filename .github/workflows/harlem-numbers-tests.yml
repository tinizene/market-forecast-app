name: Harlem Numbers tests

# The prototype in harlem-numbers/ is excluded from the Vercel deployment
# (see .vercelignore), so nothing else in this repo exercises it. This runs its
# unit tests on any pull request or push that touches it.
#
# No install step: game.test.js uses Node's built-in test runner and the app has
# no dependencies. The Playwright browser checks are deliberately not run here -
# they need a browser download, and the logic they cover is already unit-tested.

on:
  pull_request:
    paths:
      - 'harlem-numbers/**'
      - '.github/workflows/harlem-numbers-tests.yml'
  push:
    branches: [main]
    paths:
      - 'harlem-numbers/**'
      - '.github/workflows/harlem-numbers-tests.yml'

permissions:
  contents: read

# A new push supersedes an in-flight run on the same branch.
concurrency:
  group: harlem-numbers-tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Run unit tests
        run: node --test harlem-numbers/game.test.js

      # Catches a build that silently stops inlining game.js, which would
      # publish a page with a dead <script src> and no working app.
      - name: Check the single-file build
        run: node harlem-numbers/build-artifact.mjs "${RUNNER_TEMP}/dist-artifact.html"
