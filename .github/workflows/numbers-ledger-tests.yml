name: Numbers ledger tests

# The ledger is the part where being wrong costs money, so it runs on every
# change to it. No install step: the tests use Node's built-in runner and the
# package has no dependencies.

on:
  pull_request:
    paths:
      - 'numbers-ledger/**'
      # Four test files use africa-numbers/game.js - the real payout and hit
      # rules - so a change there must re-run this suite.
      - 'africa-numbers/game.js'
      - '.github/workflows/numbers-ledger-tests.yml'
  push:
    branches: [main]
    paths:
      - 'numbers-ledger/**'
      - 'africa-numbers/game.js'
      - '.github/workflows/numbers-ledger-tests.yml'

permissions:
  contents: read

concurrency:
  group: numbers-ledger-tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    # Names the check on the pull request. Without it both workflows post a
    # check called "test" and a red one does not say which project broke.
    name: numbers-ledger
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: numbers-ledger
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Node
        uses: actions/setup-node@v5
        with:
          node-version: '22'

      # Before the tests, because a stale manifest is a specific failure with a
      # specific fix, and reading it out of a test summary is slower than being
      # told directly.
      - name: Check the build manifest is current
        run: npm run manifest:check

      - name: Run tests
        run: npm test

      # What an inspector runs on a production host, run here on every change so
      # that it cannot rot unnoticed between releases.
      - name: Verify the build
        run: npm run verify

      # Regenerates every figure from the game rules, including the million-draw
      # uniformity sample, and fails if the published sheet differs. Separate
      # from the tests because it takes seconds and answers a different
      # question: not "does the mapping work" but "did a payout change and the
      # sheet not notice".
      - name: Check the math sheet is current
        run: npm run mathsheet:check

      # Reruns the whole statistical battery twice over a million draws and
      # fails if the published description differs. Also fails outright if a
      # test comes back low on both samples - that would be the draw mechanism
      # rather than the document, and it should stop a release.
      - name: Check the RNG description is current
        run: npm run rng:check

      # Scans the source for every event kind, runs the system to see what it
      # actually writes and where, and fails on a kind that is undocumented,
      # stale, or filed under the wrong record.
      - name: Check the events catalogue is current
        run: npm run events:check
