  <text x="737" y="158" text-anchor="start" font-size="12" fill="var(--danger-text)">Residual: nothing</text>
  <line x1="60" y1="470" x2="840" y2="470" stroke="var(--diagram-grid)" stroke-width="2"/>
  <text x="450" y="508" text-anchor="middle" font-size="15" fill="var(--warning-text)" font-weight="bold">Revenue fell 10%. The shareholders' claim fell 100%.</text>
  <text x="450" y="532" text-anchor="middle" font-size="12" fill="var(--diagram-muted)">This is why share prices move so much more than the businesses underneath them.</text>
</svg><svg data-key="stocks/stocks-01-2-positive-vs-zero-sum" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 560" font-family="Arial, Helvetica, sans-serif" role="img">
  <rect x="0" y="0" width="900" height="560" fill="var(--diagram-bg)"/>
  <text x="450" y="34" text-anchor="middle" font-size="21" fill="var(--diagram-text)" font-weight="bold">Where Does the Money Come From?</text>
  <text x="450" y="57" text-anchor="middle" font-size="13" fill="var(--diagram-muted)">The distinction is not how risky it feels. It is whether anything is being created.</text>
  <rect x="30" y="84" width="409" height="430" rx="10" fill="var(--diagram-bg)" stroke="var(--danger-500)" stroke-width="2"/>
  <text x="234.5" y="114" text-anchor="middle" font-size="16" fill="var(--danger-text)" font-weight="bold">Roulette: zero-sum, minus the house</text>
  <text x="46" y="146" text-anchor="start" font-size="13" fill="var(--diagram-text)" font-weight="bold">The wheel produces nothing.</text>
  <text x="46" y="173" text-anchor="start" font-size="13" fill="var(--diagram-muted)">Every unit won by one player is a unit lost by another.</text>
  <text x="46" y="210" text-anchor="start" font-size="13" fill="var(--diagram-text)" font-weight="bold">37 pockets, a single number pays 35 to 1.</text>
  <text x="46" y="237" text-anchor="start" font-size="13" fill="var(--diagram-muted)">Expected value per unit staked: about 0.973 units</text>
  <text x="46" y="256" text-anchor="start" font-size="13" fill="var(--diagram-muted)">returned.</text>
  <text x="46" y="293" text-anchor="start" font-size="13" fill="var(--diagram-text)" font-weight="bold">A loss of about 2.7% per spin, on average, forever.</text>
  <text x="46" y="320" text-anchor="start" font-size="13" fill="var(--diagram-muted)">This is a property of the wheel. No amount of skill</text>
  <text x="46" y="339" text-anchor="start" font-size="13" fill="var(--diagram-muted)">changes it.</text>
  <rect x="461" y="84" width="409" height="430" rx="10" fill="var(--diagram-bg)" stroke="var(--success-500)" stroke-width="2"/>
  <text x="665.5" y="114" text-anchor="middle" font-size="16" fill="var(--success-text)" font-weight="bold">Owning businesses: positive-sum</text>
  <text x="477" y="146" text-anchor="start" font-size="13" fill="var(--diagram-text)" font-weight="bold">The companies employ people and sell things.</text>
  <text x="477" y="173" text-anchor="start" font-size="13" fill="var(--diagram-muted)">Cash is generated outside the transactions between</text>
  <text x="477" y="192" text-anchor="start" font-size="13" fill="var(--diagram-muted)">investors.</text>
  <text x="477" y="229" text-anchor="start" font-size="13" fill="var(--diagram-text)" font-weight="bold">That cash reaches the residual claim (Lesson 1).</text>
  <text x="477" y="256" text-anchor="start" font-size="13" fill="var(--diagram-muted)">Every owner can gain at once, because value was created.</text>
  <text x="477" y="293" text-anchor="start" font-size="13" fill="var(--diagram-text)" font-weight="bold">But only over holding periods long enough for it to</text>
  <text x="477" y="312" text-anchor="start" font-size="13" fill="var(--diagram-text)" font-weight="bold">matter.</text>
  <text x="477" y="339" text-anchor="start" font-size="13" fill="var(--diagram-muted)">Over minutes, the businesses have produced nothing new,</text>
  <text x="477" y="358" text-anchor="start" font-size="13" fill="var(--diagram-muted)">and trading is the roulette column again.</text>
</svg><svg data-key="stocks/stocks-01-3-order-book" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 560" font-family="Arial, Helvetica, sans-serif" role="img">
  <rect x="0" y="0" width="900" height="560" fill="var(--diagram-bg)"/>
  <text x="450" y="34" text-anchor="middle" font-size="21" fill="var(--diagram-text)" font-weight="bold">There Is No Single Price</text>
  <text x="450" y="57" text-anchor="middle" font-size="13" fill="var(--diagram-muted)">A share quoted at 25.00. The quote is the midpoint, and nobody is offering it.</text>
  <rect x="250" y="92" width="400" height="150" rx="8" fill="var(--diagram-bg)" stroke="var(--danger-500)" stroke-width="2"/>
  <text x="450" y="116" text-anchor="middle" font-size="14" fill="var(--danger-text)" font-weight="bold">Sellers: the ask side</text>
  <text x="300" y="148" text-anchor="start" font-size="14" fill="var(--diagram-text)">25.06</text>
  <text x="560" y="148" text-anchor="end" font-size="13" fill="var(--diagram-muted)">400 shares</text>
  <text x="300" y="176" text-anchor="start" font-size="14" fill="var(--diagram-text)">25.04</text>
  <text x="560" y="176" text-anchor="end" font-size="13" fill="var(--diagram-muted)">900 shares</text>
  <text x="300" y="210" text-anchor="start" font-size="17" fill="var(--danger-text)" font-weight="bold">25.02</text>
  <text x="560" y="210" text-anchor="end" font-size="13" fill="var(--danger-text)">1,200 shares — best ask</text>
  <line x1="250" y1="258" x2="650" y2="258" stroke="var(--warning-500)" stroke-width="2" stroke-dasharray="6 5"/>
  <text x="450" y="280" text-anchor="middle" font-size="14" fill="var(--warning-text)" font-weight="bold">Spread: 0.04. Quoted price 25.00 is the midpoint.</text>
  <rect x="250" y="296" width="400" height="150" rx="8" fill="var(--diagram-bg)" stroke="var(--success-500)" stroke-width="2"/>
  <text x="300" y="330" text-anchor="start" font-size="17" fill="var(--success-text)" font-weight="bold">24.98</text>
  <text x="560" y="330" text-anchor="end" font-size="13" fill="var(--success-text)">1,100 shares — best bid</text>
  <text x="300" y="364" text-anchor="start" font-size="14" fill="var(--diagram-text)">24.96</text>
  <text x="560" y="364" text-anchor="end" font-size="13" fill="var(--diagram-muted)">700 shares</text>
  <text x="300" y="392" text-anchor="start" font-size="14" fill="var(--diagram-text)">24.94</text>
  <text x="560" y="392" text-anchor="end" font-size="13" fill="var(--diagram-muted)">1,500 shares</text>
  <text x="450" y="428" text-anchor="middle" font-size="14" fill="var(--success-text)" font-weight="bold">Buyers: the bid side</text>
  <text x="450" y="486" text-anchor="middle" font-size="14" fill="var(--diagram-text)" font-weight="bold">Buy at 25.02 and sell at 24.98 a moment later: down 0.16% with nothing having happened.</text>
  <text x="450" y="512" text-anchor="middle" font-size="12" fill="var(--diagram-muted)">A market order crosses the spread on purpose. A limit order waits in the book instead.</text>
</svg><svg data-key="stocks/stocks-01-4-index-weighting" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 560" font-family="Arial, Helvetica, sans-serif" role="img">
  <rect x="0" y="0" width="900" height="560" fill="var(--diagram-bg)"/>
  <text x="450" y="34" text-anchor="middle" font-size="21" fill="var(--diagram-text)" font-weight="bold">Same Three Companies, Three Different Answers</text>
  <text x="450" y="57" text-anchor="middle" font-size="13" fill="var(--diagram-muted)">Company A: 300 a share, worth 10bn. Company B: 50 a share, worth 80bn. Company C: 100 a share, worth 30bn.</text>
  <text x="318" y="114" text-anchor="end" font-size="13" fill="var(--diagram-text)">A: influence when weighted by price</text>
  <rect x="330" y="96" width="361.90476190476187" height="26" rx="3" fill="var(--danger-500)"/>
  <text x="701.9047619047619" y="114" text-anchor="start" font-size="13" fill="var(--danger-text)" font-weight="bold">67%</text>
  <text x="318" y="152" text-anchor="end" font-size="13" fill="var(--diagram-text)">B: influence when weighted by price</text>
  <rect x="330" y="134" width="60.317460317460316" height="26" rx="3" fill="var(--danger-500)"/>
  <text x="400.3174603174603" y="152" text-anchor="start" font-size="13" fill="var(--danger-text)" font-weight="bold">11%</text>
  <text x="318" y="190" text-anchor="end" font-size="13" fill="var(--diagram-text)">C: influence when weighted by price</text>
  <rect x="330" y="172" width="120.63492063492063" height="26" rx="3" fill="var(--danger-500)"/>
  <text x="460.6349206349206" y="190" text-anchor="start" font-size="13" fill="var(--danger-text)" font-weight="bold">22%</text>
  <line x1="60" y1="232" x2="840" y2="232" stroke="var(--diagram-grid)" stroke-width="1"/>
  <text x="318" y="268" text-anchor="end" font-size="13" fill="var(--diagram-text)">A: influence when weighted by market value</text>
  <rect x="330" y="250" width="45.238095238095234" height="26" rx="3" fill="var(--info-500)"/>
  <text x="385.23809523809524" y="268" text-anchor="start" font-size="13" fill="var(--info-text)" font-weight="bold">8%</text>
  <text x="318" y="306" text-anchor="end" font-size="13" fill="var(--diagram-text)">B: influence when weighted by market value</text>
  <rect x="330" y="288" width="361.90476190476187" height="26" rx="3" fill="var(--info-500)"/>
  <text x="701.9047619047619" y="306" text-anchor="start" font-size="13" fill="var(--info-text)" font-weight="bold">67%</text>
  <text x="318" y="344" text-anchor="end" font-size="13" fill="var(--diagram-text)">C: influence when weighted by market value</text>
  <rect x="330" y="326" width="135.71428571428572" height="26" rx="3" fill="var(--info-500)"/>
  <text x="475.7142857142857" y="344" text-anchor="start" font-size="13" fill="var(--info-text)" font-weight="bold">25%</text>
  <line x1="60" y1="386" x2="840" y2="386" stroke="var(--diagram-grid)" stroke-width="1"/>
  <text x="318" y="422" text-anchor="end" font-size="13" fill="var(--diagram-text)">A, B and C: equal weighting</text>
  <rect x="330" y="404" width="180.77142857142857" height="26" rx="3" fill="var(--success-500)"/>
  <text x="520.7714285714286" y="422" text-anchor="start" font-size="13" fill="var(--success-text)" font-weight="bold">33% each</text>
  <text x="450" y="486" text-anchor="middle" font-size="13" fill="var(--diagram-text)" font-weight="bold">The smallest company dominates a price-weighted index. The largest dominates a cap-weighted one.</text>
  <text x="450" y="510" text-anchor="middle" font-size="12" fill="var(--diagram-muted)">Share price alone says nothing about the size of a company. "The market rose 1%" is a claim about a chosen rule.</text>
</svg><svg data-key="stocks/stocks-01-5-etf-creation" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 560" font-family="Arial, Helvetica, sans-serif" role="img">
  <rect x="0" y="0" width="900" height="560" fill="var(--diagram-bg)"/>
  <text x="450" y="34" text-anchor="middle" font-size="21" fill="var(--diagram-text)" font-weight="bold">Creation and Redemption: Why an ETF Price Tracks What It Holds</text>
  <text x="450" y="57" text-anchor="middle" font-size="13" fill="var(--diagram-muted)">An ETF trading at 100.40 while the basket it holds is worth 100.00.</text>
  <rect x="40" y="130" width="170.5" height="96" rx="8" fill="var(--diagram-bg)" stroke="var(--danger-500)" stroke-width="2"/>
  <text x="125.25" y="158" text-anchor="middle" font-size="13" fill="var(--danger-500)" font-weight="bold">ETF trades above the</text>
  <text x="125.25" y="174" text-anchor="middle" font-size="13" fill="var(--danger-500)" font-weight="bold">basket</text>
  <text x="125.25" y="248" text-anchor="middle" font-size="12" fill="var(--diagram-muted)">Price 100.40, net asset</text>
  <text x="125.25" y="263" text-anchor="middle" font-size="12" fill="var(--diagram-muted)">value 100.00</text>
  <text x="233.5" y="183" text-anchor="middle" font-size="12" fill="var(--diagram-muted)">then</text>
  <rect x="256.5" y="130" width="170.5" height="96" rx="8" fill="var(--diagram-bg)" stroke="var(--info-500)" stroke-width="2"/>
  <text x="341.75" y="158" text-anchor="middle" font-size="13" fill="var(--info-500)" font-weight="bold">Authorised participant</text>
  <text x="341.75" y="174" text-anchor="middle" font-size="13" fill="var(--info-500)" font-weight="bold">buys the underlying</text>
  <text x="341.75" y="190" text-anchor="middle" font-size="13" fill="var(--info-500)" font-weight="bold">shares</text>
  <text x="341.75" y="248" text-anchor="middle" font-size="12" fill="var(--diagram-muted)">Cost: 100.00 a share</text>
  <text x="450" y="183" text-anchor="middle" font-size="12" fill="var(--diagram-muted)">then</text>
  <rect x="473" y="130" width="170.5" height="96" rx="8" fill="var(--diagram-bg)" stroke="var(--info-500)" stroke-width="2"/>
  <text x="558.25" y="158" text-anchor="middle" font-size="13" fill="var(--info-500)" font-weight="bold">Delivers the basket,</text>
  <text x="558.25" y="174" text-anchor="middle" font-size="13" fill="var(--info-500)" font-weight="bold">receives new ETF shares</text>
  <text x="558.25" y="248" text-anchor="middle" font-size="12" fill="var(--diagram-muted)">Creation, done with the fund</text>
  <text x="666.5" y="183" text-anchor="middle" font-size="12" fill="var(--diagram-muted)">then</text>
  <rect x="689.5" y="130" width="170.5" height="96" rx="8" fill="var(--diagram-bg)" stroke="var(--success-500)" stroke-width="2"/>
  <text x="774.75" y="158" text-anchor="middle" font-size="13" fill="var(--success-500)" font-weight="bold">Sells them on the</text>
  <text x="774.75" y="174" text-anchor="middle" font-size="13" fill="var(--success-500)" font-weight="bold">exchange at 100.40</text>
  <text x="774.75" y="248" text-anchor="middle" font-size="12" fill="var(--diagram-muted)">The extra supply pushes the</text>
  <text x="774.75" y="263" text-anchor="middle" font-size="12" fill="var(--diagram-muted)">price down</text>
  <line x1="60" y1="330" x2="840" y2="330" stroke="var(--diagram-grid)" stroke-width="1"/>
  <text x="450" y="366" text-anchor="middle" font-size="15" fill="var(--warning-text)" font-weight="bold">Pursuing the profit is what closes the gap. Nothing enforces it — an incentive does.</text>
  <rect x="120" y="392" width="660" height="118" rx="8" fill="var(--diagram-bg)" stroke="var(--warning-500)" stroke-width="2"/>
  <text x="450" y="420" text-anchor="middle" font-size="13" fill="var(--warning-text)" font-weight="bold">Which is why premiums and discounts widen exactly when you least want them to</text>
  <text x="450" y="446" text-anchor="middle" font-size="12" fill="var(--diagram-muted)">If the underlying market is closed, illiquid or falling fast, the participant cannot price or trade</text>
  <text x="450" y="466" text-anchor="middle" font-size="12" fill="var(--diagram-muted)">the basket confidently. The mechanism weakens in exactly the conditions that make you want to sell.</text>
  <text x="450" y="494" text-anchor="middle" font-size="12" fill="var(--diagram-text)" font-weight="bold">The SEC describes the market price as generally kept close to net asset value. Generally.</text>
</svg><svg data-key="stocks/stocks-01-6-ex-dividend" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 560" font-family="Arial, Helvetica, sans-serif" role="img">
  <rect x="0" y="0" width="900" height="560" fill="var(--diagram-bg)"/>
  <text x="450" y="34" text-anchor="middle" font-size="21" fill="var(--diagram-text)" font-weight="bold">A Dividend Is Not Free Money</text>
  <text x="450" y="57" text-anchor="middle" font-size="13" fill="var(--diagram-muted)">A share at 40.00 pays a dividend of 1.00. What happens on the ex-dividend date.</text>
  <text x="230" y="106" text-anchor="middle" font-size="15" fill="var(--diagram-text)" font-weight="bold">Day before</text>
  <rect x="160" y="122" width="140" height="260" rx="6" fill="var(--info-500)"/>
  <text x="230" y="260" text-anchor="middle" font-size="20" fill="var(--diagram-bg)" font-weight="bold">40.00</text>

  <text x="450" y="260" text-anchor="middle" font-size="13" fill="var(--diagram-muted)">the company pays out</text>
  <text x="450" y="282" text-anchor="middle" font-size="13" fill="var(--diagram-muted)">cash it was holding</text>
  <text x="670" y="106" text-anchor="middle" font-size="15" fill="var(--diagram-text)" font-weight="bold">Ex-dividend date</text>

  <text x="670" y="138" text-anchor="middle" font-size="12" fill="var(--diagram-bg)" font-weight="bold">1.00 cash</text>
  <text x="670" y="406" text-anchor="middle" font-size="13" fill="var(--diagram-muted)">Share price plus the payment</text>
  <text x="670" y="428" text-anchor="middle" font-size="14" fill="var(--diagram-text)" font-weight="bold">Total held: 40.00</text>
  <line x1="60" y1="456" x2="840" y2="456" stroke="var(--diagram-grid)" stroke-width="1"/>
  <text x="450" y="488" text-anchor="middle" font-size="14" fill="var(--warning-text)" font-weight="bold">The same 40.00, rearranged. Nothing was created, and the arrangement is what feels different.</text>
  <text x="450" y="514" text-anchor="middle" font-size="12" fill="var(--diagram-muted)">Judge a holding on total return, which counts price and dividends together. Not on yield alone.</text>
</svg><svg data-key="stocks/stocks-01-7-fee-compounding" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 560" font-family="Arial, Helvetica, sans-serif" role="img">

  <text x="450" y="520" text-anchor="middle" font-size="12" fill="var(--diagram-muted)">The fee is charged on the whole balance every year, including on the gains earlier fees prevented.</text>
</svg><svg data-key="stocks/stocks-02-1-three-statements" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 560" font-family="Arial, Helvetica, sans-serif" role="img">
  <rect x="0" y="0" width="900" height="560" fill="var(--diagram-bg)"/>
  <text x="450" y="34" text-anchor="middle" font-size="21" fill="var(--diagram-text)" font-weight="bold">Three Statements, Three Different Questions</text>
  <text x="450" y="57" text-anchor="middle" font-size="13" fill="var(--diagram-muted)">Beginners read one of them. Reading all three is what separates a view from a guess.</text>
  <rect x="30" y="84" width="265.3333333333333" height="430" rx="10" fill="var(--diagram-bg)" stroke="var(--info-500)" stroke-width="2"/>
  <text x="162.66666666666666" y="114" text-anchor="middle" font-size="16" fill="var(--info-text)" font-weight="bold">Income statement</text>
  <text x="46" y="146" text-anchor="start" font-size="13" fill="var(--diagram-text)" font-weight="bold">Was the business profitable over</text>
  <text x="46" y="165" text-anchor="start" font-size="13" fill="var(--diagram-text)" font-weight="bold">these months?</text>
  <text x="46" y="202" text-anchor="start" font-size="13" fill="var(--diagram-muted)">Revenue is recorded when it is</text>
  <text x="46" y="221" text-anchor="start" font-size="13" fill="var(--diagram-muted)">earned, not when it is paid.</text>
  <text x="46" y="258" text-anchor="start" font-size="13" fill="var(--diagram-text)" font-weight="bold">Involves judgement.</text>
  <text x="46" y="285" text-anchor="start" font-size="13" fill="var(--diagram-muted)">How fast to depreciate equipment,</text>
  <text x="46" y="304" text-anchor="start" font-size="13" fill="var(--diagram-muted)">when a sale counts as made, how much</text>
  <text x="46" y="323" text-anchor="start" font-size="13" fill="var(--diagram-muted)">to set aside for bad debts.</text>
  <text x="46" y="360" text-anchor="start" font-size="13" fill="var(--diagram-text)" font-weight="bold">Profit is an opinion.</text>
  <rect x="317.3333333333333" y="84" width="265.3333333333333" height="430" rx="10" fill="var(--diagram-bg)" stroke="var(--warning-500)" stroke-width="2"/>
  <text x="450" y="114" text-anchor="middle" font-size="16" fill="var(--warning-text)" font-weight="bold">Balance sheet</text>
  <text x="333.3333333333333" y="146" text-anchor="start" font-size="13" fill="var(--diagram-text)" font-weight="bold">What does the business consist of</text>
  <text x="333.3333333333333" y="165" text-anchor="start" font-size="13" fill="var(--diagram-text)" font-weight="bold">right now?</text>
  <text x="333.3333333333333" y="202" text-anchor="start" font-size="13" fill="var(--diagram-muted)">A single moment, not a period.</text>
  <text x="333.3333333333333" y="221" text-anchor="start" font-size="13" fill="var(--diagram-muted)">Assets equal liabilities plus</text>
  <text x="333.3333333333333" y="240" text-anchor="start" font-size="13" fill="var(--diagram-muted)">equity, by identity.</text>
  <text x="333.3333333333333" y="277" text-anchor="start" font-size="13" fill="var(--diagram-text)" font-weight="bold">Equity is the residual again.</text>
  <text x="333.3333333333333" y="304" text-anchor="start" font-size="13" fill="var(--diagram-muted)">Assets 500, owed 400, equity 100.</text>
  <text x="333.3333333333333" y="323" text-anchor="start" font-size="13" fill="var(--diagram-muted)">Write the assets down to 380 and the</text>
  <text x="333.3333333333333" y="342" text-anchor="start" font-size="13" fill="var(--diagram-muted)">equity is gone.</text>
  <text x="333.3333333333333" y="379" text-anchor="start" font-size="13" fill="var(--diagram-text)" font-weight="bold">This is Lesson 1 from another angle.</text>
  <rect x="604.6666666666666" y="84" width="265.3333333333333" height="430" rx="10" fill="var(--diagram-bg)" stroke="var(--success-500)" stroke-width="2"/>
  <text x="737.3333333333333" y="114" text-anchor="middle" font-size="16" fill="var(--success-text)" font-weight="bold">Cash flow statement</text>
  <text x="620.6666666666666" y="146" text-anchor="start" font-size="13" fill="var(--diagram-text)" font-weight="bold">Did money genuinely move?</text>
  <text x="620.6666666666666" y="183" text-anchor="start" font-size="13" fill="var(--diagram-muted)">Hardest of the three to dress up,</text>
  <text x="620.6666666666666" y="202" text-anchor="start" font-size="13" fill="var(--diagram-muted)">because cash either arrived or it</text>
  <text x="620.6666666666666" y="221" text-anchor="start" font-size="13" fill="var(--diagram-muted)">did not.</text>
  <text x="620.6666666666666" y="258" text-anchor="start" font-size="13" fill="var(--diagram-text)" font-weight="bold">Free cash flow is the owner's</text>
  <text x="620.6666666666666" y="277" text-anchor="start" font-size="13" fill="var(--diagram-text)" font-weight="bold">number.</text>
  <text x="620.6666666666666" y="304" text-anchor="start" font-size="13" fill="var(--diagram-muted)">Operating cash less the spending</text>
  <text x="620.6666666666666" y="323" text-anchor="start" font-size="13" fill="var(--diagram-muted)">needed to keep the business running.</text>
  <text x="620.6666666666666" y="360" text-anchor="start" font-size="13" fill="var(--diagram-text)" font-weight="bold">Cash is a fact.</text>
</svg><svg data-key="stocks/stocks-02-2-cyclical-multiple" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 560" font-family="Arial, Helvetica, sans-serif" role="img">
  <rect x="0" y="0" width="900" height="560" fill="var(--diagram-bg)"/>
  <text x="450" y="34" text-anchor="middle" font-size="21" fill="var(--diagram-text)" font-weight="bold">Why a Low Multiple Is Most Dangerous When It Looks Best</text>
  <text x="450" y="57" text-anchor="middle" font-size="13" fill="var(--diagram-muted)">A cyclical company through one commodity cycle. Earnings move; the multiple moves against them.</text>

  <line x1="90" y1="250" x2="730" y2="250" stroke="var(--diagram-grid)" stroke-width="1"/>
  <text x="80" y="254" text-anchor="end" font-size="12" fill="var(--diagram-muted)">0.0</text>
  <text x="90" y="272" text-anchor="middle" font-size="12" fill="var(--diagram-muted)">year 1</text>

  <text x="303.33333333333337" y="272" text-anchor="middle" font-size="12" fill="var(--diagram-muted)">3</text>
  <text x="410" y="272" text-anchor="middle" font-size="12" fill="var(--diagram-muted)">4</text>

  <text x="623.3333333333334" y="272" text-anchor="middle" font-size="12" fill="var(--diagram-muted)">6</text>

  <line x1="90" y1="310" x2="730" y2="310" stroke="var(--diagram-grid)" stroke-width="1" stroke-dasharray="3 5"/>

  <line x1="90" y1="360" x2="730" y2="360" stroke="var(--diagram-grid)" stroke-width="1" stroke-dasharray="3 5"/>

  <line x1="90" y1="410" x2="730" y2="410" stroke="var(--diagram-grid)" stroke-width="1" stroke-dasharray="3 5"/>

  <line x1="90" y1="460" x2="730" y2="460" stroke="var(--diagram-grid)" stroke-width="1"/>
  <text x="80" y="464" text-anchor="end" font-size="12" fill="var(--diagram-muted)">0</text>
  <text x="90" y="482" text-anchor="middle" font-size="12" fill="var(--diagram-muted)">year 1</text>
  <text x="196.66666666666669" y="482" text-anchor="middle" font-size="12" fill="var(--diagram-muted)">2</text>
  <text x="303.33333333333337" y="482" text-anchor="middle" font-size="12" fill="var(--diagram-muted)">3</text>
  <text x="410" y="482" text-anchor="middle" font-size="12" fill="var(--diagram-muted)">4</text>
  <text x="516.6666666666667" y="482" text-anchor="middle" font-size="12" fill="var(--diagram-muted)">5</text>
  <text x="623.3333333333334" y="482" text-anchor="middle" font-size="12" fill="var(--diagram-muted)">6</text>
  <text x="730" y="482" text-anchor="middle" font-size="12" fill="var(--diagram-muted)">7</text>
  <polyline points="90.0,360.0 196.7,413.3 303.3,433.3 410.0,440.0 516.7,423.3 623.3,373.3 730.0,326.7" fill="none" stroke="var(--danger-500)" stroke-width="3"/>
  <text x="738" y="330.6666666666667" text-anchor="start" font-size="12" fill="var(--danger-text)" font-weight="bold">Price to earnings</text>
  <line x1="410" y1="100" x2="410" y2="460" stroke="var(--warning-500)" stroke-width="2" stroke-dasharray="5 5"/>
  <text x="418" y="96" text-anchor="start" font-size="12" fill="var(--warning-text)" font-weight="bold">peak earnings, lowest multiple</text>
  <text x="450" y="512" text-anchor="middle" font-size="14" fill="var(--diagram-text)" font-weight="bold">The P/E of 6 in year 4 marked the danger. The P/E of 40 in year 7 marked the opportunity.</text>
  <text x="450" y="536" text-anchor="middle" font-size="12" fill="var(--diagram-muted)">A screen for the lowest multiples buys the top of the cycle. Ask where in the cycle the earnings sit.</text>
</svg><svg data-key="stocks/stocks-02-3-value-definitions" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 560" font-family="Arial, Helvetica, sans-serif" role="img">
  <rect x="0" y="0" width="900" height="560" fill="var(--diagram-bg)"/>
  <text x="450" y="34" text-anchor="middle" font-size="21" fill="var(--diagram-text)" font-weight="bold">Which "Value"? The Definition Is a Choice</text>
  <text x="450" y="57" text-anchor="middle" font-size="13" fill="var(--diagram-muted)">Three measures of cheapness, selecting overlapping but genuinely different companies.</text>
  <circle cx="360" cy="270" r="130" fill="var(--info-500)" fill-opacity="0.28" stroke="var(--info-500)" stroke-width="2"/>
  <circle cx="500" cy="230" r="130" fill="var(--success-500)" fill-opacity="0.28" stroke="var(--success-500)" stroke-width="2"/>
  <circle cx="470" cy="360" r="120" fill="var(--warning-500)" fill-opacity="0.24" stroke="var(--warning-500)" stroke-width="2"/>
  <text x="280" y="250" text-anchor="middle" font-size="14" fill="var(--info-text)" font-weight="bold">Book to market</text>
  <text x="280" y="270" text-anchor="middle" font-size="12" fill="var(--diagram-muted)">(Fama and French)</text>
  <text x="590" y="190" text-anchor="middle" font-size="14" fill="var(--success-text)" font-weight="bold">Earnings</text>
  <text x="470" y="452" text-anchor="middle" font-size="14" fill="var(--warning-text)" font-weight="bold">Cash flow</text>
  <text x="430" y="288" text-anchor="middle" font-size="12" fill="var(--diagram-text)" font-weight="bold">all three</text>
  <rect x="660" y="110" width="210" height="200" rx="8" fill="var(--diagram-bg)" stroke="var(--diagram-grid)" stroke-width="2"/>
  <text x="765" y="138" text-anchor="middle" font-size="14" fill="var(--diagram-text)" font-weight="bold">And then</text>
  <text x="675" y="162" text-anchor="start" font-size="12" fill="var(--diagram-muted)">Book value describes a</text>
  <text x="675" y="178" text-anchor="start" font-size="12" fill="var(--diagram-muted)">factory well and software</text>
  <text x="675" y="194" text-anchor="start" font-size="12" fill="var(--diagram-muted)">badly.</text>
  <text x="675" y="226" text-anchor="start" font-size="12" fill="var(--diagram-muted)">A fund calling itself a</text>
  <text x="675" y="242" text-anchor="start" font-size="12" fill="var(--diagram-muted)">value fund need not use</text>
  <text x="675" y="258" text-anchor="start" font-size="12" fill="var(--diagram-muted)">the measure the study</text>
  <text x="675" y="274" text-anchor="start" font-size="12" fill="var(--diagram-muted)">used.</text>
  <text x="675" y="306" text-anchor="start" font-size="12" fill="var(--diagram-muted)">Costs are subtracted from</text>
  <text x="675" y="322" text-anchor="start" font-size="12" fill="var(--diagram-muted)">the premium, not from</text>
  <text x="675" y="338" text-anchor="start" font-size="12" fill="var(--diagram-muted)">somewhere else.</text>
  <text x="450" y="508" text-anchor="middle" font-size="13" fill="var(--diagram-text)" font-weight="bold">A finding about one definition of value is not automatically a finding about the fund on your screen.</text>
  <text x="450" y="532" text-anchor="middle" font-size="12" fill="var(--diagram-muted)">Fama and French 1992 measured book-to-market across large baskets over decades. Ask what your fund measures.</text>
</svg><svg data-key="stocks/stocks-02-4-efficiency-forms" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 560" font-family="Arial, Helvetica, sans-serif" role="img">
  <rect x="0" y="0" width="900" height="560" fill="var(--diagram-bg)"/>
  <text x="450" y="34" text-anchor="middle" font-size="21" fill="var(--diagram-text)" font-weight="bold">Three Forms of Efficiency, and the Paradox Underneath</text>
  <text x="450" y="57" text-anchor="middle" font-size="13" fill="var(--diagram-muted)">Each form contains the one before it. The strongest cannot exist.</text>
  <rect x="70" y="92" width="500" height="340" rx="10" fill="var(--diagram-bg)" stroke="var(--danger-500)" stroke-width="2"/>
  <text x="90" y="118" text-anchor="start" font-size="14" fill="var(--danger-text)" font-weight="bold">Strong form: all information, including private</text>
  <rect x="96" y="136" width="448" height="274" rx="10" fill="var(--diagram-bg)" stroke="var(--warning-500)" stroke-width="2"/>
  <text x="116" y="162" text-anchor="start" font-size="14" fill="var(--warning-text)" font-weight="bold">Semi-strong: all public information</text>
  <rect x="122" y="180" width="396" height="208" rx="10" fill="var(--diagram-bg)" stroke="var(--success-500)" stroke-width="2"/>
  <text x="142" y="206" text-anchor="start" font-size="14" fill="var(--success-text)" font-weight="bold">Weak form: past prices</text>
  <text x="142" y="236" text-anchor="start" font-size="12" fill="var(--diagram-muted)">Studying price history alone cannot</text>
  <text x="142" y="254" text-anchor="start" font-size="12" fill="var(--diagram-muted)">produce an edge.</text>
  <text x="142" y="288" text-anchor="start" font-size="12" fill="var(--diagram-muted)">Results announced at 07:00 have moved</text>
  <text x="142" y="306" text-anchor="start" font-size="12" fill="var(--diagram-muted)">the price before the market opens.</text>
  <text x="142" y="344" text-anchor="start" font-size="12" fill="var(--diagram-muted)">Trading on material private information</text>
  <text x="142" y="362" text-anchor="start" font-size="12" fill="var(--diagram-muted)">works, and is illegal everywhere.</text>
  <rect x="596" y="92" width="260" height="340" rx="10" fill="var(--diagram-bg)" stroke="var(--info-500)" stroke-width="2"/>
  <text x="726" y="120" text-anchor="middle" font-size="14" fill="var(--info-text)" font-weight="bold">Grossman and Stiglitz, 1980</text>
  <text x="612" y="152" text-anchor="start" font-size="12" fill="var(--diagram-muted)">Gathering information costs</text>
  <text x="612" y="169" text-anchor="start" font-size="12" fill="var(--diagram-muted)">money.</text>
  <text x="612" y="202" text-anchor="start" font-size="12" fill="var(--diagram-muted)">If prices already reflected</text>
  <text x="612" y="219" text-anchor="start" font-size="12" fill="var(--diagram-muted)">everything, nobody would be</text>
  <text x="612" y="236" text-anchor="start" font-size="12" fill="var(--diagram-muted)">paid for gathering it.</text>
  <text x="612" y="269" text-anchor="start" font-size="12" fill="var(--diagram-muted)">So nobody would gather it, and</text>
  <text x="612" y="286" text-anchor="start" font-size="12" fill="var(--diagram-muted)">prices would stop reflecting</text>
  <text x="612" y="303" text-anchor="start" font-size="12" fill="var(--diagram-muted)">it.</text>
  <text x="612" y="336" text-anchor="start" font-size="12" fill="var(--diagram-muted)">Some inefficiency has to</text>
  <text x="612" y="353" text-anchor="start" font-size="12" fill="var(--diagram-muted)">persist, as the payment for</text>
  <text x="612" y="370" text-anchor="start" font-size="12" fill="var(--diagram-muted)">the work.</text>
  <text x="450" y="476" text-anchor="middle" font-size="13" fill="var(--diagram-text)" font-weight="bold">Efficiency is a spectrum, not a switch — and it means prices reflect information, not that they are right.</text>
  <text x="450" y="502" text-anchor="middle" font-size="12" fill="var(--diagram-muted)">The argument does not tell you that you are the one collecting the payment. Sharpe's arithmetic says most are not.</text>
  <text x="450" y="528" text-anchor="middle" font-size="12" fill="var(--diagram-muted)">A private investor's real advantage is structural: no clients, no quarterly report, no career risk from waiting.</text>
</svg><svg data-key="stocks/stocks-02-5-diversification-floor" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 560" font-family="Arial, Helvetica, sans-serif" role="img">
  <rect x="0" y="0" width="900" height="560" fill="var(--diagram-bg)"/>
  <text x="450" y="34" text-anchor="middle" font-size="21" fill="var(--diagram-text)" font-weight="bold">How Many Holdings Is Enough? The Literature Disagrees</text>
  <text x="450" y="57" text-anchor="middle" font-size="13" fill="var(--diagram-muted)">Adding holdings removes specific risk. It does nothing at all to market risk.</text>
  <line x1="90" y1="100" x2="790" y2="100" stroke="var(--diagram-grid)" stroke-width="1" stroke-dasharray="3 5"/>
  <text x="80" y="104" text-anchor="end" font-size="12" fill="var(--diagram-muted)">100</text>
  <line x1="90" y1="170" x2="790" y2="170" stroke="var(--diagram-grid)" stroke-width="1" stroke-dasharray="3 5"/>
  <text x="80" y="174" text-anchor="end" font-size="12" fill="var(--diagram-muted)">75</text>
  <line x1="90" y1="240" x2="790" y2="240" stroke="var(--diagram-grid)" stroke-width="1" stroke-dasharray="3 5"/>
  <text x="80" y="244" text-anchor="end" font-size="12" fill="var(--diagram-muted)">50</text>
  <line x1="90" y1="310" x2="790" y2="310" stroke="var(--diagram-grid)" stroke-width="1" stroke-dasharray="3 5"/>
  <text x="80" y="314" text-anchor="end" font-size="12" fill="var(--diagram-muted)">25</text>
  <line x1="90" y1="380" x2="790" y2="380" stroke="var(--diagram-grid)" stroke-width="1"/>
  <text x="80" y="384" text-anchor="end" font-size="12" fill="var(--diagram-muted)">0</text>
  <text x="90" y="402" text-anchor="middle" font-size="12" fill="var(--diagram-muted)">1</text>
  <text x="177.5" y="402" text-anchor="middle" font-size="12" fill="var(--diagram-muted)">5</text>
  <text x="265" y="402" text-anchor="middle" font-size="12" fill="var(--diagram-muted)">10</text>
  <text x="352.5" y="402" text-anchor="middle" font-size="12" fill="var(--diagram-muted)">15</text>
  <text x="440" y="402" text-anchor="middle" font-size="12" fill="var(--diagram-muted)">20</text>
  <text x="527.5" y="402" text-anchor="middle" font-size="12" fill="var(--diagram-muted)">30</text>
  <text x="615" y="402" text-anchor="middle" font-size="12" fill="var(--diagram-muted)">40</text>
  <text x="702.5" y="402" text-anchor="middle" font-size="12" fill="var(--diagram-muted)">50</text>
  <text x="790" y="402" text-anchor="middle" font-size="12" fill="var(--diagram-muted)">60 holdings</text>
  <polyline points="90.0,100.0 177.5,206.4 265.0,245.6 352.5,265.2 440.0,273.6 527.5,279.2 615.0,282.0 702.5,283.7 790.0,284.8" fill="none" stroke="var(--info-500)" stroke-width="3"/>
  <text x="798" y="288.8" text-anchor="start" font-size="12" fill="var(--info-text)" font-weight="bold">total risk</text>
  <polyline points="90.0,287.6 177.5,287.6 265.0,287.6 352.5,287.6 440.0,287.6 527.5,287.6 615.0,287.6 702.5,287.6 790.0,287.6" fill="none" stroke="var(--danger-500)" stroke-width="2" stroke-dasharray="6 5"/>
  <line x1="200" y1="100" x2="200" y2="380" stroke="var(--success-500)" stroke-width="2" stroke-dasharray="4 4"/>
  <text x="206" y="126" text-anchor="start" font-size="12" fill="var(--success-text)" font-weight="bold">Evans and Archer 1968: the curve flattens</text>
  <text x="206" y="144" text-anchor="start" font-size="12" fill="var(--success-text)" font-weight="bold">by about 10 holdings</text>
  <line x1="462" y1="100" x2="462" y2="380" stroke="var(--warning-500)" stroke-width="2" stroke-dasharray="4 4"/>
  <text x="468" y="176" text-anchor="start" font-size="12" fill="var(--warning-text)" font-weight="bold">Statman 1987: at least 30 for a borrowing</text>
  <text x="468" y="194" text-anchor="start" font-size="12" fill="var(--warning-text)" font-weight="bold">investor, 40 for a lending one</text>
  <text x="600" y="280" text-anchor="start" font-size="12" fill="var(--danger-text)" font-weight="bold">market risk: the floor no holding removes</text>
  <text x="450" y="448" text-anchor="middle" font-size="13" fill="var(--diagram-text)" font-weight="bold">Market risk survives every holding you add. That is the floor, and it is why the curve never reaches zero.</text>
  <text x="450" y="476" text-anchor="middle" font-size="12" fill="var(--diagram-muted)">Counting is the wrong instrument anyway: twenty banks are one bet wearing twenty names.</text>
  <text x="450" y="502" text-anchor="middle" font-size="12" fill="var(--diagram-muted)">The curve shape is illustrative. The two dated findings, and their disagreement, are the point.</text>
</svg><svg data-key="stocks/stocks-03-1-recovery-arithmetic" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 560" font-family="Arial, Helvetica, sans-serif" role="img">
  <rect x="0" y="0" width="900" height="560" fill="var(--diagram-bg)"/>
  <text x="450" y="34" text-anchor="middle" font-size="21" fill="var(--diagram-text)" font-weight="bold">The Arithmetic of Getting Back to Even</text>
  <text x="450" y="57" text-anchor="middle" font-size="13" fill="var(--diagram-muted)">The fall is measured from the peak. The recovery is measured from the much smaller trough.</text>
  <text x="208" y="125" text-anchor="end" font-size="13" fill="var(--diagram-text)">a fall of 20%</text>
  <rect x="220" y="100" width="25" height="40" rx="3" fill="var(--success-500)"/>
  <text x="255" y="125" text-anchor="start" font-size="13" fill="var(--success-text)" font-weight="bold">needs a gain of 25.0%</text>
  <text x="208" y="191" text-anchor="end" font-size="13" fill="var(--diagram-text)">a fall of 30%</text>
  <rect x="220" y="166" width="42.85714285714286" height="40" rx="3" fill="var(--success-500)"/>
  <text x="272.8571428571429" y="191" text-anchor="start" font-size="13" fill="var(--success-text)" font-weight="bold">needs a gain of 42.9%</text>
  <text x="208" y="257" text-anchor="end" font-size="13" fill="var(--diagram-text)">a fall of 50%</text>
  <rect x="220" y="232" width="100" height="40" rx="3" fill="var(--warning-500)"/>
  <text x="330" y="257" text-anchor="start" font-size="13" fill="var(--warning-text)" font-weight="bold">needs a gain of 100.0%</text>
  <text x="208" y="323" text-anchor="end" font-size="13" fill="var(--diagram-text)">a fall of 56.8%</text>
  <rect x="220" y="298" width="131.37436372049973" height="40" rx="3" fill="var(--warning-500)"/>
  <text x="361.37436372049973" y="323" text-anchor="start" font-size="13" fill="var(--warning-text)" font-weight="bold">needs a gain of 131%</text>
  <text x="208" y="389" text-anchor="end" font-size="13" fill="var(--diagram-text)">a fall of 77.9%</text>
  <rect x="220" y="364" width="353.1037607612145" height="40" rx="3" fill="var(--danger-500)"/>
  <text x="583.1037607612145" y="389" text-anchor="start" font-size="13" fill="var(--danger-text)" font-weight="bold">needs a gain of 353%</text>
  <line x1="60" y1="442" x2="840" y2="442" stroke="var(--diagram-grid)" stroke-width="1"/>
  <text x="450" y="474" text-anchor="middle" font-size="14" fill="var(--diagram-text)" font-weight="bold">A drawdown twice as deep takes far more than twice as much to repair.</text>
  <text x="450" y="500" text-anchor="middle" font-size="12" fill="var(--diagram-muted)">56.8% is the S&amp;P 500 in 2007 to 2009. 77.9% is the Nasdaq Composite in 2000 to 2002.</text>
  <text x="450" y="524" text-anchor="middle" font-size="12" fill="var(--diagram-muted)">Which is the arithmetic reason to care more about avoiding large losses than about capturing large gains.</text>
</svg><svg data-key="stocks/stocks-03-2-position-sizing" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 560" font-family="Arial, Helvetica, sans-serif" role="img">
  <rect x="0" y="0" width="900" height="560" fill="var(--diagram-bg)"/>
  <text x="450" y="34" text-anchor="middle" font-size="21" fill="var(--diagram-text)" font-weight="bold">The Same Bad News, at Four Different Position Sizes</text>
  <text x="450" y="57" text-anchor="middle" font-size="13" fill="var(--diagram-muted)">A company you hold falls 60%. What that costs the portfolio depends only on the size you chose.</text>
  <text x="188" y="134" text-anchor="end" font-size="13" fill="var(--diagram-text)">2% position</text>
  <rect x="200" y="108" width="19.384615384615383" height="42" rx="3" fill="var(--success-500)"/>
  <text x="229.3846153846154" y="134" text-anchor="start" font-size="13" fill="var(--success-text)" font-weight="bold">portfolio down 1.2% — an ordinary week</text>
  <text x="188" y="204" text-anchor="end" font-size="13" fill="var(--diagram-text)">10% position</text>
  <rect x="200" y="178" width="96.92307692307693" height="42" rx="3" fill="var(--warning-500)"/>
  <text x="306.9230769230769" y="204" text-anchor="start" font-size="13" fill="var(--warning-text)" font-weight="bold">portfolio down 6% — a bad month</text>
  <text x="188" y="274" text-anchor="end" font-size="13" fill="var(--diagram-text)">25% position</text>
  <rect x="200" y="248" width="242.3076923076923" height="42" rx="3" fill="var(--danger-500)"/>
  <text x="452.30769230769226" y="274" text-anchor="start" font-size="13" fill="var(--danger-text)" font-weight="bold">portfolio down 15% — a bad year</text>
  <text x="188" y="344" text-anchor="end" font-size="13" fill="var(--diagram-text)">40% position</text>
  <rect x="200" y="318" width="387.69230769230774" height="42" rx="3" fill="var(--danger-500)"/>
  <text x="597.6923076923077" y="344" text-anchor="start" font-size="13" fill="var(--danger-text)" font-weight="bold">portfolio down 24% — a changed plan</text>
  <line x1="60" y1="400" x2="840" y2="400" stroke="var(--diagram-grid)" stroke-width="1"/>
  <text x="450" y="434" text-anchor="middle" font-size="14" fill="var(--diagram-text)" font-weight="bold">You cannot control whether a company disappoints. You control this number completely, in advance.</text>
  <rect x="150" y="452" width="600" height="76" rx="8" fill="var(--diagram-bg)" stroke="var(--warning-500)" stroke-width="2"/>
  <text x="450" y="478" text-anchor="middle" font-size="13" fill="var(--warning-text)" font-weight="bold">And a limit only survives success if it is maintained</text>
  <text x="450" y="502" text-anchor="middle" font-size="12" fill="var(--diagram-muted)">A 2% holding that rises fivefold while everything else is flat becomes about 9% of the portfolio.</text>
  <text x="450" y="520" text-anchor="middle" font-size="12" fill="var(--diagram-muted)">Nobody chose the 9%. Drift is how most large concentrations are actually acquired.</text>
</svg><svg data-key="stocks/stocks-03-3-dca-both-directions" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 560" font-family="Arial, Helvetica, sans-serif" role="img">

  <text x="450" y="57" text-anchor="middle" font-size="13" fill="var(--diagram-muted)">12,000 deployed either at once or in twelve monthly instalments of 1,000.</text>
  <text x="240" y="96" text-anchor="middle" font-size="14" fill="var(--diagram-text)" font-weight="bold">Prices fall, then recover to 105</text>

  <text x="390" y="288" text-anchor="middle" font-size="12" fill="var(--diagram-muted)">12</text>

  <text x="500" y="270" text-anchor="end" font-size="12" fill="var(--diagram-muted)">90</text>

  <text x="288" y="340" text-anchor="end" font-size="13" fill="var(--diagram-text)">averaging in, falling market</text>

  <text x="656.6335483870968" y="340" text-anchor="start" font-size="13" fill="var(--success-text)" font-weight="bold">14,139</text>
  <text x="288" y="378" text-anchor="end" font-size="13" fill="var(--diagram-text)">all at once, falling market</text>
  <rect x="300" y="360" width="308.9032258064516" height="26" rx="3" fill="var(--diagram-muted)"/>
  <text x="618.9032258064516" y="378" text-anchor="start" font-size="13" fill="var(--diagram-text)" font-weight="bold">12,600</text>
  <text x="288" y="416" text-anchor="end" font-size="13" fill="var(--diagram-text)">averaging in, rising market</text>
  <rect x="300" y="398" width="324.61806451612904" height="26" rx="3" fill="var(--danger-500)"/>
  <text x="634.618064516129" y="416" text-anchor="start" font-size="13" fill="var(--danger-text)" font-weight="bold">13,241</text>
  <text x="288" y="454" text-anchor="end" font-size="13" fill="var(--diagram-text)">all at once, rising market</text>
  <rect x="300" y="436" width="358.916129032258" height="26" rx="3" fill="var(--diagram-muted)"/>
  <text x="668.916129032258" y="454" text-anchor="start" font-size="13" fill="var(--diagram-text)" font-weight="bold">14,640</text>
  <text x="450" y="500" text-anchor="middle" font-size="13" fill="var(--diagram-text)" font-weight="bold">Neither outcome was knowable at the start, and markets rise more often than they fall.</text>
  <text x="450" y="524" text-anchor="middle" font-size="12" fill="var(--diagram-muted)">That is where the two-thirds finding comes from. Averaging in buys a behavioural guarantee at a known cost.</text>
</svg><svg data-key="stocks/stocks-03-4-margin-call" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 560" font-family="Arial, Helvetica, sans-serif" role="img">

  <line x1="100" y1="370" x2="760" y2="370" stroke="var(--diagram-grid)" stroke-width="2"/>
  <line x1="540" y1="110" x2="540" y2="370" stroke="var(--danger-500)" stroke-width="2" stroke-dasharray="5 5"/>
  <text x="548" y="140" text-anchor="start" font-size="13" fill="var(--danger-text)" font-weight="bold">margin call at a fall of about 33%</text>
  <text x="548" y="160" text-anchor="start" font-size="12" fill="var(--danger-text)">position worth 13,333, your money 3,333</text>
  <text x="548" y="178" text-anchor="start" font-size="12" fill="var(--danger-text)">a 33% fall in the shares, a 67% loss for you</text>
  <text x="430" y="412" text-anchor="middle" font-size="12" fill="var(--diagram-muted)">fall in the share price</text>
  <line x1="60" y1="424" x2="840" y2="424" stroke="var(--diagram-grid)" stroke-width="1"/>
  <text x="450" y="456" text-anchor="middle" font-size="14" fill="var(--diagram-text)" font-weight="bold">A 33% fall is not a catastrophe. It is smaller than either case study in Chapter 5.</text>
  <text x="450" y="482" text-anchor="middle" font-size="12" fill="var(--diagram-muted)">Leverage does not invent a distant disaster. It converts an ordinary market event into a forced sale.</text>
  <text x="450" y="512" text-anchor="middle" font-size="13" fill="var(--warning-text)" font-weight="bold">And on a short there is no equivalent line at all: the loss has no ceiling, because the price has none.</text>
</svg><svg data-key="stocks/stocks-04-1-behaviour-gap" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 560" font-family="Arial, Helvetica, sans-serif" role="img">
  <rect x="0" y="0" width="900" height="560" fill="var(--diagram-bg)"/>
  <text x="450" y="34" text-anchor="middle" font-size="21" fill="var(--diagram-text)" font-weight="bold">Three Answers to the Same Question, One Widely Repeated</text>
  <text x="450" y="57" text-anchor="middle" font-size="13" fill="var(--diagram-muted)">How much do fund investors lose each year to the timing of their purchases and sales?</text>
  <text x="318" y="124" text-anchor="end" font-size="13" fill="var(--diagram-text)">DALBAR, quoted for years</text>
  <rect x="330" y="98" width="348.3333333333333" height="42" rx="3" fill="var(--danger-500)"/>
  <text x="688.3333333333333" y="124" text-anchor="start" font-size="13" fill="var(--danger-text)" font-weight="bold">about 5 to 6 points a year</text>
  <text x="318" y="190" text-anchor="end" font-size="13" fill="var(--diagram-text)">Morningstar Mind the Gap 2025</text>
  <rect x="330" y="164" width="76" height="42" rx="3" fill="var(--warning-500)"/>
  <text x="416" y="190" text-anchor="start" font-size="13" fill="var(--warning-text)" font-weight="bold">1.2 points a year</text>
  <text x="318" y="256" text-anchor="end" font-size="13" fill="var(--diagram-text)">Fulkerson, Jordan, Riley and Yan 2026</text>
  <rect x="330" y="230" width="6.333333333333333" height="42" rx="3" fill="var(--success-500)"/>
  <text x="346.3333333333333" y="256" text-anchor="start" font-size="13" fill="var(--success-text)" font-weight="bold">about 0.10 points a year</text>
  <rect x="60" y="296" width="380" height="138" rx="8" fill="var(--diagram-bg)" stroke="var(--danger-500)" stroke-width="2"/>
  <text x="250" y="322" text-anchor="middle" font-size="14" fill="var(--danger-text)" font-weight="bold">Why the top bar is wrong</text>
  <text x="76" y="350" text-anchor="start" font-size="12" fill="var(--diagram-muted)">It compares investors making ongoing</text>
  <text x="76" y="368" text-anchor="start" font-size="12" fill="var(--diagram-muted)">contributions against an index return that</text>
  <text x="76" y="386" text-anchor="start" font-size="12" fill="var(--diagram-muted)">assumes one lump sum at the start.</text>
  <text x="76" y="410" text-anchor="start" font-size="12" fill="var(--diagram-muted)">Two different questions. Shown by Pfau,</text>
  <text x="76" y="428" text-anchor="start" font-size="12" fill="var(--diagram-muted)">and independently by Kitces, in 2017.</text>
  <rect x="460" y="296" width="380" height="138" rx="8" fill="var(--diagram-bg)" stroke="var(--success-500)" stroke-width="2"/>
  <text x="650" y="322" text-anchor="middle" font-size="14" fill="var(--success-text)" font-weight="bold">Why the middle bar is contested</text>
  <text x="476" y="350" text-anchor="start" font-size="12" fill="var(--diagram-muted)">Three mathematical errors identified in the</text>
  <text x="476" y="368" text-anchor="start" font-size="12" fill="var(--diagram-muted)">Financial Analysts Journal, 2026. Recomputing</text>
  <text x="476" y="386" text-anchor="start" font-size="12" fill="var(--diagram-muted)">the 2023 edition, a reported 1.7 point gap</text>
  <text x="476" y="404" text-anchor="start" font-size="12" fill="var(--diagram-muted)">should have been 0.03 points.</text>
  <text x="476" y="428" text-anchor="start" font-size="12" fill="var(--diagram-text)" font-weight="bold">Nobody in the chain had a reason to check.</text>
  <text x="450" y="482" text-anchor="middle" font-size="13" fill="var(--diagram-text)" font-weight="bold">All three agree on the pattern: the gap is near zero in broad automatic funds and large in traded ones.</text>
  <text x="450" y="508" text-anchor="middle" font-size="12" fill="var(--diagram-muted)">Barber and Odean 2000 measured the traders directly: 11.4% a year for the most active fifth, against a market at 17.9%.</text>
  <text x="450" y="532" text-anchor="middle" font-size="12" fill="var(--diagram-muted)">Averaging those two populations produces a figure that describes neither of them.</text>
</svg><svg data-key="stocks/stocks-04-2-fee-stack" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 560" font-family="Arial, Helvetica, sans-serif" role="img">
  <rect x="0" y="0" width="900" height="560" fill="var(--diagram-bg)"/>
  <text x="450" y="34" text-anchor="middle" font-size="21" fill="var(--diagram-text)" font-weight="bold">What a Fee Takes From a Thirty-Year Contribution Schedule</text>
  <text x="450" y="57" text-anchor="middle" font-size="13" fill="var(--diagram-muted)">200 a month for 30 years, an underlying return of 7%. Total contributed: 72,000.</text>
  <text x="188" y="125" text-anchor="end" font-size="13" fill="var(--diagram-text)">no fee</text>
  <rect x="200" y="100" width="357.52376" height="40" rx="3" fill="var(--success-500)"/>
  <text x="567.52376" y="125" text-anchor="start" font-size="13" fill="var(--success-text)" font-weight="bold">235,213</text>
  <text x="188" y="189" text-anchor="end" font-size="13" fill="var(--diagram-text)">0.20% a year</text>
  <rect x="200" y="164" width="344.55968" height="40" rx="3" fill="var(--success-500)"/>
  <text x="554.5596800000001" y="189" text-anchor="start" font-size="13" fill="var(--success-text)" font-weight="bold">226,684   (fee took 3.6%)</text>
  <text x="188" y="253" text-anchor="end" font-size="13" fill="var(--diagram-text)">1.00% a year</text>
  <rect x="200" y="228" width="297.69352" height="40" rx="3" fill="var(--warning-500)"/>
  <text x="507.69352" y="253" text-anchor="start" font-size="13" fill="var(--warning-text)" font-weight="bold">195,851   (fee took 16.7%)</text>
  <text x="188" y="317" text-anchor="end" font-size="13" fill="var(--diagram-text)">2.00% a year</text>
  <rect x="200" y="292" width="248.88479999999998" height="40" rx="3" fill="var(--danger-500)"/>
  <text x="458.8848" y="317" text-anchor="start" font-size="13" fill="var(--danger-text)" font-weight="bold">163,740   (fee took 30.4%)</text>
  <line x1="60" y1="368" x2="840" y2="368" stroke="var(--diagram-grid)" stroke-width="1"/>
  <text x="450" y="400" text-anchor="middle" font-size="14" fill="var(--diagram-text)" font-weight="bold">A 1% fee does not take 1%. Over thirty years it takes about a sixth of everything you end up with.</text>
  <text x="450" y="426" text-anchor="middle" font-size="12" fill="var(--diagram-muted)">The 2% line costs about 71,500, which is very nearly the entire 72,000 that was contributed.</text>
  <rect x="150" y="448" width="600" height="82" rx="8" fill="var(--diagram-bg)" stroke="var(--warning-500)" stroke-width="2"/>
  <text x="450" y="474" text-anchor="middle" font-size="13" fill="var(--warning-text)" font-weight="bold">And charges stack</text>
  <text x="450" y="498" text-anchor="middle" font-size="12" fill="var(--diagram-muted)">A fund at 0.20%, a platform at 0.35% and advice at 0.75% total 1.30% a year.</text>
  <text x="450" y="518" text-anchor="middle" font-size="12" fill="var(--diagram-muted)">None looks large alone, and no statement adds them up for you.</text>
</svg><svg data-key="stocks/stocks-04-3-equity-plan" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 560" font-family="Arial, Helvetica, sans-serif" role="img">
  <rect x="0" y="0" width="900" height="560" fill="var(--diagram-bg)"/>
  <text x="450" y="34" text-anchor="middle" font-size="21" fill="var(--diagram-text)" font-weight="bold">Six Questions a Written Plan Answers</text>
  <text x="450" y="57" text-anchor="middle" font-size="13" fill="var(--diagram-muted)">Decisions made while calm, in writing, for use at a moment when you will not be.</text>
  <circle cx="72" cy="108" r="18" fill="var(--info-500)"/>
  <text x="72" y="113" text-anchor="middle" font-size="16" fill="var(--diagram-bg)" font-weight="bold">1</text>
  <text x="104" y="104" text-anchor="start" font-size="15" fill="var(--diagram-text)" font-weight="bold">What is this money for, and when will you need it?</text>
  <text x="104" y="126" text-anchor="start" font-size="12" fill="var(--diagram-muted)">Money needed in three years and money needed in thirty are different problems. Chapter 3 Lesson 1.</text>
  <circle cx="72" cy="174" r="18" fill="var(--info-500)"/>
  <text x="72" y="179" text-anchor="middle" font-size="16" fill="var(--diagram-bg)" font-weight="bold">2</text>
  <text x="104" y="170" text-anchor="start" font-size="15" fill="var(--diagram-text)" font-weight="bold">What will you hold?</text>
  <text x="104" y="192" text-anchor="start" font-size="12" fill="var(--diagram-muted)">Name the funds or the allocation. Not a vague intention to be diversified. Chapter 2 Lesson 5.</text>
  <circle cx="72" cy="240" r="18" fill="var(--success-500)"/>
  <text x="72" y="245" text-anchor="middle" font-size="16" fill="var(--diagram-bg)" font-weight="bold">3</text>
  <text x="104" y="236" text-anchor="start" font-size="15" fill="var(--diagram-text)" font-weight="bold">How much goes in, and how often?</text>
  <text x="104" y="258" text-anchor="start" font-size="12" fill="var(--diagram-muted)">If you are averaging in, the schedule and its end date go in writing here. Chapter 3 Lesson 3.</text>
  <circle cx="72" cy="306" r="18" fill="var(--success-500)"/>
  <text x="72" y="311" text-anchor="middle" font-size="16" fill="var(--diagram-bg)" font-weight="bold">4</text>
  <text x="104" y="302" text-anchor="start" font-size="15" fill="var(--diagram-text)" font-weight="bold">What is the maximum any one position may be?</text>
  <text x="104" y="324" text-anchor="start" font-size="12" fill="var(--diagram-muted)">A limit written in advance is a limit. One decided when a holding is up 300% is a negotiation.</text>
  <circle cx="72" cy="372" r="18" fill="var(--warning-500)"/>
  <text x="72" y="377" text-anchor="middle" font-size="16" fill="var(--diagram-bg)" font-weight="bold">5</text>
  <text x="104" y="368" text-anchor="start" font-size="15" fill="var(--diagram-text)" font-weight="bold">When do you rebalance?</text>
  <text x="104" y="390" text-anchor="start" font-size="12" fill="var(--diagram-muted)">A band responds to the portfolio. A calendar date responds to the calendar. Either beats no rule.</text>
  <circle cx="72" cy="438" r="18" fill="var(--warning-500)"/>
  <text x="72" y="443" text-anchor="middle" font-size="16" fill="var(--diagram-bg)" font-weight="bold">6</text>
  <text x="104" y="434" text-anchor="start" font-size="15" fill="var(--diagram-text)" font-weight="bold">Under what conditions will you sell?</text>
  <text x="104" y="456" text-anchor="start" font-size="12" fill="var(--diagram-muted)">The money is needed; the band was breached; the fee rose; the reason for buying no longer holds.</text>
  <line x1="60" y1="486" x2="840" y2="486" stroke="var(--diagram-grid)" stroke-width="1"/>
  <text x="450" y="514" text-anchor="middle" font-size="13" fill="var(--warning-text)" font-weight="bold">Not a sell condition: it fell a lot and I feel bad. That is the feeling the document exists to overrule.</text>
  <text x="450" y="538" text-anchor="middle" font-size="12" fill="var(--diagram-muted)">Write it when nothing is happening. A plan drafted in a drawdown encodes the panic it was meant to prevent.</text>
</svg><svg data-key="stocks/stocks-05-1-dot-com" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 560" font-family="Arial, Helvetica, sans-serif" role="img">

  <circle cx="230" cy="322.2892857142857" r="6" fill="var(--danger-500)"/>
  <text x="240" y="336" text-anchor="start" font-size="13" fill="var(--danger-text)" font-weight="bold">trough 1,114.11 on 9 October 2002</text>

  <text x="784" y="150" text-anchor="end" font-size="13" fill="var(--success-text)" font-weight="bold">back above the peak, 23 April 2015</text>
  <line x1="60" y1="424" x2="840" y2="424" stroke="var(--diagram-grid)" stroke-width="1"/>
  <text x="450" y="454" text-anchor="middle" font-size="14" fill="var(--diagram-text)" font-weight="bold">A 77.9% fall requires a gain of about 353% simply to return to where it started.</text>
  <text x="450" y="480" text-anchor="middle" font-size="12" fill="var(--diagram-muted)">Someone who bought at the peak aged 55 was 70 before the position was worth what they paid, before inflation.</text>
  <text x="450" y="506" text-anchor="middle" font-size="12" fill="var(--diagram-muted)">And the index recovered partly by composition: failed constituents were removed and replaced by survivors.</text>
  <text x="450" y="530" text-anchor="middle" font-size="11" fill="var(--diagram-muted)">Line shape between the marked dates is illustrative. The three dated levels are the record.</text>
</svg><svg data-key="stocks/stocks-05-2-sequence-risk" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 560" font-family="Arial, Helvetica, sans-serif" role="img">
  <rect x="0" y="0" width="900" height="560" fill="var(--diagram-bg)"/>
  <text x="450" y="34" text-anchor="middle" font-size="21" fill="var(--diagram-text)" font-weight="bold">The Same Market, Two Opposite Experiences</text>
  <text x="450" y="57" text-anchor="middle" font-size="13" fill="var(--diagram-muted)">The S&amp;P 500 fell 56.8% from 9 October 2007 and regained the level in about five and a half years.</text>

  <text x="80" y="159" text-anchor="end" font-size="12" fill="var(--diagram-muted)">1,275</text>
  <line x1="90" y1="210" x2="790" y2="210" stroke="var(--diagram-grid)" stroke-width="1" stroke-dasharray="3 5"/>
  <text x="80" y="214" text-anchor="end" font-size="12" fill="var(--diagram-muted)">850</text>
  <line x1="90" y1="265" x2="790" y2="265" stroke="var(--diagram-grid)" stroke-width="1" stroke-dasharray="3 5"/>
  <text x="80" y="269" text-anchor="end" font-size="12" fill="var(--diagram-muted)">425</text>

  <text x="80" y="324" text-anchor="end" font-size="12" fill="var(--diagram-muted)">0</text>
  <text x="90" y="342" text-anchor="middle" font-size="12" fill="var(--diagram-muted)">Oct 2007</text>
  <text x="177.5" y="342" text-anchor="middle" font-size="12" fill="var(--diagram-muted)"></text>

  <text x="76" y="466" text-anchor="start" font-size="12" fill="var(--diagram-text)" font-weight="bold">The fall handed them cheap assets for years.</text>
