  <!-- column headers -->
  <text x="24" y="222" font-size="12" font-weight="bold" fill="var(--info-text)">Trade</text>
  <text x="250" y="222" font-size="12" font-weight="bold" fill="var(--info-text)">Stop distance, as a percent of price</text>
  <text x="700" y="222" font-size="12" font-weight="bold" fill="var(--info-text)">Position you can hold</text>

  <line x1="24" y1="230" x2="876" y2="230" stroke="var(--info-500)" stroke-width="1"/>

  <!-- ===== ROW 1: EUR/USD ===== -->
  <text x="24" y="256" font-size="14" font-weight="bold" fill="var(--diagram-text)">EUR/USD</text>
  <text x="24" y="274" font-size="11" fill="var(--diagram-text)">50-pip stop at 1.0800</text>
  <text x="24" y="290" font-size="11" fill="var(--diagram-text)">about 1.0 daily moves</text>

  <rect x="250" y="248" width="28" height="26" fill="var(--info-500)"/>
  <text x="286" y="266" font-size="12" fill="var(--diagram-text)">0.46% of price</text>

  <rect x="640" y="244" width="170" height="34" rx="5" fill="var(--info-500)"/>
  <text x="725" y="266" text-anchor="middle" font-size="14" font-weight="bold" fill="var(--diagram-block-ink)">$10,800</text>
  <text x="725" y="292" text-anchor="middle" font-size="11" fill="var(--diagram-text)">0.10 standard lots</text>

  <line x1="24" y1="308" x2="876" y2="308" stroke="var(--info-500)" stroke-width="0.7"/>

  <!-- ===== ROW 2: BTC 2 x ATR ===== -->
  <text x="24" y="336" font-size="14" font-weight="bold" fill="var(--success-text)">Bitcoin at $60,000</text>
  <text x="24" y="354" font-size="11" fill="var(--diagram-text)">stop = 2 x ATR = $3,800</text>
  <text x="24" y="370" font-size="11" fill="var(--diagram-text)">about 2.6 daily moves</text>

  <rect x="250" y="328" width="380" height="26" fill="var(--success-500)"/>
  <text x="440" y="346" text-anchor="middle" font-size="12" font-weight="bold" fill="var(--diagram-block-ink)">6.33% of price</text>

  <rect x="640" y="324" width="12" height="34" rx="3" fill="var(--success-500)"/>
  <text x="725" y="346" text-anchor="middle" font-size="14" font-weight="bold" fill="var(--success-text)">$789</text>
  <text x="725" y="372" text-anchor="middle" font-size="11" fill="var(--diagram-text)">0.01316 BTC</text>

  <line x1="24" y1="388" x2="876" y2="388" stroke="var(--info-500)" stroke-width="0.7"/>

  <!-- ===== ROW 3: the error ===== -->
  <text x="24" y="416" font-size="14" font-weight="bold" fill="var(--danger-text)">Bitcoin, forex-sized stop</text>
  <text x="24" y="434" font-size="11" fill="var(--diagram-text)">stop = $278, the classic error</text>
  <text x="24" y="450" font-size="11" fill="var(--diagram-text)">about 0.19 daily moves</text>

  <rect x="250" y="408" width="28" height="26" fill="var(--danger-500)"/>
  <text x="286" y="426" font-size="12" fill="var(--diagram-text)">0.46% of price</text>

  <rect x="640" y="404" width="170" height="34" rx="5" fill="var(--danger-500)"/>
  <text x="725" y="426" text-anchor="middle" font-size="14" font-weight="bold" fill="var(--diagram-block-ink)">$10,800</text>
  <text x="725" y="452" text-anchor="middle" font-size="11" fill="var(--danger-text)">stopped out by noise</text>

  <line x1="24" y1="468" x2="876" y2="468" stroke="var(--info-500)" stroke-width="1"/>

  <!-- ===== FOOTER NOTES ===== -->
  <rect x="24" y="482" width="414" height="98" rx="8" fill="var(--diagram-bg)" stroke="var(--success-500)" stroke-width="2"/>
  <text x="231" y="504" text-anchor="middle" font-size="13" font-weight="bold" fill="var(--success-text)">The arithmetic</text>
  <text x="38" y="526" font-size="11.5" fill="var(--diagram-text)">Stop 13.7x wider -&gt; position 13.7x smaller.</text>
  <text x="38" y="544" font-size="11.5" fill="var(--diagram-text)">6.33 / 0.46 = 13.7, and 10,800 / 789 = 13.7.</text>
  <text x="38" y="562" font-size="11.5" fill="var(--diagram-text)">Same $50 lost if either stop is hit.</text>

  <rect x="462" y="482" width="414" height="98" rx="8" fill="var(--diagram-bg)" stroke="var(--danger-500)" stroke-width="2"/>
  <text x="669" y="504" text-anchor="middle" font-size="13" font-weight="bold" fill="var(--danger-text)">Why row 3 fails</text>
  <text x="476" y="526" font-size="11.5" fill="var(--diagram-text)">$278 is one-seventh of one day's ATR ($1,900).</text>
  <text x="476" y="544" font-size="11.5" fill="var(--diagram-text)">The smallest of the five daily true ranges was</text>
  <text x="476" y="562" font-size="11.5" fill="var(--diagram-text)">$1,700 - about 6.1 times the stop distance.</text>
</svg>
<svg data-key="crypto/crypto-03-2-attack-surface" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 720" font-family="Arial, Helvetica, sans-serif">
  <rect x="0" y="0" width="960" height="720" fill="var(--diagram-bg)"/>

  <!-- Title -->
  <text x="480" y="40" text-anchor="middle" font-size="24" font-weight="bold" fill="var(--diagram-text)">The Attack Surface Around a Crypto Holder</text>
  <text x="480" y="66" text-anchor="middle" font-size="14" fill="var(--info-text)">Five ways in. None of them is price risk. Each one has a specific fix.</text>

  <!-- Connector lines drawn first so boxes sit on top -->
  <line x1="165" y1="255" x2="330" y2="345" stroke="var(--danger-500)" stroke-width="2" stroke-dasharray="5,4"/>
  <line x1="480" y1="255" x2="480" y2="330" stroke="var(--danger-500)" stroke-width="2" stroke-dasharray="5,4"/>
  <line x1="795" y1="255" x2="630" y2="345" stroke="var(--danger-500)" stroke-width="2" stroke-dasharray="5,4"/>
  <line x1="330" y1="415" x2="240" y2="470" stroke="var(--danger-500)" stroke-width="2" stroke-dasharray="5,4"/>
  <line x1="630" y1="415" x2="720" y2="470" stroke="var(--danger-500)" stroke-width="2" stroke-dasharray="5,4"/>

  <!-- Panel 1: Exchange account -->
  <rect x="30" y="95" width="270" height="160" rx="10" fill="var(--diagram-bg)" stroke="var(--info-500)" stroke-width="2.5"/>
  <text x="165" y="124" text-anchor="middle" font-size="15" font-weight="bold" fill="var(--diagram-text)">1. EXCHANGE ACCOUNT</text>
  <line x1="50" y1="136" x2="280" y2="136" stroke="var(--diagram-panel)" stroke-width="1.5"/>
  <text x="50" y="160" font-size="12" font-weight="bold" fill="var(--danger-text)">Attack</text>
  <text x="50" y="178" font-size="12" fill="var(--diagram-text)">Platform is hacked, freezes, or</text>
  <text x="50" y="194" font-size="12" fill="var(--diagram-text)">fails. Your balance is its IOU.</text>
  <text x="50" y="218" font-size="12" font-weight="bold" fill="var(--success-text)">Fix</text>
  <text x="50" y="236" font-size="12" fill="var(--diagram-text)">Hold only what you trade soon.</text>
  <text x="50" y="250" font-size="12" fill="var(--diagram-text)">Withdrawal allowlist. App 2FA.</text>

  <!-- Panel 2: Phone number and SIM -->
  <rect x="345" y="95" width="270" height="160" rx="10" fill="var(--diagram-bg)" stroke="var(--info-500)" stroke-width="2.5"/>
  <text x="480" y="124" text-anchor="middle" font-size="15" font-weight="bold" fill="var(--diagram-text)">2. PHONE NUMBER / SIM</text>
  <line x1="365" y1="136" x2="595" y2="136" stroke="var(--diagram-panel)" stroke-width="1.5"/>
  <text x="365" y="160" font-size="12" font-weight="bold" fill="var(--danger-text)">Attack</text>
  <text x="365" y="178" font-size="12" fill="var(--diagram-text)">SIM swap moves your number.</text>
  <text x="365" y="194" font-size="12" fill="var(--diagram-text)">SMS codes go to the attacker.</text>
  <text x="365" y="218" font-size="12" font-weight="bold" fill="var(--success-text)">Fix</text>
  <text x="365" y="236" font-size="12" fill="var(--diagram-text)">Authenticator app or security</text>
  <text x="365" y="250" font-size="12" fill="var(--diagram-text)">key, not SMS. Port-out PIN.</text>

  <!-- Panel 3: Browser and approvals -->
  <rect x="660" y="95" width="270" height="160" rx="10" fill="var(--diagram-bg)" stroke="var(--info-500)" stroke-width="2.5"/>
  <text x="795" y="124" text-anchor="middle" font-size="15" font-weight="bold" fill="var(--diagram-text)">3. BROWSER / APPROVALS</text>
  <line x1="680" y1="136" x2="910" y2="136" stroke="var(--diagram-panel)" stroke-width="1.5"/>
  <text x="680" y="160" font-size="12" font-weight="bold" fill="var(--danger-text)">Attack</text>
  <text x="680" y="178" font-size="12" fill="var(--diagram-text)">Fake site, or an old unlimited</text>
  <text x="680" y="194" font-size="12" fill="var(--diagram-text)">approval drained months later.</text>
  <text x="680" y="218" font-size="12" font-weight="bold" fill="var(--success-text)">Fix</text>
  <text x="680" y="236" font-size="12" fill="var(--diagram-text)">Bookmarks only. Revoke unused</text>
  <text x="680" y="250" font-size="12" fill="var(--diagram-text)">approvals monthly. Cap limits.</text>

  <!-- Centre: the holder -->
  <rect x="330" y="330" width="300" height="85" rx="12" fill="var(--diagram-block-2)" stroke="var(--diagram-text)" stroke-width="2"/>
  <text x="480" y="360" text-anchor="middle" font-size="18" font-weight="bold" fill="var(--diagram-block-ink)">YOU</text>
  <text x="480" y="382" text-anchor="middle" font-size="12.5" fill="var(--diagram-block-ink)">your keys, your accounts,</text>
  <text x="480" y="400" text-anchor="middle" font-size="12.5" fill="var(--diagram-block-ink)">your devices, your phone number</text>

  <!-- Panel 4: Device and clipboard -->
  <rect x="105" y="470" width="270" height="160" rx="10" fill="var(--diagram-bg)" stroke="var(--info-500)" stroke-width="2.5"/>
  <text x="240" y="499" text-anchor="middle" font-size="15" font-weight="bold" fill="var(--diagram-text)">4. DEVICE / CLIPBOARD</text>
  <line x1="125" y1="511" x2="355" y2="511" stroke="var(--diagram-panel)" stroke-width="1.5"/>
  <text x="125" y="535" font-size="12" font-weight="bold" fill="var(--danger-text)">Attack</text>
  <text x="125" y="553" font-size="12" fill="var(--diagram-text)">Malware swaps the address you</text>
  <text x="125" y="569" font-size="12" fill="var(--diagram-text)">pasted. Lookalikes in history.</text>
  <text x="125" y="593" font-size="12" font-weight="bold" fill="var(--success-text)">Fix</text>
  <text x="125" y="611" font-size="12" fill="var(--diagram-text)">Verify on the device screen.</text>
  <text x="125" y="625" font-size="12" fill="var(--diagram-text)">Check the middle. Test send.</text>

  <!-- Panel 5: Seed phrase backup -->
  <rect x="585" y="470" width="270" height="160" rx="10" fill="var(--diagram-bg)" stroke="var(--info-500)" stroke-width="2.5"/>
  <text x="720" y="499" text-anchor="middle" font-size="15" font-weight="bold" fill="var(--diagram-text)">5. SEED PHRASE BACKUP</text>
  <line x1="605" y1="511" x2="835" y2="511" stroke="var(--diagram-panel)" stroke-width="1.5"/>
  <text x="605" y="535" font-size="12" font-weight="bold" fill="var(--danger-text)">Attack</text>
  <text x="605" y="553" font-size="12" fill="var(--diagram-text)">Photographed, typed into a site,</text>
  <text x="605" y="569" font-size="12" fill="var(--diagram-text)">or supplied with a fake device.</text>
  <text x="605" y="593" font-size="12" font-weight="bold" fill="var(--success-text)">Fix</text>
  <text x="605" y="611" font-size="12" fill="var(--diagram-text)">Offline on paper or metal. Buy</text>
  <text x="605" y="625" font-size="12" fill="var(--diagram-text)">direct. Generate it yourself.</text>

  <!-- Footer band -->
  <rect x="30" y="655" width="900" height="46" rx="8" fill="var(--warning-soft)" stroke="var(--warning-500)" stroke-width="2"/>
  <text x="480" y="676" text-anchor="middle" font-size="13.5" font-weight="bold" fill="var(--danger-text)">Every path above ends in one irreversible transfer.</text>
  <text x="480" y="693" text-anchor="middle" font-size="12.5" fill="var(--diagram-text)">There is no chargeback, no fraud department, and no undo. Security in crypto is preventive only.</text>
</svg>

  <text x="76" y="452" text-anchor="start" font-size="12" fill="var(--diagram-muted)">likely lost money on their initial investment.</text>
  <text x="76" y="478" text-anchor="start" font-size="12" fill="var(--diagram-muted)">About three quarters of new investors downloaded</text>
  <text x="76" y="496" text-anchor="start" font-size="12" fill="var(--diagram-muted)">an app after Bitcoin passed 20,000 dollars.</text>
  <text x="76" y="518" text-anchor="start" font-size="12" fill="var(--diagram-text)" font-weight="bold">When prices rose, the largest holders were selling.</text>

  <text x="650" y="406" text-anchor="middle" font-size="14" fill="var(--success-text)" font-weight="bold">Why the lag is structural</text>

  <text x="476" y="470" text-anchor="start" font-size="12" fill="var(--diagram-muted)">are all downstream of a rise that has happened.</text>
  <text x="476" y="496" text-anchor="start" font-size="12" fill="var(--diagram-text)" font-weight="bold">So the ordinary experience of hearing about</text>
  <text x="476" y="514" text-anchor="start" font-size="12" fill="var(--diagram-text)" font-weight="bold">crypto is the experience of hearing about it late.</text>
</svg><svg data-key="crypto/crypto-04-2-scam-markers" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 560" font-family="Arial, Helvetica, sans-serif" role="img">
  <rect x="0" y="0" width="900" height="560" fill="var(--diagram-bg)"/>
  <text x="450" y="34" text-anchor="middle" font-size="21" fill="var(--diagram-text)" font-weight="bold">Six Structures, and the Markers That Catch Them</text>
  <text x="450" y="57" text-anchor="middle" font-size="13" fill="var(--diagram-muted)">Almost everything you will meet is one of these. Each has a marker you can check rather than a feeling you have to trust.</text>
  <rect x="40" y="86" width="230" height="96" rx="8" fill="var(--diagram-bg)" stroke="var(--danger-500)" stroke-width="2"/>
  <text x="155" y="112" text-anchor="middle" font-size="14" fill="var(--danger-500)" font-weight="bold">Rug pull</text>
  <text x="54" y="134" text-anchor="start" font-size="11" fill="var(--diagram-muted)">Liquidity withdrawn or holdings</text>
  <text x="54" y="148" text-anchor="start" font-size="11" fill="var(--diagram-muted)">dumped after promotion. Roughly half</text>
  <text x="54" y="162" text-anchor="start" font-size="11" fill="var(--diagram-muted)">of Uniswap listings, per Xia and</text>
  <text x="54" y="176" text-anchor="start" font-size="11" fill="var(--diagram-muted)">colleagues 2021.</text>
  <rect x="290" y="86" width="230" height="96" rx="8" fill="var(--diagram-bg)" stroke="var(--danger-500)" stroke-width="2"/>
  <text x="405" y="112" text-anchor="middle" font-size="14" fill="var(--danger-500)" font-weight="bold">Yield scheme</text>
  <text x="304" y="134" text-anchor="start" font-size="11" fill="var(--diagram-muted)">A fixed high return funded by later</text>
  <text x="304" y="148" text-anchor="start" font-size="11" fill="var(--diagram-muted)">deposits rather than by any</text>
  <text x="304" y="162" text-anchor="start" font-size="11" fill="var(--diagram-muted)">activity.</text>
  <rect x="40" y="196" width="230" height="96" rx="8" fill="var(--diagram-bg)" stroke="var(--warning-500)" stroke-width="2"/>
  <text x="155" y="222" text-anchor="middle" font-size="14" fill="var(--warning-500)" font-weight="bold">Pig butchering</text>
  <text x="54" y="244" text-anchor="start" font-size="11" fill="var(--diagram-muted)">A relationship built first, a fake</text>
  <text x="54" y="258" text-anchor="start" font-size="11" fill="var(--diagram-muted)">platform introduced later.</text>
  <rect x="290" y="196" width="230" height="96" rx="8" fill="var(--diagram-bg)" stroke="var(--warning-500)" stroke-width="2"/>
  <text x="405" y="222" text-anchor="middle" font-size="14" fill="var(--warning-500)" font-weight="bold">Withdrawal-fee scam</text>
  <text x="304" y="244" text-anchor="start" font-size="11" fill="var(--diagram-muted)">Outside money demanded before a</text>
  <text x="304" y="258" text-anchor="start" font-size="11" fill="var(--diagram-muted)">balance is released.</text>
  <rect x="40" y="306" width="230" height="96" rx="8" fill="var(--diagram-bg)" stroke="var(--info-500)" stroke-width="2"/>
  <text x="155" y="332" text-anchor="middle" font-size="14" fill="var(--info-500)" font-weight="bold">Approval draining</text>
  <text x="54" y="354" text-anchor="start" font-size="11" fill="var(--diagram-muted)">A permission signed earlier, used to</text>
  <text x="54" y="368" text-anchor="start" font-size="11" fill="var(--diagram-muted)">remove funds later.</text>
  <rect x="290" y="306" width="230" height="96" rx="8" fill="var(--diagram-bg)" stroke="var(--info-500)" stroke-width="2"/>
  <text x="405" y="332" text-anchor="middle" font-size="14" fill="var(--info-500)" font-weight="bold">Impersonation</text>
  <text x="304" y="354" text-anchor="start" font-size="11" fill="var(--diagram-muted)">A known person, project or support</text>
  <text x="304" y="368" text-anchor="start" font-size="11" fill="var(--diagram-muted)">channel imitated.</text>
  <rect x="556" y="86" width="304" height="316" rx="8" fill="var(--diagram-bg)" stroke="var(--success-500)" stroke-width="2"/>
  <text x="708" y="112" text-anchor="middle" font-size="14" fill="var(--success-text)" font-weight="bold">Markers that work on structures</text>
  <text x="708" y="130" text-anchor="middle" font-size="14" fill="var(--success-text)" font-weight="bold">nobody has invented yet</text>
  <text x="572" y="162" text-anchor="start" font-size="12" fill="var(--diagram-text)">A guaranteed return on a volatile asset</text>
  <text x="572" y="192" text-anchor="start" font-size="12" fill="var(--diagram-text)">An unexplained source of yield</text>
  <text x="572" y="222" text-anchor="start" font-size="12" fill="var(--diagram-text)">Contact you did not initiate</text>
  <text x="572" y="252" text-anchor="start" font-size="12" fill="var(--diagram-text)">Pressure to act before a deadline</text>
  <text x="572" y="282" text-anchor="start" font-size="12" fill="var(--diagram-text)">A referral component in the returns</text>
  <text x="572" y="312" text-anchor="start" font-size="12" fill="var(--diagram-text)">Friction that appears only on withdrawal</text>
  <text x="572" y="342" text-anchor="start" font-size="12" fill="var(--diagram-text)">Any request for a recovery phrase</text>
  <rect x="40" y="418" width="820" height="112" rx="8" fill="var(--diagram-bg)" stroke="var(--warning-500)" stroke-width="2"/>
  <text x="450" y="444" text-anchor="middle" font-size="13" fill="var(--warning-text)" font-weight="bold">Not on that list, because all of it is cheap to fabricate</text>
  <text x="450" y="470" text-anchor="middle" font-size="12" fill="var(--diagram-muted)">How professional the website looks. Whether there is a whitepaper. Whether well-known names appear as advisers.</text>
  <text x="450" y="490" text-anchor="middle" font-size="12" fill="var(--diagram-muted)">Whether an audit exists, which reviews code at a point in time and does not establish that the design is safe.</text>
  <text x="450" y="514" text-anchor="middle" font-size="12" fill="var(--diagram-text)" font-weight="bold">And whether other people you know are already in, which is how these schemes grow rather than evidence they are sound.</text>
</svg><svg data-key="crypto/crypto-04-3-custody-plan" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 560" font-family="Arial, Helvetica, sans-serif" role="img">
  <rect x="0" y="0" width="900" height="560" fill="var(--diagram-bg)"/>
  <text x="450" y="34" text-anchor="middle" font-size="21" fill="var(--diagram-text)" font-weight="bold">Seven Sections of a Crypto Plan</text>
  <text x="450" y="57" text-anchor="middle" font-size="13" fill="var(--diagram-muted)">Four that any trading plan needs, and three that only an asset you can hold yourself requires.</text>
  <circle cx="72" cy="104" r="18" fill="var(--info-500)"/>
  <text x="72" y="109" text-anchor="middle" font-size="16" fill="var(--diagram-bg)" font-weight="bold">1</text>
  <text x="104" y="100" text-anchor="start" font-size="15" fill="var(--diagram-text)" font-weight="bold">Allocation</text>
  <text x="104" y="122" text-anchor="start" font-size="12" fill="var(--diagram-muted)">How much of total wealth is in this asset class at all, decided before looking at any token.</text>
  <circle cx="72" cy="162" r="18" fill="var(--info-500)"/>
  <text x="72" y="167" text-anchor="middle" font-size="16" fill="var(--diagram-bg)" font-weight="bold">2</text>
  <text x="104" y="158" text-anchor="start" font-size="15" fill="var(--diagram-text)" font-weight="bold">Position sizing</text>
  <text x="104" y="180" text-anchor="start" font-size="12" fill="var(--diagram-muted)">The Chapter 3 Lesson 1 formula at crypto volatility, written as a number rather than a principle.</text>
  <circle cx="72" cy="220" r="18" fill="var(--info-500)"/>
  <text x="72" y="225" text-anchor="middle" font-size="16" fill="var(--diagram-bg)" font-weight="bold">3</text>
  <text x="104" y="216" text-anchor="start" font-size="15" fill="var(--diagram-text)" font-weight="bold">Leverage</text>
  <text x="104" y="238" text-anchor="start" font-size="12" fill="var(--diagram-muted)">For most readers a single word: none. Otherwise a maximum and the liquidation price, in advance.</text>
  <circle cx="72" cy="278" r="18" fill="var(--info-500)"/>
  <text x="72" y="283" text-anchor="middle" font-size="16" fill="var(--diagram-bg)" font-weight="bold">4</text>
  <text x="104" y="274" text-anchor="start" font-size="15" fill="var(--diagram-text)" font-weight="bold">Entry and exit conditions</text>
  <text x="104" y="296" text-anchor="start" font-size="12" fill="var(--diagram-muted)">What has to be true to buy, and what has to be true to sell. Chapter 6 fills this properly.</text>
  <circle cx="72" cy="336" r="18" fill="var(--warning-500)"/>
  <text x="72" y="341" text-anchor="middle" font-size="16" fill="var(--diagram-bg)" font-weight="bold">5</text>
  <text x="104" y="332" text-anchor="start" font-size="15" fill="var(--diagram-text)" font-weight="bold">Custody map</text>
  <text x="104" y="354" text-anchor="start" font-size="12" fill="var(--diagram-muted)">How much stays on an exchange, and the amount above which holdings move to self-custody.</text>
  <circle cx="72" cy="394" r="18" fill="var(--warning-500)"/>
  <text x="72" y="399" text-anchor="middle" font-size="16" fill="var(--diagram-bg)" font-weight="bold">6</text>
  <text x="104" y="390" text-anchor="start" font-size="15" fill="var(--diagram-text)" font-weight="bold">Recovery plan</text>
  <text x="104" y="412" text-anchor="start" font-size="12" fill="var(--diagram-muted)">Where the phrase is, how many copies exist, and what happens to them in a fire or a flood.</text>
  <circle cx="72" cy="452" r="18" fill="var(--warning-500)"/>
  <text x="72" y="457" text-anchor="middle" font-size="16" fill="var(--diagram-bg)" font-weight="bold">7</text>
  <text x="104" y="448" text-anchor="start" font-size="15" fill="var(--diagram-text)" font-weight="bold">Succession</text>
  <text x="104" y="470" text-anchor="start" font-size="12" fill="var(--diagram-muted)">Who else knows this exists, and what happens to it if you do not.</text>
  <line x1="60" y1="508" x2="840" y2="508" stroke="var(--diagram-grid)" stroke-width="1"/>
  <text x="450" y="534" text-anchor="middle" font-size="13" fill="var(--warning-text)" font-weight="bold">The last three exist because self-custody moves the failure mode from a counterparty to you.</text>
</svg><svg data-key="crypto/crypto-05-1-mt-gox-timeline" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 560" font-family="Arial, Helvetica, sans-serif" role="img">
  <rect x="0" y="0" width="900" height="560" fill="var(--diagram-bg)"/>
  <text x="450" y="34" text-anchor="middle" font-size="21" fill="var(--diagram-text)" font-weight="bold">Mt. Gox: Three Weeks of Collapse, Three Years of Loss</text>
  <text x="450" y="57" text-anchor="middle" font-size="13" fill="var(--diagram-muted)">The theft ran undetected from 2011. What ended in February 2014 was the belief that the balance described anything real.</text>
  <line x1="340" y1="150" x2="850" y2="150" stroke="var(--diagram-grid)" stroke-width="2"/>
  <rect x="66" y="118" width="268" height="62" rx="6" fill="var(--danger-500)"/>
  <text x="200" y="144" text-anchor="middle" font-size="13" fill="var(--diagram-bg)" font-weight="bold">2011 to 2013: theft running,</text>
  <text x="200" y="162" text-anchor="middle" font-size="13" fill="var(--diagram-bg)" font-weight="bold">undetected the whole time</text>
  <circle cx="430" cy="150" r="6" fill="var(--warning-500)"/>
  <text x="430" y="122" text-anchor="middle" font-size="12" fill="var(--warning-text)" font-weight="bold">7 Feb 2014</text>
  <text x="430" y="178" text-anchor="middle" font-size="11" fill="var(--diagram-muted)">withdrawals halted</text>
  <circle cx="555" cy="150" r="6" fill="var(--warning-500)"/>
  <text x="555" y="122" text-anchor="middle" font-size="12" fill="var(--warning-text)" font-weight="bold">28 Feb 2014</text>
  <text x="555" y="224" text-anchor="middle" font-size="11" fill="var(--diagram-muted)">Tokyo filing: 850,000</text>
  <text x="555" y="239" text-anchor="middle" font-size="11" fill="var(--diagram-muted)">BTC lost, 750,000 of</text>
  <text x="555" y="254" text-anchor="middle" font-size="11" fill="var(--diagram-muted)">it customers</text>
  <circle cx="675" cy="150" r="6" fill="var(--warning-500)"/>
  <text x="675" y="122" text-anchor="middle" font-size="12" fill="var(--warning-text)" font-weight="bold">9 Mar 2014</text>
  <text x="675" y="178" text-anchor="middle" font-size="11" fill="var(--diagram-muted)">United States filing</text>
  <circle cx="790" cy="150" r="6" fill="var(--warning-500)"/>
  <text x="790" y="122" text-anchor="middle" font-size="12" fill="var(--warning-text)" font-weight="bold">20 Mar 2014</text>
  <text x="790" y="224" text-anchor="middle" font-size="11" fill="var(--diagram-muted)">about 200,000 BTC</text>
  <text x="790" y="239" text-anchor="middle" font-size="11" fill="var(--diagram-muted)">found in a wallet last</text>
  <text x="790" y="254" text-anchor="middle" font-size="11" fill="var(--diagram-muted)">used before June 2011</text>
  <rect x="60" y="290" width="380" height="150" rx="8" fill="var(--diagram-bg)" stroke="var(--danger-500)" stroke-width="2"/>
  <text x="250" y="316" text-anchor="middle" font-size="14" fill="var(--danger-text)" font-weight="bold">The exchange did not know what it held</text>
  <text x="76" y="344" text-anchor="start" font-size="12" fill="var(--diagram-muted)">An exchange holding hundreds of thousands of</text>
  <text x="76" y="362" text-anchor="start" font-size="12" fill="var(--diagram-muted)">customer bitcoin found 200,000 of them in a wallet</text>
  <text x="76" y="380" text-anchor="start" font-size="12" fill="var(--diagram-muted)">nobody had checked in three years.</text>
  <text x="76" y="406" text-anchor="start" font-size="12" fill="var(--diagram-text)" font-weight="bold">That is not a sophisticated attack. It is the absence</text>
  <text x="76" y="424" text-anchor="start" font-size="12" fill="var(--diagram-text)" font-weight="bold">of the most basic control in custody.</text>
  <rect x="460" y="290" width="380" height="150" rx="8" fill="var(--diagram-bg)" stroke="var(--success-500)" stroke-width="2"/>
  <text x="650" y="316" text-anchor="middle" font-size="14" fill="var(--success-text)" font-weight="bold">The defence that needed no foresight</text>
  <text x="476" y="344" text-anchor="start" font-size="12" fill="var(--diagram-muted)">A user with 20 BTC who kept 2 on the exchange</text>
  <text x="476" y="362" text-anchor="start" font-size="12" fill="var(--diagram-muted)">and 18 in self-custody lost 10% and kept 90%.</text>
  <text x="476" y="388" text-anchor="start" font-size="12" fill="var(--diagram-muted)">A user with all 20 on the exchange lost everything.</text>
  <text x="476" y="414" text-anchor="start" font-size="12" fill="var(--diagram-text)" font-weight="bold">Neither knew anything the other did not. One had</text>
  <text x="476" y="432" text-anchor="start" font-size="12" fill="var(--diagram-text)" font-weight="bold">a custody rule and the other had a habit.</text>
  <text x="450" y="474" text-anchor="middle" font-size="13" fill="var(--warning-text)" font-weight="bold">The malleability explanation the exchange offered was checked against the public ledger and did not survive.</text>
  <text x="450" y="498" text-anchor="middle" font-size="12" fill="var(--diagram-muted)">Decker and Wattenhofer, 2014: attacks existed but were nowhere near large enough to account for 750,000 coins.</text>
  <text x="450" y="522" text-anchor="middle" font-size="12" fill="var(--diagram-muted)">Repayments to creditors began in July 2024, slightly over ten years later.</text>
</svg><svg data-key="crypto/crypto-05-2-terra-spiral" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 560" font-family="Arial, Helvetica, sans-serif" role="img">
  <rect x="0" y="0" width="900" height="560" fill="var(--diagram-bg)"/>
  <text x="450" y="34" text-anchor="middle" font-size="21" fill="var(--diagram-text)" font-weight="bold">Terra and Luna: A Mechanism Executing Correctly, All the Way Down</text>
  <text x="450" y="57" text-anchor="middle" font-size="13" fill="var(--diagram-muted)">UST fell below one dollar on 7 May 2022. By 13 May, LUNA had gone from about 87 dollars to below 0.00005.</text>
  <rect x="40" y="96" width="180" height="76" rx="8" fill="var(--diagram-bg)" stroke="var(--warning-500)" stroke-width="2"/>
  <text x="130" y="126" text-anchor="middle" font-size="12" fill="var(--warning-500)" font-weight="bold">UST trades below one</text>
  <text x="130" y="142" text-anchor="middle" font-size="12" fill="var(--warning-500)" font-weight="bold">dollar</text>
  <rect x="250" y="96" width="180" height="76" rx="8" fill="var(--diagram-bg)" stroke="var(--warning-500)" stroke-width="2"/>
  <text x="340" y="126" text-anchor="middle" font-size="12" fill="var(--warning-500)" font-weight="bold">Holders redeem it for</text>
  <text x="340" y="142" text-anchor="middle" font-size="12" fill="var(--warning-500)" font-weight="bold">newly minted LUNA</text>
  <rect x="460" y="96" width="180" height="76" rx="8" fill="var(--diagram-bg)" stroke="var(--danger-500)" stroke-width="2"/>
  <text x="550" y="126" text-anchor="middle" font-size="12" fill="var(--danger-500)" font-weight="bold">That LUNA is sold</text>
  <rect x="640" y="96" width="180" height="76" rx="8" fill="var(--diagram-bg)" stroke="var(--danger-500)" stroke-width="2"/>
  <text x="730" y="126" text-anchor="middle" font-size="12" fill="var(--danger-500)" font-weight="bold">The LUNA price falls</text>
  <text x="235" y="138" text-anchor="middle" font-size="11" fill="var(--diagram-muted)">so</text>
  <text x="445" y="138" text-anchor="middle" font-size="11" fill="var(--diagram-muted)">and</text>
  <text x="640" y="138" text-anchor="middle" font-size="11" fill="var(--diagram-muted)">so</text>
  <line x1="730" y1="172" x2="730" y2="200" stroke="var(--danger-500)" stroke-width="2"/>
  <line x1="130" y1="200" x2="730" y2="200" stroke="var(--danger-500)" stroke-width="2"/>
  <line x1="130" y1="172" x2="130" y2="200" stroke="var(--danger-500)" stroke-width="2"/>
  <text x="430" y="220" text-anchor="middle" font-size="13" fill="var(--danger-text)" font-weight="bold">so each further redemption needs more LUNA minted, and the loop tightens</text>
  <rect x="60" y="244" width="380" height="150" rx="8" fill="var(--diagram-bg)" stroke="var(--warning-500)" stroke-width="2"/>
  <text x="250" y="270" text-anchor="middle" font-size="14" fill="var(--warning-text)" font-weight="bold">Where the 20% yield came from</text>
  <text x="76" y="298" text-anchor="start" font-size="12" fill="var(--diagram-muted)">Anchor paid roughly 20% a year on UST deposits,</text>
  <text x="76" y="316" text-anchor="start" font-size="12" fill="var(--diagram-muted)">and close to 75% of all UST sat in it.</text>
  <text x="76" y="342" text-anchor="start" font-size="12" fill="var(--diagram-muted)">On about 14 billion dollars that is roughly 2.8</text>
  <text x="76" y="360" text-anchor="start" font-size="12" fill="var(--diagram-muted)">billion a year, paid out of a reserve.</text>
  <text x="76" y="384" text-anchor="start" font-size="12" fill="var(--diagram-text)" font-weight="bold">A rate paid from capital, not from an activity.</text>
  <rect x="460" y="244" width="380" height="150" rx="8" fill="var(--diagram-bg)" stroke="var(--danger-500)" stroke-width="2"/>
  <text x="650" y="270" text-anchor="middle" font-size="14" fill="var(--danger-text)" font-weight="bold">The defence, and what it cost everyone else</text>
  <text x="476" y="298" text-anchor="start" font-size="12" fill="var(--diagram-muted)">A reserve of about 80,394 bitcoin was deployed</text>
  <text x="476" y="316" text-anchor="start" font-size="12" fill="var(--diagram-muted)">between roughly 8 and 12 May. By 16 May about</text>
  <text x="476" y="334" text-anchor="start" font-size="12" fill="var(--diagram-muted)">313 remained. The peg was not restored.</text>
  <text x="476" y="360" text-anchor="start" font-size="12" fill="var(--diagram-text)" font-weight="bold">The selling pushed Bitcoin from around 39,000</text>
  <text x="476" y="378" text-anchor="start" font-size="12" fill="var(--diagram-text)" font-weight="bold">to around 28,000 that week. That is contagion.</text>
  <line x1="60" y1="416" x2="840" y2="416" stroke="var(--diagram-grid)" stroke-width="1"/>
  <text x="450" y="444" text-anchor="middle" font-size="13" fill="var(--diagram-text)" font-weight="bold">The mechanism was not defeated by a bug or an attack. Every redemption did exactly what the documentation said.</text>
  <text x="450" y="470" text-anchor="middle" font-size="12" fill="var(--diagram-muted)">UST needed LUNA to be valuable; LUNA was valuable because it underpinned UST. Neither was anchored outside the pair.</text>
  <text x="450" y="496" text-anchor="middle" font-size="12" fill="var(--diagram-muted)">LUNA fell about 99.99994%. Returning to 87 dollars from there would require a rise of roughly 1,740,000 times.</text>
  <text x="450" y="522" text-anchor="middle" font-size="12" fill="var(--warning-text)" font-weight="bold">A system can be functioning perfectly and be catastrophic. Those are not contradictory statements.</text>
</svg><svg data-key="crypto/crypto-05-3-ftx-run" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 560" font-family="Arial, Helvetica, sans-serif" role="img">
  <rect x="0" y="0" width="900" height="560" fill="var(--diagram-bg)"/>
  <text x="450" y="34" text-anchor="middle" font-size="21" fill="var(--diagram-text)" font-weight="bold">FTX: Nine Days From a Published Balance Sheet to Bankruptcy</text>
  <text x="450" y="57" text-anchor="middle" font-size="13" fill="var(--diagram-muted)">The venue widely regarded as the responsible one. Every credibility signal pointed the right way.</text>
  <line x1="70" y1="140" x2="830" y2="140" stroke="var(--diagram-grid)" stroke-width="2"/>
  <circle cx="110" cy="140" r="6" fill="var(--warning-500)"/>
  <text x="110" y="116" text-anchor="middle" font-size="13" fill="var(--warning-text)" font-weight="bold">2 Nov</text>
  <text x="110" y="168" text-anchor="middle" font-size="11" fill="var(--diagram-muted)">CoinDesk publishes the</text>
  <text x="110" y="183" text-anchor="middle" font-size="11" fill="var(--diagram-muted)">Alameda balance sheet</text>
  <circle cx="280" cy="140" r="6" fill="var(--warning-500)"/>
  <text x="280" y="116" text-anchor="middle" font-size="13" fill="var(--warning-text)" font-weight="bold">6 Nov</text>
  <text x="280" y="168" text-anchor="middle" font-size="11" fill="var(--diagram-muted)">Binance announces it</text>
  <text x="280" y="183" text-anchor="middle" font-size="11" fill="var(--diagram-muted)">will sell its FTT</text>
  <circle cx="480" cy="140" r="6" fill="var(--warning-500)"/>
  <text x="480" y="116" text-anchor="middle" font-size="13" fill="var(--warning-text)" font-weight="bold">8 to 9 Nov</text>
  <text x="480" y="168" text-anchor="middle" font-size="11" fill="var(--diagram-muted)">Binance offers to buy</text>
  <text x="480" y="183" text-anchor="middle" font-size="11" fill="var(--diagram-muted)">FTX, then withdraws</text>
  <circle cx="700" cy="140" r="6" fill="var(--danger-500)"/>
  <text x="700" y="116" text-anchor="middle" font-size="13" fill="var(--danger-text)" font-weight="bold">11 Nov</text>
  <text x="700" y="168" text-anchor="middle" font-size="11" fill="var(--diagram-muted)">Chapter 11 filing</text>
  <text x="420" y="224" text-anchor="middle" font-size="13" fill="var(--diagram-text)" font-weight="bold">roughly 5 billion dollars of withdrawal requests arrived within about 72 hours</text>
  <text x="318" y="278" text-anchor="end" font-size="13" fill="var(--diagram-text)">liabilities</text>
  <rect x="330" y="256" width="380" height="34" rx="3" fill="var(--danger-500)"/>
  <text x="720" y="278" text-anchor="start" font-size="13" fill="var(--danger-text)" font-weight="bold">about 9 billion</text>
  <text x="318" y="330" text-anchor="end" font-size="13" fill="var(--diagram-text)">assets that could readily be sold</text>
  <rect x="330" y="308" width="38" height="34" rx="3" fill="var(--success-500)"/>
  <text x="378" y="330" text-anchor="start" font-size="13" fill="var(--success-text)" font-weight="bold">about 900 million</text>
  <text x="450" y="356" text-anchor="middle" font-size="14" fill="var(--warning-text)" font-weight="bold">A shortfall of roughly 8 billion dollars</text>
  <rect x="60" y="370" width="380" height="152" rx="8" fill="var(--diagram-bg)" stroke="var(--danger-500)" stroke-width="2"/>
  <text x="250" y="396" text-anchor="middle" font-size="14" fill="var(--danger-text)" font-weight="bold">Why judging the counterparty failed</text>
  <text x="76" y="424" text-anchor="start" font-size="12" fill="var(--diagram-muted)">Prominent venture backing. Testimony before</text>
  <text x="76" y="442" text-anchor="start" font-size="12" fill="var(--diagram-muted)">legislators. Advertising at major sporting events.</text>
  <text x="76" y="460" text-anchor="start" font-size="12" fill="var(--diagram-muted)">Withdrawals worked normally until they did not.</text>
  <text x="76" y="484" text-anchor="start" font-size="12" fill="var(--diagram-text)" font-weight="bold">Sophisticated institutions reached the same</text>
  <rect x="460" y="370" width="380" height="152" rx="8" fill="var(--diagram-bg)" stroke="var(--success-500)" stroke-width="2"/>
  <text x="650" y="396" text-anchor="middle" font-size="14" fill="var(--success-text)" font-weight="bold">What actually worked</text>
  <text x="476" y="424" text-anchor="start" font-size="12" fill="var(--diagram-muted)">Assets in self-custody were not less affected.</text>
  <text x="476" y="442" text-anchor="start" font-size="12" fill="var(--diagram-muted)">They were unaffected. The exchange failing had</text>
  <text x="476" y="460" text-anchor="start" font-size="12" fill="var(--diagram-muted)">no mechanism by which to reach them.</text>
  <text x="476" y="484" text-anchor="start" font-size="12" fill="var(--diagram-text)" font-weight="bold">A user with 5,000 there and 45,000 in their own</text>
  <text x="76" y="502" text-anchor="start" font-size="12" fill="var(--diagram-text)" font-weight="bold">wrong conclusion.</text>
  <text x="476" y="502" text-anchor="start" font-size="12" fill="var(--diagram-text)" font-weight="bold">wallet lost 10% and predicted nothing.</text>
  <text x="450" y="546" text-anchor="middle" font-size="12" fill="var(--diagram-muted)">Convicted on seven counts in November 2023; sentenced to 25 years in March 2024. That is justice, not restitution.</text>
</svg><svg data-key="crypto/crypto-06-1-six-pillars" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 560" font-family="Arial, Helvetica, sans-serif" role="img">
  <rect x="0" y="0" width="900" height="560" fill="var(--diagram-bg)"/>
  <text x="450" y="34" text-anchor="middle" font-size="21" fill="var(--diagram-text)" font-weight="bold">The Six Pillars, Adapted for an Asset With No Cash Flows</text>
  <text x="450" y="57" text-anchor="middle" font-size="13" fill="var(--diagram-muted)">Four transfer, one is replaced by supply arithmetic, and one only resembles carry.</text>
  <rect x="40" y="90" width="820" height="54" rx="8" fill="var(--diagram-bg)" stroke="var(--warning-500)" stroke-width="2"/>
  <text x="58" y="114" text-anchor="start" font-size="14" fill="var(--warning-500)" font-weight="bold">Fundamentals</text>
  <text x="58" y="134" text-anchor="start" font-size="12" fill="var(--diagram-muted)">On-chain activity, with the Chapter 2 Lesson 4 limits. An address is not a person.</text>
  <text x="842" y="122" text-anchor="end" font-size="13" fill="var(--warning-500)" font-weight="bold">adapted</text>
  <rect x="40" y="152" width="820" height="54" rx="8" fill="var(--diagram-bg)" stroke="var(--danger-500)" stroke-width="2"/>
  <text x="58" y="176" text-anchor="start" font-size="14" fill="var(--danger-500)" font-weight="bold">Valuation</text>
  <text x="58" y="196" text-anchor="start" font-size="12" fill="var(--diagram-muted)">Does not transfer. No cash flows means no calculation to compare a price against.</text>
  <text x="842" y="184" text-anchor="end" font-size="13" fill="var(--danger-500)" font-weight="bold">replaced</text>
  <rect x="40" y="214" width="820" height="54" rx="8" fill="var(--diagram-bg)" stroke="var(--success-500)" stroke-width="2"/>
  <text x="58" y="238" text-anchor="start" font-size="14" fill="var(--success-500)" font-weight="bold">Catalyst</text>
  <text x="58" y="258" text-anchor="start" font-size="12" fill="var(--diagram-muted)">Transfers well. But a date everyone can read has had as long as everyone to be priced.</text>
  <text x="842" y="246" text-anchor="end" font-size="13" fill="var(--success-500)" font-weight="bold">transfers</text>
  <rect x="40" y="276" width="820" height="54" rx="8" fill="var(--diagram-bg)" stroke="var(--success-500)" stroke-width="2"/>
  <text x="58" y="300" text-anchor="start" font-size="14" fill="var(--success-500)" font-weight="bold">Positioning</text>
  <text x="58" y="320" text-anchor="start" font-size="12" fill="var(--diagram-muted)">Stronger here than anywhere. Funding rates state directly when leverage is crowded.</text>
  <text x="842" y="308" text-anchor="end" font-size="13" fill="var(--success-500)" font-weight="bold">transfers</text>
  <rect x="40" y="338" width="820" height="54" rx="8" fill="var(--diagram-bg)" stroke="var(--success-500)" stroke-width="2"/>
  <text x="58" y="362" text-anchor="start" font-size="14" fill="var(--success-500)" font-weight="bold">Momentum</text>
  <text x="58" y="382" text-anchor="start" font-size="12" fill="var(--diagram-muted)">One of the three factors in Liu, Tsyvinski and Wu 2022. Decays in weeks, not months.</text>
  <text x="842" y="370" text-anchor="end" font-size="13" fill="var(--success-500)" font-weight="bold">transfers</text>
  <rect x="40" y="400" width="820" height="54" rx="8" fill="var(--diagram-bg)" stroke="var(--warning-500)" stroke-width="2"/>
  <text x="58" y="424" text-anchor="start" font-size="14" fill="var(--warning-500)" font-weight="bold">Carry</text>
  <text x="58" y="444" text-anchor="start" font-size="12" fill="var(--diagram-muted)">Staking often pays in the falling token, funded by issuance that dilutes you.</text>
  <text x="842" y="432" text-anchor="end" font-size="13" fill="var(--warning-500)" font-weight="bold">qualified</text>
  <line x1="60" y1="474" x2="840" y2="474" stroke="var(--diagram-grid)" stroke-width="1"/>
  <text x="450" y="500" text-anchor="middle" font-size="13" fill="var(--diagram-text)" font-weight="bold">Replacing valuation: total supply, the unlock schedule, and the market capitalisation a price target implies.</text>
  <text x="450" y="526" text-anchor="middle" font-size="12" fill="var(--diagram-muted)">Independence is the whole point. A price that has risen produces momentum, sentiment, funding and activity at once — one fact, four times.</text>
</svg><svg data-key="crypto/crypto-06-2-transmission-chain" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 560" font-family="Arial, Helvetica, sans-serif" role="img">
  <rect x="0" y="0" width="900" height="560" fill="var(--diagram-bg)"/>
  <text x="450" y="34" text-anchor="middle" font-size="21" fill="var(--diagram-text)" font-weight="bold">Crypto Sits at the Far End of the Transmission Chain</text>
  <text x="450" y="57" text-anchor="middle" font-size="13" fill="var(--diagram-muted)">Much of what looks like crypto news is a decision taken in a bond market weeks earlier, arriving amplified.</text>
  <rect x="40" y="96" width="132" height="84" rx="8" fill="var(--diagram-bg)" stroke="var(--warning-500)" stroke-width="2"/>
  <text x="106" y="124" text-anchor="middle" font-size="13" fill="var(--warning-500)" font-weight="bold">Interest rates</text>
  <text x="106" y="202" text-anchor="middle" font-size="12" fill="var(--diagram-muted)">the policy change</text>
  <text x="192" y="143" text-anchor="middle" font-size="12" fill="var(--diagram-muted)">then</text>
  <rect x="212" y="96" width="132" height="84" rx="8" fill="var(--diagram-bg)" stroke="var(--warning-500)" stroke-width="2"/>
  <text x="278" y="124" text-anchor="middle" font-size="13" fill="var(--warning-500)" font-weight="bold">Currencies and</text>
  <text x="278" y="140" text-anchor="middle" font-size="13" fill="var(--warning-500)" font-weight="bold">bonds</text>
  <text x="278" y="202" text-anchor="middle" font-size="12" fill="var(--diagram-muted)">yields move first</text>
  <text x="364" y="143" text-anchor="middle" font-size="12" fill="var(--diagram-muted)">then</text>
  <rect x="384" y="96" width="132" height="84" rx="8" fill="var(--diagram-bg)" stroke="var(--info-500)" stroke-width="2"/>
  <text x="450" y="124" text-anchor="middle" font-size="13" fill="var(--info-500)" font-weight="bold">Credit</text>
  <text x="450" y="202" text-anchor="middle" font-size="12" fill="var(--diagram-muted)">spreads widen</text>
  <text x="536" y="143" text-anchor="middle" font-size="12" fill="var(--diagram-muted)">then</text>
  <rect x="556" y="96" width="132" height="84" rx="8" fill="var(--diagram-bg)" stroke="var(--info-500)" stroke-width="2"/>
  <text x="622" y="124" text-anchor="middle" font-size="13" fill="var(--info-500)" font-weight="bold">Equities</text>
  <text x="622" y="202" text-anchor="middle" font-size="12" fill="var(--diagram-muted)">long duration falls</text>
  <text x="622" y="217" text-anchor="middle" font-size="12" fill="var(--diagram-muted)">hardest</text>
  <text x="708" y="143" text-anchor="middle" font-size="12" fill="var(--diagram-muted)">then</text>
  <rect x="728" y="96" width="132" height="84" rx="8" fill="var(--diagram-bg)" stroke="var(--danger-500)" stroke-width="2"/>
  <text x="794" y="124" text-anchor="middle" font-size="13" fill="var(--danger-500)" font-weight="bold">Crypto</text>
  <text x="794" y="202" text-anchor="middle" font-size="12" fill="var(--diagram-muted)">no cash flows at all</text>
  <text x="450" y="234" text-anchor="middle" font-size="13" fill="var(--diagram-text)" font-weight="bold">Crypto has the longest duration of anything on this chain, so it receives the same change last and largest.</text>
  <rect x="30" y="256" width="265.3333333333333" height="190" rx="10" fill="var(--diagram-bg)" stroke="var(--success-500)" stroke-width="2"/>
  <text x="162.66666666666666" y="286" text-anchor="middle" font-size="16" fill="var(--success-500)" font-weight="bold">Trending, risk-on</text>
  <text x="46" y="318" text-anchor="start" font-size="13" fill="var(--diagram-text)" font-weight="bold">Momentum has power.</text>
  <text x="46" y="345" text-anchor="start" font-size="13" fill="var(--diagram-muted)">Valuation-style arguments have</text>
  <text x="46" y="364" text-anchor="start" font-size="13" fill="var(--diagram-muted)">almost none, because nothing is</text>
  <text x="46" y="383" text-anchor="start" font-size="13" fill="var(--diagram-muted)">being valued.</text>
  <text x="46" y="420" text-anchor="start" font-size="13" fill="var(--diagram-text)" font-weight="bold">Funding climbs and leverage</text>
  <text x="46" y="439" text-anchor="start" font-size="13" fill="var(--diagram-text)" font-weight="bold">accumulates.</text>
  <rect x="317.3333333333333" y="256" width="265.3333333333333" height="190" rx="10" fill="var(--diagram-bg)" stroke="var(--danger-500)" stroke-width="2"/>
  <text x="450" y="286" text-anchor="middle" font-size="16" fill="var(--danger-500)" font-weight="bold">Stressed</text>
  <text x="333.3333333333333" y="318" text-anchor="start" font-size="13" fill="var(--diagram-text)" font-weight="bold">Positioning and leverage data have</text>
  <text x="333.3333333333333" y="337" text-anchor="start" font-size="13" fill="var(--diagram-text)" font-weight="bold">power.</text>
  <text x="333.3333333333333" y="364" text-anchor="start" font-size="13" fill="var(--diagram-muted)">Narrative has none — narrative is</text>
  <text x="333.3333333333333" y="383" text-anchor="start" font-size="13" fill="var(--diagram-muted)">what is being liquidated.</text>
  <text x="333.3333333333333" y="420" text-anchor="start" font-size="13" fill="var(--diagram-text)" font-weight="bold">Correlations converge and</text>
  <text x="333.3333333333333" y="439" text-anchor="start" font-size="13" fill="var(--diagram-text)" font-weight="bold">diversification stops working.</text>
  <rect x="604.6666666666666" y="256" width="265.3333333333333" height="190" rx="10" fill="var(--diagram-bg)" stroke="var(--diagram-muted)" stroke-width="2"/>
  <text x="737.3333333333333" y="286" text-anchor="middle" font-size="16" fill="var(--diagram-muted)" font-weight="bold">Ranging</text>
  <text x="620.6666666666666" y="318" text-anchor="start" font-size="13" fill="var(--diagram-text)" font-weight="bold">Nothing much has power.</text>
  <text x="620.6666666666666" y="345" text-anchor="start" font-size="13" fill="var(--diagram-muted)">A 24-hour market manufactures the</text>
  <text x="620.6666666666666" y="364" text-anchor="start" font-size="13" fill="var(--diagram-muted)">appearance of opportunity</text>
  <text x="620.6666666666666" y="383" text-anchor="start" font-size="13" fill="var(--diagram-muted)">continuously.</text>
  <text x="620.6666666666666" y="420" text-anchor="start" font-size="13" fill="var(--diagram-text)" font-weight="bold">The useful conclusion is to do very</text>
  <text x="620.6666666666666" y="439" text-anchor="start" font-size="13" fill="var(--diagram-text)" font-weight="bold">little.</text>
  <text x="450" y="484" text-anchor="middle" font-size="13" fill="var(--warning-text)" font-weight="bold">This is not market timing. It tells you which evidence has power in conditions that already exist.</text>
  <text x="450" y="510" text-anchor="middle" font-size="12" fill="var(--diagram-muted)">Regimes deteriorate faster than they improve, and here leverage unwinds mechanically rather than by decision.</text>
  <text x="450" y="534" text-anchor="middle" font-size="12" fill="var(--diagram-muted)">Applied to a long-term contribution schedule it becomes market timing under a more respectable name.</text>

  <text x="450" y="34" text-anchor="middle" font-size="21" fill="var(--diagram-text)" font-weight="bold">Why the Allocation Is the Decision That Matters</text>
  <text x="450" y="57" text-anchor="middle" font-size="13" fill="var(--diagram-muted)">A 5% slice, a fourfold rise, and an 80% fall that is ordinary for this asset class rather than catastrophic.</text>
  <text x="288" y="110" text-anchor="end" font-size="13" fill="var(--diagram-text)">start: crypto is 5% of the portfolio</text>

  <text x="401.6666666666667" y="110" text-anchor="start" font-size="13" fill="var(--success-text)" font-weight="bold">portfolio 100</text>
  <text x="288" y="156" text-anchor="end" font-size="13" fill="var(--diagram-text)">after crypto rises fourfold</text>
  <rect x="300" y="136" width="318.99999999999994" height="30" rx="3" fill="var(--warning-500)"/>
  <text x="629" y="156" text-anchor="start" font-size="13" fill="var(--warning-text)" font-weight="bold">now 17.4% — nobody chose that</text>
  <text x="288" y="202" text-anchor="end" font-size="13" fill="var(--diagram-text)">then an 80% fall, unrebalanced</text>
  <rect x="300" y="182" width="73.33333333333333" height="30" rx="3" fill="var(--danger-500)"/>
  <text x="383.3333333333333" y="202" text-anchor="start" font-size="13" fill="var(--danger-text)" font-weight="bold">portfolio 99 — essentially the whole gain returned</text>
  <text x="288" y="248" text-anchor="end" font-size="13" fill="var(--diagram-text)">rebalanced to 5% at the peak instead</text>
  <rect x="300" y="228" width="91.66666666666667" height="30" rx="3" fill="var(--success-500)"/>
  <text x="401.6666666666667" y="248" text-anchor="start" font-size="13" fill="var(--success-text)" font-weight="bold">about 14 moved permanently into the rest</text>

  <rect x="30" y="300" width="265.3333333333333" height="190" rx="10" fill="var(--diagram-bg)" stroke="var(--info-500)" stroke-width="2"/>
  <text x="162.66666666666666" y="330" text-anchor="middle" font-size="16" fill="var(--info-500)" font-weight="bold">Rebalancing</text>
  <text x="46" y="362" text-anchor="start" font-size="13" fill="var(--diagram-text)" font-weight="bold">Not a forecast.</text>
  <text x="46" y="389" text-anchor="start" font-size="13" fill="var(--diagram-muted)">It makes no claim that the asset</text>
  <text x="46" y="408" text-anchor="start" font-size="13" fill="var(--diagram-muted)">sold will now underperform.</text>
  <text x="46" y="445" text-anchor="start" font-size="13" fill="var(--diagram-text)" font-weight="bold">It holds risk where you decided it</text>
  <text x="46" y="464" text-anchor="start" font-size="13" fill="var(--diagram-text)" font-weight="bold">should be.</text>
  <rect x="317.3333333333333" y="300" width="265.3333333333333" height="190" rx="10" fill="var(--diagram-bg)" stroke="var(--warning-500)" stroke-width="2"/>
  <text x="450" y="330" text-anchor="middle" font-size="16" fill="var(--warning-500)" font-weight="bold">Custody hygiene</text>
  <text x="333.3333333333333" y="362" text-anchor="start" font-size="13" fill="var(--diagram-text)" font-weight="bold">Practices decay.</text>
  <text x="333.3333333333333" y="389" text-anchor="start" font-size="13" fill="var(--diagram-muted)">Approvals accumulate. Balances creep</text>
  <text x="333.3333333333333" y="408" text-anchor="start" font-size="13" fill="var(--diagram-muted)">above the cap. Devices are replaced.</text>
  <text x="333.3333333333333" y="445" text-anchor="start" font-size="13" fill="var(--diagram-text)" font-weight="bold">An annual hour: revoke, check,</text>
  <text x="333.3333333333333" y="464" text-anchor="start" font-size="13" fill="var(--diagram-text)" font-weight="bold">access, verify, and tell one person.</text>
  <rect x="604.6666666666666" y="300" width="265.3333333333333" height="190" rx="10" fill="var(--diagram-bg)" stroke="var(--success-500)" stroke-width="2"/>
  <text x="737.3333333333333" y="330" text-anchor="middle" font-size="16" fill="var(--success-500)" font-weight="bold">Process review</text>
  <text x="620.6666666666666" y="362" text-anchor="start" font-size="13" fill="var(--diagram-text)" font-weight="bold">Judge the decision, not the result.</text>
  <text x="620.6666666666666" y="389" text-anchor="start" font-size="13" fill="var(--diagram-muted)">Annual moves here are measured in</text>
  <text x="620.6666666666666" y="408" text-anchor="start" font-size="13" fill="var(--diagram-muted)">multiples.</text>
  <text x="620.6666666666666" y="445" text-anchor="start" font-size="13" fill="var(--diagram-text)" font-weight="bold">A reckless position can return</text>
  <text x="620.6666666666666" y="464" text-anchor="start" font-size="13" fill="var(--diagram-text)" font-weight="bold">several hundred percent and teach</text>
  <text x="620.6666666666666" y="483" text-anchor="start" font-size="13" fill="var(--diagram-text)" font-weight="bold">you nothing.</text>
  <text x="450" y="522" text-anchor="middle" font-size="13" fill="var(--warning-text)" font-weight="bold">Diversification within crypto does not survive the falls, and crypto did not diversify a portfolio when it was needed.</text>
