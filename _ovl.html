  <text x="650" y="376" text-anchor="middle" font-size="14" fill="var(--danger-text)" font-weight="bold">Withdrawing 4% a year, aged 65</text>
  <text x="476" y="404" text-anchor="start" font-size="12" fill="var(--diagram-muted)">Every withdrawal between 2008 and 2011 sold</text>
  <text x="476" y="422" text-anchor="start" font-size="12" fill="var(--diagram-muted)">units at depressed prices, and those units were</text>
  <text x="476" y="440" text-anchor="start" font-size="12" fill="var(--diagram-muted)">not there to participate in the recovery.</text>
  <text x="476" y="466" text-anchor="start" font-size="12" fill="var(--diagram-text)" font-weight="bold">The same fall permanently removed capital.</text>
  <text x="450" y="512" text-anchor="middle" font-size="13" fill="var(--warning-text)" font-weight="bold">Identical portfolios, identical average returns. What differed was the direction their money was flowing.</text>
  <text x="450" y="538" text-anchor="middle" font-size="12" fill="var(--diagram-muted)">Pausing contributions is not neutral either: it declines to buy at exactly the cheapest prices of the decade.</text>
</svg><svg data-key="stocks/stocks-05-3-gamestop" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 560" font-family="Arial, Helvetica, sans-serif" role="img">
  <rect x="0" y="0" width="900" height="560" fill="var(--diagram-bg)"/>
  <text x="450" y="34" text-anchor="middle" font-size="21" fill="var(--diagram-text)" font-weight="bold">GameStop, January 2021: The Story and the Data</text>
  <text x="450" y="57" text-anchor="middle" font-size="13" fill="var(--diagram-muted)">The explanation everyone repeats is the one the regulator examined and did not find support for.</text>
  <rect x="30" y="84" width="265.3333333333333" height="430" rx="10" fill="var(--diagram-bg)" stroke="var(--danger-500)" stroke-width="2"/>
  <text x="162.66666666666666" y="114" text-anchor="middle" font-size="16" fill="var(--danger-text)" font-weight="bold">What almost everyone says</text>
  <text x="46" y="146" text-anchor="start" font-size="13" fill="var(--diagram-text)" font-weight="bold">A short squeeze.</text>
  <text x="46" y="173" text-anchor="start" font-size="13" fill="var(--diagram-muted)">Short sellers forced to buy back,</text>
  <text x="46" y="192" text-anchor="start" font-size="13" fill="var(--diagram-muted)">their buying pushing the price</text>
  <text x="46" y="211" text-anchor="start" font-size="13" fill="var(--diagram-muted)">higher, forcing more to buy.</text>
  <text x="46" y="248" text-anchor="start" font-size="13" fill="var(--diagram-text)" font-weight="bold">Plus a gamma squeeze.</text>
  <text x="46" y="275" text-anchor="start" font-size="13" fill="var(--diagram-muted)">Dealers who sold call options buying</text>
  <text x="46" y="294" text-anchor="start" font-size="13" fill="var(--diagram-muted)">shares to hedge, buying more as the</text>
  <text x="46" y="313" text-anchor="start" font-size="13" fill="var(--diagram-muted)">price rose.</text>
  <text x="46" y="350" text-anchor="start" font-size="13" fill="var(--diagram-text)" font-weight="bold">The circumstantial case was strong.</text>
  <text x="46" y="377" text-anchor="start" font-size="13" fill="var(--diagram-muted)">More than 100% of the freely</text>
  <text x="46" y="396" text-anchor="start" font-size="13" fill="var(--diagram-muted)">tradable shares had been sold short</text>
  <text x="46" y="415" text-anchor="start" font-size="13" fill="var(--diagram-muted)">— the only meme stock where that was</text>
  <text x="46" y="434" text-anchor="start" font-size="13" fill="var(--diagram-muted)">true.</text>
  <rect x="317.3333333333333" y="84" width="265.3333333333333" height="430" rx="10" fill="var(--diagram-bg)" stroke="var(--success-500)" stroke-width="2"/>
  <text x="450" y="114" text-anchor="middle" font-size="16" fill="var(--success-text)" font-weight="bold">What the SEC staff found</text>
  <text x="333.3333333333333" y="146" text-anchor="start" font-size="13" fill="var(--diagram-text)" font-weight="bold">Report published 18 October 2021.</text>
  <text x="333.3333333333333" y="173" text-anchor="start" font-size="13" fill="var(--diagram-muted)">Staff examined the order and trade</text>
  <text x="333.3333333333333" y="192" text-anchor="start" font-size="13" fill="var(--diagram-muted)">data directly.</text>
  <text x="333.3333333333333" y="229" text-anchor="start" font-size="13" fill="var(--diagram-text)" font-weight="bold">Buying came mainly from investors</text>
  <text x="333.3333333333333" y="248" text-anchor="start" font-size="13" fill="var(--diagram-text)" font-weight="bold">holding no short positions.</text>
  <text x="333.3333333333333" y="285" text-anchor="start" font-size="13" fill="var(--diagram-text)" font-weight="bold">Short covering peaked and declined</text>
  <text x="333.3333333333333" y="304" text-anchor="start" font-size="13" fill="var(--diagram-text)" font-weight="bold">before the price reached its highest</text>
  <text x="333.3333333333333" y="323" text-anchor="start" font-size="13" fill="var(--diagram-text)" font-weight="bold">levels.</text>
  <text x="333.3333333333333" y="360" text-anchor="start" font-size="13" fill="var(--diagram-text)" font-weight="bold">Neither a short nor a gamma squeeze</text>
  <text x="333.3333333333333" y="379" text-anchor="start" font-size="13" fill="var(--diagram-text)" font-weight="bold">was the primary cause.</text>
  <text x="333.3333333333333" y="416" text-anchor="start" font-size="13" fill="var(--diagram-muted)">Academic work has since disputed</text>
  <text x="333.3333333333333" y="435" text-anchor="start" font-size="13" fill="var(--diagram-muted)">parts of the report. The honest</text>
  <text x="333.3333333333333" y="454" text-anchor="start" font-size="13" fill="var(--diagram-muted)">state is a disagreement, not either</text>
  <text x="333.3333333333333" y="473" text-anchor="start" font-size="13" fill="var(--diagram-muted)">confident version.</text>
  <rect x="604.6666666666666" y="84" width="265.3333333333333" height="430" rx="10" fill="var(--diagram-bg)" stroke="var(--warning-500)" stroke-width="2"/>
  <text x="737.3333333333333" y="114" text-anchor="middle" font-size="16" fill="var(--warning-text)" font-weight="bold">What actually stopped the buying</text>
  <text x="620.6666666666666" y="146" text-anchor="start" font-size="13" fill="var(--diagram-text)" font-weight="bold">28 January 2021: several brokerages</text>
  <text x="620.6666666666666" y="165" text-anchor="start" font-size="13" fill="var(--diagram-text)" font-weight="bold">allowed selling but not buying.</text>
  <text x="620.6666666666666" y="202" text-anchor="start" font-size="13" fill="var(--diagram-text)" font-weight="bold">Not an instruction. A collateral</text>
  <text x="620.6666666666666" y="221" text-anchor="start" font-size="13" fill="var(--diagram-text)" font-weight="bold">rule.</text>
  <text x="620.6666666666666" y="248" text-anchor="start" font-size="13" fill="var(--diagram-muted)">Clearing houses demand collateral</text>
  <text x="620.6666666666666" y="267" text-anchor="start" font-size="13" fill="var(--diagram-muted)">against trades awaiting settlement,</text>
  <text x="620.6666666666666" y="286" text-anchor="start" font-size="13" fill="var(--diagram-muted)">scaled to volatility and volume.</text>
  <text x="620.6666666666666" y="323" text-anchor="start" font-size="13" fill="var(--diagram-text)" font-weight="bold">Both were extreme, and the demands</text>
  <text x="620.6666666666666" y="342" text-anchor="start" font-size="13" fill="var(--diagram-text)" font-weight="bold">landed within hours.</text>
  <text x="620.6666666666666" y="369" text-anchor="start" font-size="13" fill="var(--diagram-muted)">Restricting purchases cut the</text>
  <text x="620.6666666666666" y="388" text-anchor="start" font-size="13" fill="var(--diagram-muted)">obligations needing collateral.</text>
  <text x="620.6666666666666" y="407" text-anchor="start" font-size="13" fill="var(--diagram-muted)">Sales did not.</text>
  <text x="620.6666666666666" y="444" text-anchor="start" font-size="13" fill="var(--diagram-text)" font-weight="bold">Part of why the United States</text>
  <text x="620.6666666666666" y="463" text-anchor="start" font-size="13" fill="var(--diagram-text)" font-weight="bold">shortened settlement to one day in</text>
  <text x="620.6666666666666" y="482" text-anchor="start" font-size="13" fill="var(--diagram-text)" font-weight="bold">May 2024.</text>
</svg><svg data-key="stocks/stocks-06-1-six-pillars" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 560" font-family="Arial, Helvetica, sans-serif" role="img">
  <rect x="0" y="0" width="900" height="560" fill="var(--diagram-bg)"/>
  <text x="450" y="34" text-anchor="middle" font-size="21" fill="var(--diagram-text)" font-weight="bold">The Six-Pillar Thesis, Scored for an Equity</text>
  <text x="450" y="57" text-anchor="middle" font-size="13" fill="var(--diagram-muted)">A worked example. Conviction means how many independent pillars agree — independent is the hard word.</text>
  <text x="168" y="112" text-anchor="end" font-size="13" fill="var(--diagram-text)">Fundamentals</text>
  <rect x="180" y="92" width="30" height="30" rx="3" fill="var(--success-500)"/>
  <text x="220" y="112" text-anchor="start" font-size="13" fill="var(--success-text)" font-weight="bold">flat revenue, stable cash flow, no net debt — weakly supportive</text>
  <text x="168" y="160" text-anchor="end" font-size="13" fill="var(--diagram-text)">Valuation</text>
  <rect x="180" y="140" width="60" height="30" rx="3" fill="var(--success-500)"/>
  <text x="250" y="160" text-anchor="start" font-size="13" fill="var(--success-text)" font-weight="bold">9 times earnings against a ten-year average of 15 — supportive</text>
  <text x="168" y="208" text-anchor="end" font-size="13" fill="var(--diagram-text)">Catalyst</text>
  <rect x="180" y="188" width="60" height="30" rx="3" fill="var(--success-500)"/>
  <text x="250" y="208" text-anchor="start" font-size="13" fill="var(--success-text)" font-weight="bold">a contract renewal decision due within four months — supportive, with a date</text>
  <text x="168" y="256" text-anchor="end" font-size="13" fill="var(--diagram-text)">Positioning</text>
  <rect x="180" y="236" width="2" height="30" rx="3" fill="var(--diagram-muted)"/>
  <text x="192" y="256" text-anchor="start" font-size="13" fill="var(--diagram-muted)" font-weight="bold">short interest low, no unusual flows — neutral</text>
  <text x="168" y="304" text-anchor="end" font-size="13" fill="var(--diagram-text)">Momentum</text>
  <rect x="180" y="284" width="60" height="30" rx="3" fill="var(--danger-500)"/>
  <text x="250" y="304" text-anchor="start" font-size="13" fill="var(--danger-text)" font-weight="bold">the shares have fallen 30% over twelve months — against</text>
  <text x="168" y="352" text-anchor="end" font-size="13" fill="var(--diagram-text)">Carry</text>
  <rect x="180" y="332" width="60" height="30" rx="3" fill="var(--success-500)"/>
  <text x="250" y="352" text-anchor="start" font-size="13" fill="var(--success-text)" font-weight="bold">a 4% dividend covered twice by earnings — supportive</text>
  <line x1="60" y1="388" x2="840" y2="388" stroke="var(--diagram-grid)" stroke-width="1"/>
  <text x="450" y="416" text-anchor="middle" font-size="14" fill="var(--diagram-text)" font-weight="bold">Four supportive, one neutral, one against, and a dated catalyst. That is a genuine thesis.</text>
  <rect x="120" y="434" width="660" height="100" rx="8" fill="var(--diagram-bg)" stroke="var(--warning-500)" stroke-width="2"/>
  <text x="450" y="460" text-anchor="middle" font-size="13" fill="var(--warning-text)" font-weight="bold">Momentum disagreeing is the normal case, not a contradiction</text>
  <text x="450" y="484" text-anchor="middle" font-size="12" fill="var(--diagram-muted)">Asness, Moskowitz and Pedersen 2013 found value and momentum negatively correlated within and across</text>
  <text x="450" y="502" text-anchor="middle" font-size="12" fill="var(--diagram-muted)">asset classes. A cheap share is usually cheap because it has been falling.</text>
  <text x="450" y="524" text-anchor="middle" font-size="12" fill="var(--diagram-text)" font-weight="bold">The common error: counting one falling price as valuation, carry and sentiment. One fact, three vocabularies.</text>
</svg><svg data-key="stocks/stocks-06-2-transmission-chain" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 560" font-family="Arial, Helvetica, sans-serif" role="img">
  <rect x="0" y="0" width="900" height="560" fill="var(--diagram-bg)"/>
  <text x="450" y="34" text-anchor="middle" font-size="21" fill="var(--diagram-text)" font-weight="bold">Equities Sit Late on the Transmission Chain</text>
  <text x="450" y="57" text-anchor="middle" font-size="13" fill="var(--diagram-muted)">By the time a policy change is visible in share prices, it has already appeared twice.</text>
  <rect x="40" y="108" width="127.2" height="88" rx="8" fill="var(--diagram-bg)" stroke="var(--warning-500)" stroke-width="2"/>
  <text x="103.6" y="136" text-anchor="middle" font-size="13" fill="var(--warning-500)" font-weight="bold">Interest rates</text>
  <text x="103.6" y="218" text-anchor="middle" font-size="12" fill="var(--diagram-muted)">the policy change</text>
  <text x="103.6" y="233" text-anchor="middle" font-size="12" fill="var(--diagram-muted)">itself</text>
  <text x="190.2" y="157" text-anchor="middle" font-size="12" fill="var(--diagram-muted)">then</text>
  <rect x="213.2" y="108" width="127.2" height="88" rx="8" fill="var(--diagram-bg)" stroke="var(--warning-500)" stroke-width="2"/>
  <text x="276.8" y="136" text-anchor="middle" font-size="13" fill="var(--warning-500)" font-weight="bold">Currencies and</text>
  <text x="276.8" y="152" text-anchor="middle" font-size="13" fill="var(--warning-500)" font-weight="bold">bonds</text>
  <text x="276.8" y="218" text-anchor="middle" font-size="12" fill="var(--diagram-muted)">yields move, then FX</text>
  <text x="276.8" y="233" text-anchor="middle" font-size="12" fill="var(--diagram-muted)">adjusts</text>
  <text x="363.4" y="157" text-anchor="middle" font-size="12" fill="var(--diagram-muted)">then</text>
  <rect x="386.4" y="108" width="127.2" height="88" rx="8" fill="var(--diagram-bg)" stroke="var(--info-500)" stroke-width="2"/>
  <text x="450" y="136" text-anchor="middle" font-size="13" fill="var(--info-500)" font-weight="bold">Credit</text>
  <text x="450" y="218" text-anchor="middle" font-size="12" fill="var(--diagram-muted)">spreads widen as</text>
  <text x="450" y="233" text-anchor="middle" font-size="12" fill="var(--diagram-muted)">borrowing costs rise</text>
  <text x="536.6" y="157" text-anchor="middle" font-size="12" fill="var(--diagram-muted)">then</text>
  <rect x="559.5999999999999" y="108" width="127.2" height="88" rx="8" fill="var(--diagram-bg)" stroke="var(--danger-500)" stroke-width="2"/>
  <text x="623.1999999999999" y="136" text-anchor="middle" font-size="13" fill="var(--danger-500)" font-weight="bold">Equities</text>
  <text x="623.1999999999999" y="218" text-anchor="middle" font-size="12" fill="var(--diagram-muted)">two channels at once</text>
  <text x="709.8" y="157" text-anchor="middle" font-size="12" fill="var(--diagram-muted)">then</text>
  <rect x="732.8" y="108" width="127.2" height="88" rx="8" fill="var(--diagram-bg)" stroke="var(--diagram-muted)" stroke-width="2"/>
  <text x="796.4" y="136" text-anchor="middle" font-size="13" fill="var(--diagram-muted)" font-weight="bold">Commodities and</text>
  <text x="796.4" y="152" text-anchor="middle" font-size="13" fill="var(--diagram-muted)" font-weight="bold">crypto</text>
  <text x="796.4" y="218" text-anchor="middle" font-size="12" fill="var(--diagram-muted)">furthest along the</text>
  <text x="796.4" y="233" text-anchor="middle" font-size="12" fill="var(--diagram-muted)">chain</text>
  <rect x="120" y="268" width="660" height="96" rx="8" fill="var(--diagram-bg)" stroke="var(--danger-500)" stroke-width="2"/>
  <text x="450" y="294" text-anchor="middle" font-size="14" fill="var(--danger-text)" font-weight="bold">Why rates hit equities twice</text>
  <text x="450" y="320" text-anchor="middle" font-size="12" fill="var(--diagram-muted)">A higher discount rate reduces the present value of future cash flows, and reduces distant ones most.</text>
  <text x="450" y="340" text-anchor="middle" font-size="12" fill="var(--diagram-muted)">Higher rates also slow the economy those cash flows come from.</text>
  <text x="450" y="394" text-anchor="middle" font-size="14" fill="var(--diagram-text)" font-weight="bold">A high multiple is a bet on distant profits, which is exactly the bet a rate rise damages.</text>
  <line x1="60" y1="416" x2="840" y2="416" stroke="var(--diagram-grid)" stroke-width="1"/>
  <text x="450" y="446" text-anchor="middle" font-size="13" fill="var(--warning-text)" font-weight="bold">Someone watching only equities is reading the last link and calling it news.</text>
  <text x="450" y="472" text-anchor="middle" font-size="12" fill="var(--diagram-muted)">This is not market timing. Regime mapping tells you which pillar to trust in the environment you are already in.</text>
  <text x="450" y="498" text-anchor="middle" font-size="12" fill="var(--diagram-muted)">Regimes shift gradually upward and abruptly downward, so a plan built on reacting meets the slower one.</text>
  <text x="450" y="524" text-anchor="middle" font-size="12" fill="var(--diagram-text)" font-weight="bold">And when nothing aligns, the correct discretionary position is none.</text>
</svg><svg data-key="stocks/stocks-06-3-correlation-tail" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 560" font-family="Arial, Helvetica, sans-serif" role="img">
  <rect x="0" y="0" width="900" height="560" fill="var(--diagram-bg)"/>
  <text x="450" y="34" text-anchor="middle" font-size="21" fill="var(--diagram-text)" font-weight="bold">Diversification Is Weakest Exactly When You Need It</text>
  <text x="450" y="57" text-anchor="middle" font-size="13" fill="var(--diagram-muted)">Longin and Solnik 2001 modelled the tails of international equity returns using extreme value theory.</text>
  <text x="240" y="100" text-anchor="middle" font-size="15" fill="var(--success-text)" font-weight="bold">Ordinary and rising months</text>
  <rect x="80" y="118" width="320" height="200" rx="10" fill="var(--diagram-bg)" stroke="var(--success-500)" stroke-width="2"/>
  <circle cx="130" cy="200" r="20" fill="var(--success-500)" fill-opacity="0.6"/>
  <circle cx="190" cy="250" r="20" fill="var(--success-500)" fill-opacity="0.6"/>
  <circle cx="250" cy="200" r="20" fill="var(--success-500)" fill-opacity="0.6"/>
  <circle cx="310" cy="250" r="20" fill="var(--success-500)" fill-opacity="0.6"/>
  <circle cx="370" cy="200" r="20" fill="var(--success-500)" fill-opacity="0.6"/>
  <text x="240" y="292" text-anchor="middle" font-size="12" fill="var(--diagram-muted)">five markets, moving somewhat separately</text>
  <text x="660" y="100" text-anchor="middle" font-size="15" fill="var(--danger-text)" font-weight="bold">The worst months</text>
  <rect x="500" y="118" width="320" height="200" rx="10" fill="var(--diagram-bg)" stroke="var(--danger-500)" stroke-width="2"/>
  <circle cx="640" cy="210" r="20" fill="var(--danger-500)" fill-opacity="0.5"/>
  <circle cx="650" cy="210" r="20" fill="var(--danger-500)" fill-opacity="0.5"/>
  <circle cx="660" cy="210" r="20" fill="var(--danger-500)" fill-opacity="0.5"/>
  <circle cx="670" cy="210" r="20" fill="var(--danger-500)" fill-opacity="0.5"/>
  <circle cx="680" cy="210" r="20" fill="var(--danger-500)" fill-opacity="0.5"/>
  <text x="660" y="292" text-anchor="middle" font-size="12" fill="var(--diagram-muted)">the same five markets, moving as one</text>
  <rect x="120" y="336" width="660" height="96" rx="8" fill="var(--diagram-bg)" stroke="var(--info-500)" stroke-width="2"/>
  <text x="450" y="362" text-anchor="middle" font-size="14" fill="var(--info-text)" font-weight="bold">The finding is asymmetric</text>
  <text x="450" y="388" text-anchor="middle" font-size="12" fill="var(--diagram-muted)">Correlation rises in the negative tail, when markets fall together. It does not rise in the positive tail.</text>
  <text x="450" y="408" text-anchor="middle" font-size="12" fill="var(--diagram-muted)">They rejected multivariate normality for the negative tail and not for the positive one.</text>
  <text x="450" y="464" text-anchor="middle" font-size="13" fill="var(--diagram-text)" font-weight="bold">A portfolio spread across countries behaves like several investments for years, and like one on the worst days.</text>
  <text x="450" y="490" text-anchor="middle" font-size="12" fill="var(--diagram-muted)">Not an argument against diversifying. An argument against expecting it to deliver in the drawdown what it delivers on average.</text>
  <text x="450" y="516" text-anchor="middle" font-size="12" fill="var(--warning-text)" font-weight="bold">The number to ask for is the correlation during the worst 5% of months. It is almost never the one in the advertisement.</text>
</svg><svg data-key="crypto/crypto-01-1-double-spend" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 560" font-family="Arial, Helvetica, sans-serif">
  <rect x="0" y="0" width="900" height="560" fill="var(--diagram-bg)"/>
  <text x="450" y="36" text-anchor="middle" font-size="22" font-weight="bold" fill="var(--diagram-text)">The Double-Spend Problem vs a Shared Ledger</text>

  <!-- ===== LEFT PANEL: the problem ===== -->
  <rect x="30" y="60" width="410" height="470" rx="10" fill="var(--diagram-bg)" stroke="var(--danger-500)" stroke-width="2"/>
  <text x="235" y="92" text-anchor="middle" font-size="17" font-weight="bold" fill="var(--danger-text)">Digital coin as a plain file</text>
  <text x="235" y="112" text-anchor="middle" font-size="13" fill="var(--diagram-text)">Files copy perfectly. So does the "coin".</text>

  <!-- Alice -->
  <circle cx="235" cy="170" r="30" fill="var(--info-500)"/>
  <text x="235" y="176" text-anchor="middle" font-size="14" font-weight="bold" fill="var(--diagram-block-ink)">Alice</text>
  <!-- coin file at Alice -->
  <rect x="205" y="212" width="60" height="34" rx="6" fill="var(--warning-500)"/>
  <text x="235" y="233" text-anchor="middle" font-size="12" font-weight="bold" fill="var(--diagram-block-ink)">coin.dat</text>

  <!-- arrow to Bob -->
  <line x1="200" y1="255" x2="125" y2="330" stroke="var(--diagram-text)" stroke-width="2.5"/>
  <polygon points="125,330 141,323 132,314" fill="var(--diagram-block-2)"/>
  <text x="120" y="290" text-anchor="middle" font-size="12" fill="var(--diagram-text)">sends file</text>

<svg data-key="crypto/crypto-01-3-pow-vs-pos" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 600" font-family="Arial, Helvetica, sans-serif">
  <rect x="0" y="0" width="900" height="600" fill="var(--diagram-bg)"/>

  <text x="450" y="34" font-size="20" font-weight="bold" fill="var(--diagram-text)" text-anchor="middle">Two Ways to Make the Next Block Expensive</text>
  <text x="450" y="56" font-size="13" fill="var(--info-text)" text-anchor="middle">Consensus: who gets to write history, and what it costs them</text>

  <!-- Panel frames -->
  <rect x="30" y="80" width="410" height="420" rx="10" fill="none" stroke="var(--diagram-text)" stroke-width="1.5"/>
  <rect x="460" y="80" width="410" height="420" rx="10" fill="none" stroke="var(--diagram-text)" stroke-width="1.5"/>

  <text x="235" y="108" font-size="16" font-weight="bold" fill="var(--diagram-text)" text-anchor="middle">PROOF OF WORK</text>
  <text x="235" y="126" font-size="12" fill="var(--danger-text)" text-anchor="middle">pays with electricity</text>
  <text x="665" y="108" font-size="16" font-weight="bold" fill="var(--diagram-text)" text-anchor="middle">PROOF OF STAKE</text>
  <text x="665" y="126" font-size="12" fill="var(--danger-text)" text-anchor="middle">pays with locked capital</text>

  <!-- PoW: input box -->
  <rect x="70" y="145" width="330" height="58" rx="8" fill="var(--warning-500)" fill-opacity="0.15" stroke="var(--warning-500)" stroke-width="1.5"/>
  <text x="235" y="169" font-size="13" font-weight="bold" fill="var(--diagram-text)" text-anchor="middle">HARDWARE + ELECTRICITY</text>
  <text x="235" y="188" font-size="11.5" fill="var(--diagram-text)" text-anchor="middle">miners burn real resources on hash guesses</text>

  <!-- arrow down -->
  <line x1="235" y1="203" x2="235" y2="233" stroke="var(--info-500)" stroke-width="2"/>
  <polygon points="235,241 229,229 241,229" fill="var(--info-500)"/>

  <!-- PoW: race box -->
  <rect x="70" y="243" width="330" height="72" rx="8" fill="var(--info-500)" fill-opacity="0.10" stroke="var(--info-500)" stroke-width="1.5"/>
  <text x="235" y="266" font-size="13" font-weight="bold" fill="var(--diagram-text)" text-anchor="middle">THE NONCE RACE</text>
  <text x="235" y="284" font-size="11.5" fill="var(--diagram-text)" text-anchor="middle">every hash is a lottery ticket; first valid</text>
  <text x="235" y="300" font-size="11.5" fill="var(--diagram-text)" text-anchor="middle">nonce wins the right to propose the block</text>

  <line x1="235" y1="315" x2="235" y2="345" stroke="var(--info-500)" stroke-width="2"/>
  <polygon points="235,353 229,341 241,341" fill="var(--info-500)"/>

  <!-- PoW: block -->
  <rect x="100" y="355" width="270" height="52" rx="8" fill="var(--diagram-block-2)"/>
  <text x="235" y="377" font-size="13" font-weight="bold" fill="var(--diagram-block-ink)" text-anchor="middle">NEW BLOCK</text>
  <text x="235" y="395" font-size="11.5" fill="var(--diagram-block-ink)" text-anchor="middle">winner earns subsidy + fees</text>

  <!-- PoW: reward note -->
  <rect x="70" y="425" width="330" height="55" rx="8" fill="var(--success-500)" fill-opacity="0.12" stroke="var(--success-500)" stroke-width="1.5"/>
  <text x="235" y="447" font-size="11.5" fill="var(--success-text)" font-weight="bold" text-anchor="middle">SELF-REGULATING: difficulty retunes every</text>
  <text x="235" y="464" font-size="11.5" fill="var(--success-text)" text-anchor="middle">2,016 blocks to hold the target block pace</text>

  <!-- PoS: input box -->
  <rect x="500" y="145" width="330" height="58" rx="8" fill="var(--info-500)" fill-opacity="0.15" stroke="var(--info-500)" stroke-width="1.5"/>
  <text x="665" y="169" font-size="13" font-weight="bold" fill="var(--diagram-text)" text-anchor="middle">STAKED CAPITAL</text>
  <text x="665" y="188" font-size="11.5" fill="var(--diagram-text)" text-anchor="middle">validators lock tokens as a bond (32 ETH each)</text>

  <line x1="665" y1="203" x2="665" y2="233" stroke="var(--info-500)" stroke-width="2"/>
  <polygon points="665,241 659,229 671,229" fill="var(--info-500)"/>

  <!-- PoS: selection box -->
  <rect x="500" y="243" width="330" height="72" rx="8" fill="var(--info-500)" fill-opacity="0.10" stroke="var(--info-500)" stroke-width="1.5"/>
  <text x="665" y="266" font-size="13" font-weight="bold" fill="var(--diagram-text)" text-anchor="middle">SELECTION, NOT RACE</text>
  <text x="665" y="284" font-size="11.5" fill="var(--diagram-text)" text-anchor="middle">protocol picks one validator to propose;</text>
  <text x="665" y="300" font-size="11.5" fill="var(--diagram-text)" text-anchor="middle">committees of others attest to the block</text>

  <line x1="665" y1="315" x2="665" y2="345" stroke="var(--info-500)" stroke-width="2"/>
  <polygon points="665,353 659,341 671,341" fill="var(--info-500)"/>

  <!-- PoS: block -->
  <rect x="530" y="355" width="270" height="52" rx="8" fill="var(--diagram-block-2)"/>
  <text x="665" y="377" font-size="13" font-weight="bold" fill="var(--diagram-block-ink)" text-anchor="middle">NEW BLOCK</text>
  <text x="665" y="395" font-size="11.5" fill="var(--diagram-block-ink)" text-anchor="middle">honest work earns staking rewards</text>

  <!-- PoS: slashing note -->
  <rect x="500" y="425" width="330" height="55" rx="8" fill="var(--danger-500)" fill-opacity="0.12" stroke="var(--danger-500)" stroke-width="1.5"/>
  <text x="665" y="447" font-size="11.5" fill="var(--danger-text)" font-weight="bold" text-anchor="middle">SLASHING RISK: sign two conflicting blocks or</text>
  <text x="665" y="464" font-size="11.5" fill="var(--danger-text)" text-anchor="middle">votes and the protocol destroys part of your stake</text>

  <!-- Bottom shared bar -->
  <rect x="30" y="520" width="840" height="58" rx="10" fill="var(--warning-500)" fill-opacity="0.15" stroke="var(--warning-500)" stroke-width="1.5"/>
  <text x="450" y="544" font-size="13" font-weight="bold" fill="var(--diagram-text)" text-anchor="middle">SAME ASSUMPTION ON BOTH SIDES</text>
  <text x="450" y="563" font-size="12" fill="var(--diagram-text)" text-anchor="middle">Attack cost = a majority of the deciding resource: hashpower (PoW) or stake (PoS). Neither side escapes the 51% question.</text>
</svg>
<svg data-key="crypto/crypto-01-4-custody-spectrum" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 560" font-family="Arial, Helvetica, sans-serif">

  <rect x="600" y="100" width="260" height="14" rx="7" fill="var(--info-500)"/>
  <text x="80" y="140" font-size="15" font-weight="bold" fill="var(--warning-text)">HOT</text>
  <text x="80" y="158" font-size="12" fill="var(--diagram-text)">keys touch the internet</text>
  <text x="860" y="140" text-anchor="end" font-size="15" font-weight="bold" fill="var(--info-text)">COLD</text>
  <text x="860" y="158" text-anchor="end" font-size="12" fill="var(--diagram-text)">keys stay offline</text>

  <!-- Station 1: Exchange custody -->
  <rect x="80" y="185" width="230" height="150" rx="10" fill="var(--diagram-bg)" stroke="var(--warning-500)" stroke-width="2.5"/>
  <text x="195" y="215" text-anchor="middle" font-size="16" font-weight="bold" fill="var(--diagram-text)">EXCHANGE CUSTODY</text>
  <line x1="100" y1="228" x2="290" y2="228" stroke="var(--diagram-panel)" stroke-width="1.5"/>
  <text x="195" y="252" text-anchor="middle" font-size="13" fill="var(--diagram-text)">The exchange holds the keys.</text>
  <text x="195" y="272" text-anchor="middle" font-size="13" fill="var(--diagram-text)">Your balance is their IOU.</text>
  <text x="195" y="300" text-anchor="middle" font-size="12" fill="var(--success-text)">Password resets, support,</text>
  <text x="195" y="317" text-anchor="middle" font-size="12" fill="var(--success-text)">instant trading</text>

  <!-- Station 2: Hot wallet -->
  <rect x="355" y="185" width="230" height="150" rx="10" fill="var(--diagram-bg)" stroke="var(--info-500)" stroke-width="2.5"/>
  <text x="470" y="215" text-anchor="middle" font-size="16" font-weight="bold" fill="var(--diagram-text)">HOT WALLET</text>
  <line x1="375" y1="228" x2="565" y2="228" stroke="var(--diagram-panel)" stroke-width="1.5"/>
  <text x="470" y="252" text-anchor="middle" font-size="13" fill="var(--diagram-text)">You hold the keys, on a</text>
  <text x="470" y="272" text-anchor="middle" font-size="13" fill="var(--diagram-text)">connected phone or browser.</text>
  <text x="470" y="300" text-anchor="middle" font-size="12" fill="var(--success-text)">Direct use of the network,</text>
  <text x="470" y="317" text-anchor="middle" font-size="12" fill="var(--success-text)">no permission needed</text>

  <!-- Station 3: Cold storage -->
  <rect x="630" y="185" width="230" height="150" rx="10" fill="var(--diagram-bg)" stroke="var(--diagram-text)" stroke-width="2.5"/>
  <text x="745" y="215" text-anchor="middle" font-size="16" font-weight="bold" fill="var(--diagram-text)">COLD STORAGE</text>
  <line x1="650" y1="228" x2="840" y2="228" stroke="var(--diagram-panel)" stroke-width="1.5"/>
  <text x="745" y="252" text-anchor="middle" font-size="13" fill="var(--diagram-text)">You hold the keys, on a</text>
  <text x="745" y="272" text-anchor="middle" font-size="13" fill="var(--diagram-text)">hardware device kept offline.</text>
  <text x="745" y="300" text-anchor="middle" font-size="12" fill="var(--success-text)">Strongest protection</text>
  <text x="745" y="317" text-anchor="middle" font-size="12" fill="var(--success-text)">against remote theft</text>

  <!-- Connectors -->
  <line x1="310" y1="260" x2="355" y2="260" stroke="var(--diagram-text)" stroke-width="2"/>
  <line x1="585" y1="260" x2="630" y2="260" stroke="var(--diagram-text)" stroke-width="2"/>

  <!-- Risk label: left end -->
  <rect x="80" y="370" width="360" height="110" rx="10" fill="var(--diagram-bg)" stroke="var(--danger-500)" stroke-width="2.5"/>
  <text x="100" y="398" font-size="14" font-weight="bold" fill="var(--danger-text)">RISK AT THIS END: COUNTERPARTY</text>
  <text x="100" y="422" font-size="13" fill="var(--diagram-text)">The company can be hacked, freeze</text>
  <text x="100" y="441" font-size="13" fill="var(--diagram-text)">withdrawals, or go broke with your funds.</text>
  <text x="100" y="465" font-size="12" fill="var(--danger-text)">Mt. Gox (2014), FTX (2022) - see Chapter 5</text>

  <!-- Risk label: right end -->
  <rect x="500" y="370" width="360" height="110" rx="10" fill="var(--diagram-bg)" stroke="var(--danger-500)" stroke-width="2.5"/>
  <text x="520" y="398" font-size="14" font-weight="bold" fill="var(--danger-text)">RISK AT THIS END: IRREVERSIBLE LOSS</text>
  <text x="520" y="422" font-size="13" fill="var(--diagram-text)">Lost seed phrase, mistyped address, or</text>
  <text x="520" y="441" font-size="13" fill="var(--diagram-text)">your own error - and no support line exists.</text>
  <text x="520" y="465" font-size="12" fill="var(--danger-text)">Nobody can freeze you. Nobody can save you.</text>

  <!-- Bottom takeaway -->
  <text x="470" y="520" text-anchor="middle" font-size="14" font-weight="bold" fill="var(--success-text)">Match custody to amount, time horizon, and demonstrated competence -</text>
  <text x="470" y="540" text-anchor="middle" font-size="14" font-weight="bold" fill="var(--success-text)">not to a slogan from either end of the spectrum.</text>
</svg>
<svg data-key="crypto/crypto-01-5-cex-vs-dex" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 560" font-family="Arial, Helvetica, sans-serif">
  <rect x="0" y="0" width="900" height="560" fill="var(--diagram-bg)"/>
  <text x="450" y="36" text-anchor="middle" font-size="22" font-weight="bold" fill="var(--diagram-text)">Where Your Money Actually Goes: CEX vs DEX</text>

  <!-- ===== LEFT PANEL: CEX ===== -->
  <rect x="30" y="60" width="410" height="440" rx="10" fill="var(--diagram-bg)" stroke="var(--warning-500)" stroke-width="2"/>
  <text x="235" y="92" text-anchor="middle" font-size="17" font-weight="bold" fill="var(--warning-text)">Centralized exchange (CEX)</text>
  <text x="235" y="112" text-anchor="middle" font-size="13" fill="var(--diagram-text)">You deposit. They custody. You trade IOUs.</text>

  <!-- You -->
  <circle cx="120" cy="170" r="32" fill="var(--info-500)"/>
  <text x="120" y="167" text-anchor="middle" font-size="14" font-weight="bold" fill="var(--diagram-block-ink)">You</text>
  <text x="120" y="184" text-anchor="middle" font-size="10" fill="var(--diagram-block-ink)">1 BTC</text>

  <!-- deposit arrow -->
  <line x1="158" y1="160" x2="270" y2="160" stroke="var(--diagram-text)" stroke-width="2.5"/>
  <polygon points="270,160 254,153 254,167" fill="var(--diagram-block-2)"/>
  <text x="214" y="148" text-anchor="middle" font-size="12" fill="var(--diagram-text)">deposit (on-chain)</text>

  <!-- exchange wallet -->
  <rect x="275" y="132" width="140" height="60" rx="8" fill="var(--warning-500)"/>
  <text x="345" y="156" text-anchor="middle" font-size="13" font-weight="bold" fill="var(--diagram-block-ink)">EXCHANGE WALLET</text>
  <text x="345" y="176" text-anchor="middle" font-size="12" fill="var(--diagram-block-ink)">THEIR keys hold it</text>

  <!-- arrow down to ledger -->
  <line x1="345" y1="192" x2="345" y2="228" stroke="var(--warning-500)" stroke-width="2.5"/>
  <polygon points="345,228 338,213 352,213" fill="var(--warning-500)"/>

  <!-- internal ledger -->
  <rect x="90" y="232" width="330" height="130" rx="8" fill="var(--diagram-block-2)"/>
  <text x="255" y="258" text-anchor="middle" font-size="13" font-weight="bold" fill="var(--diagram-block-ink)">INTERNAL LEDGER (company database)</text>
  <line x1="110" y1="270" x2="400" y2="270" stroke="var(--diagram-bg)" stroke-width="1"/>
  <text x="255" y="292" text-anchor="middle" font-size="12" fill="var(--warning-text)">Your balance: 1 BTC -- an IOU to you</text>
  <text x="255" y="314" text-anchor="middle" font-size="12" fill="var(--diagram-block-ink)">Every trade edits rows in this database.</text>
  <text x="255" y="336" text-anchor="middle" font-size="12" fill="var(--diagram-block-ink)">The blockchain sees none of it.</text>

  <!-- withdrawal arrow -->
  <line x1="120" y1="366" x2="120" y2="404" stroke="var(--diagram-text)" stroke-width="2.5" stroke-dasharray="6,4"/>
  <polygon points="120,404 113,389 127,389" fill="var(--diagram-block-2)"/>
  <text x="196" y="390" text-anchor="middle" font-size="11" fill="var(--diagram-text)">withdrawal: on-chain again</text>

  <rect x="55" y="410" width="360" height="72" rx="8" fill="var(--danger-500)"/>
  <text x="235" y="436" text-anchor="middle" font-size="13" font-weight="bold" fill="var(--diagram-block-ink)">Counterparty risk: hack, freeze, insolvency</text>
  <text x="235" y="456" text-anchor="middle" font-size="12" fill="var(--diagram-block-ink)">If the company fails, your claim fails with it.</text>
  <text x="235" y="472" text-anchor="middle" font-size="11" fill="var(--diagram-block-ink)">Proof of reserves shows assets, not liabilities.</text>

  <!-- ===== RIGHT PANEL: DEX ===== -->
  <rect x="460" y="60" width="410" height="440" rx="10" fill="var(--diagram-bg)" stroke="var(--success-500)" stroke-width="2"/>
  <text x="665" y="92" text-anchor="middle" font-size="17" font-weight="bold" fill="var(--success-text)">Decentralized exchange (DEX)</text>
  <text x="665" y="112" text-anchor="middle" font-size="13" fill="var(--diagram-text)">No deposit. Your wallet trades with a pool.</text>

  <!-- your wallet -->
  <rect x="545" y="136" width="240" height="60" rx="8" fill="var(--info-500)"/>
  <text x="665" y="160" text-anchor="middle" font-size="13" font-weight="bold" fill="var(--diagram-block-ink)">YOUR WALLET</text>
  <text x="665" y="180" text-anchor="middle" font-size="12" fill="var(--diagram-block-ink)">YOUR keys, before and after the trade</text>

  <!-- two-way arrows -->
  <line x1="610" y1="196" x2="610" y2="260" stroke="var(--success-500)" stroke-width="2.5"/>
  <polygon points="610,260 603,245 617,245" fill="var(--success-500)"/>
  <text x="560" y="232" text-anchor="middle" font-size="11" fill="var(--success-text)">USDC in</text>

  <line x1="720" y1="260" x2="720" y2="196" stroke="var(--success-500)" stroke-width="2.5"/>
  <polygon points="720,196 713,211 727,211" fill="var(--success-500)"/>
  <text x="772" y="232" text-anchor="middle" font-size="11" fill="var(--success-text)">ETH out</text>

  <!-- liquidity pool -->
  <rect x="520" y="264" width="290" height="130" rx="8" fill="var(--success-500)"/>
  <text x="665" y="290" text-anchor="middle" font-size="13" font-weight="bold" fill="var(--diagram-block-ink)">LIQUIDITY POOL (smart contract)</text>
  <line x1="540" y1="302" x2="790" y2="302" stroke="var(--diagram-bg)" stroke-width="1"/>
  <text x="665" y="324" text-anchor="middle" font-size="12" fill="var(--diagram-block-ink)">Reserves: 10 ETH and 20,000 USDC</text>
  <text x="665" y="346" text-anchor="middle" font-size="12" fill="var(--warning-text)">Price rule: x * y = k (stays 200,000)</text>
  <text x="665" y="368" text-anchor="middle" font-size="12" fill="var(--diagram-block-ink)">Big trade vs small pool = big price impact</text>

  <!-- settlement note -->
  <rect x="485" y="410" width="360" height="72" rx="8" fill="var(--info-500)"/>
  <text x="665" y="436" text-anchor="middle" font-size="13" font-weight="bold" fill="var(--diagram-block-ink)">Trade settles on-chain, in one transaction</text>
  <text x="665" y="456" text-anchor="middle" font-size="12" fill="var(--diagram-block-ink)">No custodian -- and no support desk, no undo.</text>
  <text x="665" y="472" text-anchor="middle" font-size="11" fill="var(--diagram-block-ink)">Anyone can list any token. Verify the contract.</text>

  <!-- footer -->
  <text x="450" y="530" text-anchor="middle" font-size="12" fill="var(--diagram-text)">Same question from Lesson 4 decides which risks you carry: who holds the keys?</text>
  <text x="450" y="548" text-anchor="middle" font-size="12" fill="var(--diagram-text)">CEX: their keys, your IOU. DEX: your keys, your mistakes.</text>
</svg>
<svg data-key="crypto/crypto-01-6-transaction-lifecycle" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 475" font-family="Arial, Helvetica, sans-serif">
  <rect x="0" y="0" width="960" height="475" fill="var(--diagram-bg)"/>

  <text x="480" y="40" text-anchor="middle" font-size="25" font-weight="bold" fill="var(--diagram-text)">The Life of a Transaction</text>
  <text x="480" y="64" text-anchor="middle" font-size="13.5" fill="var(--info-text)">Five stages from pressing send to settled - and where the fee auction happens</text>

  <!-- zone brackets -->
  <text x="298" y="96" text-anchor="middle" font-size="12" font-weight="bold" fill="var(--danger-text)">SENT is not SETTLED: can still fail, be replaced, or never confirm</text>
  <line x1="37" y1="106" x2="559" y2="106" stroke="var(--danger-500)" stroke-width="2"/>
  <line x1="37" y1="106" x2="37" y2="114" stroke="var(--danger-500)" stroke-width="2"/>
  <line x1="559" y1="106" x2="559" y2="114" stroke="var(--danger-500)" stroke-width="2"/>

  <text x="753" y="96" text-anchor="middle" font-size="12" font-weight="bold" fill="var(--success-text)">SETTLING: deeper = harder to reverse</text>
  <line x1="583" y1="106" x2="923" y2="106" stroke="var(--success-500)" stroke-width="2"/>
  <line x1="583" y1="106" x2="583" y2="114" stroke="var(--success-500)" stroke-width="2"/>
  <line x1="923" y1="106" x2="923" y2="114" stroke="var(--success-500)" stroke-width="2"/>

  <!-- stage 1 -->
  <rect x="37" y="130" width="158" height="115" rx="10" fill="var(--diagram-block-2)"/>
  <text x="116" y="155" text-anchor="middle" font-size="14.5" font-weight="bold" fill="var(--diagram-block-ink)">1. SIGNED</text>
  <text x="116" y="180" text-anchor="middle" font-size="11.5" fill="var(--diagram-block-ink)">Your wallet signs the</text>
  <text x="116" y="196" text-anchor="middle" font-size="11.5" fill="var(--diagram-block-ink)">instruction with your</text>
  <text x="116" y="212" text-anchor="middle" font-size="11.5" fill="var(--diagram-block-ink)">private key (Lesson 4)</text>

  <line x1="195" y1="187" x2="207" y2="187" stroke="var(--diagram-text)" stroke-width="3"/>
  <polygon points="207,180 219,187 207,194" fill="var(--diagram-block-2)"/>

  <!-- stage 2 -->
  <rect x="219" y="130" width="158" height="115" rx="10" fill="var(--info-500)"/>
  <text x="298" y="155" text-anchor="middle" font-size="14.5" font-weight="bold" fill="var(--diagram-block-ink)">2. BROADCAST</text>
  <text x="298" y="180" text-anchor="middle" font-size="11.5" fill="var(--diagram-block-ink)">Nodes pass it across</text>
  <text x="298" y="196" text-anchor="middle" font-size="11.5" fill="var(--diagram-block-ink)">the peer-to-peer</text>
  <text x="298" y="212" text-anchor="middle" font-size="11.5" fill="var(--diagram-block-ink)">network in seconds</text>

  <line x1="377" y1="187" x2="389" y2="187" stroke="var(--diagram-text)" stroke-width="3"/>
  <polygon points="389,180 401,187 389,194" fill="var(--diagram-block-2)"/>

  <!-- stage 3 -->
  <rect x="401" y="130" width="158" height="115" rx="10" fill="var(--warning-500)"/>
  <text x="480" y="155" text-anchor="middle" font-size="14.5" font-weight="bold" fill="var(--diagram-block-ink)">3. MEMPOOL</text>
  <text x="480" y="180" text-anchor="middle" font-size="11.5" fill="var(--diagram-block-ink)">The waiting room:</text>
  <text x="480" y="196" text-anchor="middle" font-size="11.5" fill="var(--diagram-block-ink)">seen by the network,</text>
  <text x="480" y="212" text-anchor="middle" font-size="11.5" fill="var(--diagram-block-ink)">not yet recorded</text>

  <line x1="559" y1="187" x2="571" y2="187" stroke="var(--diagram-text)" stroke-width="3"/>
  <polygon points="571,180 583,187 571,194" fill="var(--diagram-block-2)"/>

  <!-- stage 4 -->
  <rect x="583" y="130" width="158" height="115" rx="10" fill="var(--info-500)"/>
  <text x="662" y="155" text-anchor="middle" font-size="14.5" font-weight="bold" fill="var(--diagram-block-ink)">4. IN A BLOCK</text>
  <text x="662" y="180" text-anchor="middle" font-size="11.5" fill="var(--diagram-block-ink)">A miner or validator</text>
  <text x="662" y="196" text-anchor="middle" font-size="11.5" fill="var(--diagram-block-ink)">selects it into the next</text>
  <text x="662" y="212" text-anchor="middle" font-size="11.5" fill="var(--diagram-block-ink)">block (Lessons 2, 3)</text>

  <line x1="741" y1="187" x2="753" y2="187" stroke="var(--diagram-text)" stroke-width="3"/>
  <polygon points="753,180 765,187 753,194" fill="var(--diagram-block-2)"/>

  <!-- stage 5 -->
  <rect x="765" y="130" width="158" height="115" rx="10" fill="var(--success-500)"/>
  <text x="844" y="155" text-anchor="middle" font-size="14.5" font-weight="bold" fill="var(--diagram-block-ink)">5. BURIED</text>
  <text x="844" y="180" text-anchor="middle" font-size="11.5" fill="var(--diagram-block-ink)">Each new block adds</text>
  <text x="844" y="196" text-anchor="middle" font-size="11.5" fill="var(--diagram-block-ink)">one confirmation</text>
  <text x="844" y="212" text-anchor="middle" font-size="11.5" fill="var(--diagram-block-ink)">and more depth</text>

  <!-- fee auction annotation -->
  <line x1="480" y1="245" x2="330" y2="292" stroke="var(--warning-500)" stroke-width="2" stroke-dasharray="5,4"/>
  <rect x="60" y="292" width="520" height="118" rx="10" fill="var(--diagram-bg)" stroke="var(--warning-500)" stroke-width="2.5" stroke-dasharray="7,5"/>
  <text x="80" y="318" font-size="13.5" font-weight="bold" fill="var(--warning-text)">THE FEE AUCTION (happens here)</text>
  <text x="80" y="340" font-size="12" fill="var(--diagram-text)">- Block space is scarce: only so many transactions fit in each block</text>
  <text x="80" y="359" font-size="12" fill="var(--diagram-text)">- Users bid fees; block producers pick the highest-paying first</text>
  <text x="80" y="378" font-size="12" fill="var(--diagram-text)">- When demand spikes, fees spike; a too-low bid can wait for days</text>
  <text x="80" y="397" font-size="12" fill="var(--diagram-text)">- Fees price size and computation, never the amount you move</text>

  <!-- confirmations annotation -->
  <line x1="844" y1="245" x2="775" y2="292" stroke="var(--success-500)" stroke-width="2" stroke-dasharray="5,4"/>
  <rect x="620" y="292" width="310" height="118" rx="10" fill="var(--diagram-bg)" stroke="var(--success-500)" stroke-width="2.5"/>
  <text x="640" y="318" font-size="13.5" font-weight="bold" fill="var(--success-text)">N CONFIRMATIONS</text>
  <rect x="640" y="330" width="44" height="26" rx="4" fill="var(--success-500)"/>
  <text x="662" y="347" text-anchor="middle" font-size="11.5" font-weight="bold" fill="var(--diagram-block-ink)">+1</text>
  <line x1="684" y1="343" x2="696" y2="343" stroke="var(--success-500)" stroke-width="2.5"/>
  <rect x="696" y="330" width="44" height="26" rx="4" fill="var(--success-500)"/>
  <text x="718" y="347" text-anchor="middle" font-size="11.5" font-weight="bold" fill="var(--diagram-block-ink)">+2</text>
  <line x1="740" y1="343" x2="752" y2="343" stroke="var(--success-500)" stroke-width="2.5"/>
  <rect x="752" y="330" width="44" height="26" rx="4" fill="var(--success-500)"/>
  <text x="774" y="347" text-anchor="middle" font-size="11.5" font-weight="bold" fill="var(--diagram-block-ink)">+3</text>
  <line x1="796" y1="343" x2="808" y2="343" stroke="var(--success-500)" stroke-width="2.5"/>
  <text x="822" y="347" font-size="11.5" font-weight="bold" fill="var(--success-text)">...</text>
  <text x="640" y="380" font-size="12" fill="var(--diagram-text)">Reversing means redoing the work</text>
  <text x="640" y="398" font-size="12" fill="var(--diagram-text)">for every block on top (Lesson 2)</text>

  <text x="480" y="446" text-anchor="middle" font-size="12.5" font-weight="bold" fill="var(--danger-text)">Check any transaction yourself on a block explorer: status, confirmations, fee.</text>
</svg>
<svg data-key="crypto/crypto-01-7-stablecoin-models" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 620" font-family="Arial, Helvetica, sans-serif">
  <rect x="0" y="0" width="980" height="620" fill="var(--diagram-bg)"/>
  <text x="490" y="34" text-anchor="middle" font-size="22" font-weight="bold" fill="var(--diagram-text)">Three Ways to Hold a $1 Peg</text>
  <text x="490" y="56" text-anchor="middle" font-size="13" fill="var(--diagram-text)">Same target price. Very different mechanisms.</text>

  <!-- ===== PANEL 1: FIAT-BACKED ===== -->
  <rect x="20" y="78" width="300" height="440" rx="10" fill="var(--diagram-bg)" stroke="var(--info-500)" stroke-width="2"/>
  <text x="170" y="106" text-anchor="middle" font-size="16" font-weight="bold" fill="var(--info-text)">1. Fiat-Backed</text>
  <text x="170" y="126" text-anchor="middle" font-size="12" fill="var(--diagram-text)">USDT, USDC</text>

  <!-- token -->
  <circle cx="170" cy="176" r="30" fill="var(--info-500)"/>
  <text x="170" y="172" text-anchor="middle" font-size="13" font-weight="bold" fill="var(--diagram-block-ink)">1 token</text>
  <text x="170" y="188" text-anchor="middle" font-size="12" fill="var(--diagram-block-ink)">= $1</text>

  <!-- redeem arrows -->
  <line x1="150" y1="212" x2="150" y2="268" stroke="var(--success-500)" stroke-width="2.5"/>
  <polygon points="150,268 144,256 156,256" fill="var(--success-500)"/>
  <line x1="190" y1="268" x2="190" y2="212" stroke="var(--success-500)" stroke-width="2.5"/>
  <polygon points="190,212 184,224 196,224" fill="var(--success-500)"/>
  <text x="170" y="244" text-anchor="middle" font-size="11" fill="var(--success-text)">redeem / issue</text>

  <text x="76" y="537" font-family="Helvetica, Arial, sans-serif" font-size="11.5" fill="var(--danger-text)">cycles at most, and a fourth still running. Not a sample.</text>

  <rect x="460" y="482" width="380" height="66" rx="5" fill="var(--warning-soft)" stroke="var(--warning-500)" stroke-width="1.5"/>
  <text x="476" y="503" font-family="Helvetica, Arial, sans-serif" font-size="13" font-weight="bold" fill="var(--warning-text)">Not actually four years</text>
  <text x="476" y="521" font-family="Helvetica, Arial, sans-serif" font-size="11.5" fill="var(--warning-text)">Gaps between halvings: 3.61, 3.84 and 3.94 years. The</text>
  <text x="476" y="537" font-family="Helvetica, Arial, sans-serif" font-size="11.5" fill="var(--warning-text)">schedule counts blocks, not calendar days.</text>

  <text x="450" y="576" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="var(--diagram-text)">The supply schedule is certain. What price does in response is not.</text>
</svg>
<svg data-key="crypto/crypto-02-3-correlation-regimes" viewBox="0 0 900 620" xmlns="http://www.w3.org/2000/svg" font-family="Arial, Helvetica, sans-serif">

  <text x="450" y="55" text-anchor="middle" font-size="12" font-style="italic" fill="var(--diagram-block-ink)">Schematic illustration only -- shapes are drawn to explain the idea, not plotted from data.</text>

  <text x="284" y="128" text-anchor="middle" font-size="12.5" font-weight="bold" fill="var(--success-text)">FX and bonds</text>
  <text x="284" y="146" text-anchor="middle" font-size="10" fill="var(--diagram-text)">closest to rates</text>
  <text x="364" y="140" font-size="16" fill="var(--diagram-muted)">-&gt;</text>

  <text x="455" y="128" text-anchor="middle" font-size="12.5" font-weight="bold" fill="var(--warning-text)">Credit, equities</text>
  <text x="455" y="146" text-anchor="middle" font-size="10" fill="var(--diagram-text)">Nasdaq 2022: about -33%</text>
  <text x="535" y="140" font-size="16" fill="var(--diagram-muted)">-&gt;</text>

  <rect x="553" y="104" width="128" height="62" rx="8" fill="var(--diagram-panel)" stroke="var(--warning-500)" stroke-width="2"/>

  <text x="783" y="156" text-anchor="middle" font-size="10" fill="var(--diagram-text)">BTC 2022: about -64%</text>

  <text x="40" y="192" font-size="11" font-style="italic" fill="var(--diagram-block-ink)">Same direction as equities, larger amplitude. IMF WP/23/163: a tightening shock moved the crypto factor about -0.15 SD versus about -0.10 SD for equities.</text>

  <!-- y labels -->

  <text x="102" y="415" text-anchor="end" font-size="11" fill="var(--diagram-text)">0.25</text>

  <line x1="110" y1="364" x2="840" y2="364" stroke="var(--diagram-panel)" stroke-width="1"/>
  <line x1="110" y1="415" x2="840" y2="415" stroke="var(--diagram-panel)" stroke-width="1"/>

  <!-- schematic correlation path: low and choppy, then rising sharply in stress, then easing -->
  <polyline points="120,432 155,420 190,438 225,425 260,410 295,428 330,404 365,418 400,396 435,408 470,384 505,395 540,372 560,340 585,300 610,276 640,266 670,262 700,268 730,284 760,300 790,318 820,330"
            fill="none" stroke="var(--danger-500)" stroke-width="3"/>

  <text x="130" y="306" font-size="10.5" fill="var(--diagram-text)">Correlation drifts low and choppy.</text>
  <text x="130" y="320" font-size="10.5" fill="var(--diagram-text)">This is the window "uncorrelated"</text>
  <text x="130" y="334" font-size="10.5" fill="var(--diagram-text)">claims are usually measured over.</text>

  <text x="612" y="376" text-anchor="middle" font-size="11.5" font-weight="bold" fill="var(--danger-text)">Crisis correlation</text>
  <text x="612" y="392" text-anchor="middle" font-size="10.5" fill="var(--diagram-text)">Correlation runs toward 1</text>
  <text x="612" y="406" text-anchor="middle" font-size="10.5" fill="var(--diagram-text)">exactly when diversification</text>
  <text x="612" y="420" text-anchor="middle" font-size="10.5" fill="var(--diagram-text)">was supposed to help.</text>

  <text x="770" y="404" text-anchor="middle" font-size="10.5" font-style="italic" fill="var(--diagram-block-ink)">eases, but not</text>
  <text x="770" y="418" text-anchor="middle" font-size="10.5" font-style="italic" fill="var(--diagram-block-ink)">back to the old level</text>

  <text x="475" y="482" text-anchor="middle" font-size="11" font-weight="bold" fill="var(--diagram-text)">time</text>

  <!-- footer facts -->
  <rect x="40" y="504" width="400" height="78" rx="10" fill="var(--info-soft)" stroke="var(--info-500)" stroke-width="2"/>
  <text x="60" y="526" font-size="12" font-weight="bold" fill="var(--info-text)">Same pair, different windows (IMF, Jan 2022)</text>
  <text x="60" y="546" font-size="11" fill="var(--diagram-text)">BTC vs S&amp;P 500, 2017-2019: correlation 0.01</text>
  <text x="60" y="562" font-size="11" fill="var(--diagram-text)">BTC vs S&amp;P 500, 2020-2021: correlation 0.36</text>
  <text x="60" y="576" font-size="10" font-style="italic" fill="var(--diagram-block-ink)">A correlation with no window attached is not a measurement.</text>

  <rect x="460" y="504" width="400" height="78" rx="10" fill="var(--diagram-panel)" stroke="var(--danger-500)" stroke-width="2"/>
  <text x="480" y="526" font-size="12" font-weight="bold" fill="var(--danger-text)">The asymmetry (Longin and Solnik 2001)</text>
  <text x="480" y="546" font-size="11" fill="var(--diagram-text)">Linkage is stronger in extreme falls than in</text>
  <text x="480" y="562" font-size="11" fill="var(--diagram-text)">extreme rises. Diversification is measured in</text>
  <text x="480" y="576" font-size="11" fill="var(--diagram-text)">calm markets and tested in crashes.</text>

  <text x="450" y="606" text-anchor="middle" font-size="11.5" font-style="italic" fill="var(--diagram-text)">Size crypto as the high-beta tail of a risk portfolio, not as protection against one.</text>
</svg>
<svg data-key="crypto/crypto-02-4-address-not-person" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 600" font-family="Arial, Helvetica, sans-serif">
  <rect x="0" y="0" width="900" height="600" fill="var(--diagram-bg)"/>

  <text x="450" y="34" text-anchor="middle" font-size="22" font-weight="bold" fill="var(--diagram-text)">An Address Is Not a Person</text>
  <text x="450" y="58" text-anchor="middle" font-size="13" fill="var(--diagram-text)">Two counting errors, running in opposite directions, in every address-based metric</text>

  <!-- ===== LEFT PANEL: one user, many addresses ===== -->
  <rect x="25" y="78" width="410" height="420" rx="10" fill="var(--diagram-bg)" stroke="var(--info-500)" stroke-width="2"/>
  <text x="230" y="106" text-anchor="middle" font-size="17" font-weight="bold" fill="var(--info-text)">One user, many addresses</text>
  <text x="230" y="126" text-anchor="middle" font-size="12" fill="var(--diagram-text)">Wallet software makes a fresh address for every</text>
  <text x="230" y="142" text-anchor="middle" font-size="12" fill="var(--diagram-text)">payment received and every bit of change returned.</text>

  <circle cx="112" cy="265" r="34" fill="var(--info-500)"/>
  <text x="112" y="262" text-anchor="middle" font-size="13" font-weight="bold" fill="var(--diagram-block-ink)">1 REAL</text>
  <text x="112" y="278" text-anchor="middle" font-size="13" font-weight="bold" fill="var(--diagram-block-ink)">PERSON</text>

  <line x1="150" y1="265" x2="248" y2="174" stroke="var(--info-500)" stroke-width="2"/>
  <line x1="150" y1="265" x2="248" y2="210" stroke="var(--info-500)" stroke-width="2"/>
  <line x1="150" y1="265" x2="248" y2="246" stroke="var(--info-500)" stroke-width="2"/>
  <line x1="150" y1="265" x2="248" y2="282" stroke="var(--info-500)" stroke-width="2"/>
  <line x1="150" y1="265" x2="248" y2="318" stroke="var(--info-500)" stroke-width="2"/>
  <line x1="150" y1="265" x2="248" y2="354" stroke="var(--info-500)" stroke-width="2"/>

  <rect x="250" y="160" width="150" height="28" rx="6" fill="var(--diagram-bg)" stroke="var(--diagram-text)" stroke-width="1.5"/>
  <text x="325" y="179" text-anchor="middle" font-size="12" fill="var(--diagram-text)">address 1</text>
  <rect x="250" y="196" width="150" height="28" rx="6" fill="var(--diagram-bg)" stroke="var(--diagram-text)" stroke-width="1.5"/>
  <text x="325" y="215" text-anchor="middle" font-size="12" fill="var(--diagram-text)">address 2</text>
  <rect x="250" y="232" width="150" height="28" rx="6" fill="var(--diagram-bg)" stroke="var(--diagram-text)" stroke-width="1.5"/>
  <text x="325" y="251" text-anchor="middle" font-size="12" fill="var(--diagram-text)">address 3</text>
  <rect x="250" y="268" width="150" height="28" rx="6" fill="var(--diagram-bg)" stroke="var(--diagram-text)" stroke-width="1.5"/>
  <text x="325" y="287" text-anchor="middle" font-size="12" fill="var(--diagram-text)">address 4</text>
  <rect x="250" y="304" width="150" height="28" rx="6" fill="var(--diagram-bg)" stroke="var(--diagram-text)" stroke-width="1.5"/>
  <text x="325" y="323" text-anchor="middle" font-size="12" fill="var(--diagram-text)">change address</text>
  <rect x="250" y="340" width="150" height="28" rx="6" fill="var(--diagram-bg)" stroke="var(--diagram-text)" stroke-width="1.5"/>
  <text x="325" y="359" text-anchor="middle" font-size="12" fill="var(--diagram-text)">change address</text>

  <text x="230" y="392" text-anchor="middle" font-size="12" fill="var(--warning-text)">Internal and change transfers move no money</text>
  <text x="230" y="408" text-anchor="middle" font-size="12" fill="var(--warning-text)">between people, but still add to the count.</text>

  <rect x="45" y="420" width="370" height="60" rx="8" fill="var(--info-500)"/>
  <text x="230" y="444" text-anchor="middle" font-size="14" font-weight="bold" fill="var(--diagram-block-ink)">Metric says: 6 active addresses</text>
  <text x="230" y="466" text-anchor="middle" font-size="14" font-weight="bold" fill="var(--diagram-block-ink)">Reality: 1 user. Count is too high.</text>

  <!-- ===== RIGHT PANEL: one address, many users ===== -->
  <rect x="465" y="78" width="410" height="420" rx="10" fill="var(--diagram-bg)" stroke="var(--success-500)" stroke-width="2"/>
  <text x="670" y="106" text-anchor="middle" font-size="17" font-weight="bold" fill="var(--success-text)">One address, many users</text>
  <text x="670" y="126" text-anchor="middle" font-size="12" fill="var(--diagram-text)">A centralized exchange holds all customer coins in</text>
  <text x="670" y="142" text-anchor="middle" font-size="12" fill="var(--diagram-text)">wallets it controls. Customer trades are database rows.</text>

  <circle cx="528" cy="176" r="16" fill="var(--success-500)"/>
  <circle cx="528" cy="220" r="16" fill="var(--success-500)"/>
  <circle cx="528" cy="264" r="16" fill="var(--success-500)"/>
  <circle cx="528" cy="308" r="16" fill="var(--success-500)"/>
  <circle cx="528" cy="352" r="16" fill="var(--success-500)"/>
  <text x="528" y="386" text-anchor="middle" font-size="12" fill="var(--diagram-text)">plus millions</text>
  <text x="528" y="402" text-anchor="middle" font-size="12" fill="var(--diagram-text)">more customers</text>

  <line x1="546" y1="176" x2="712" y2="255" stroke="var(--success-500)" stroke-width="2"/>
  <line x1="546" y1="220" x2="712" y2="262" stroke="var(--success-500)" stroke-width="2"/>
  <line x1="546" y1="264" x2="712" y2="268" stroke="var(--success-500)" stroke-width="2"/>
  <line x1="546" y1="308" x2="712" y2="275" stroke="var(--success-500)" stroke-width="2"/>
  <line x1="546" y1="352" x2="712" y2="282" stroke="var(--success-500)" stroke-width="2"/>

  <rect x="714" y="232" width="146" height="72" rx="8" fill="var(--success-500)"/>
  <text x="787" y="258" text-anchor="middle" font-size="13" font-weight="bold" fill="var(--diagram-block-ink)">EXCHANGE</text>
  <text x="787" y="277" text-anchor="middle" font-size="12" fill="var(--diagram-block-ink)">1 pooled address</text>
  <text x="787" y="294" text-anchor="middle" font-size="12" fill="var(--diagram-block-ink)">holds every balance</text>

  <text x="700" y="340" text-anchor="middle" font-size="12" fill="var(--warning-text)">Trades between customers never reach the chain,</text>
  <text x="700" y="356" text-anchor="middle" font-size="12" fill="var(--warning-text)">so they are counted zero times.</text>

  <rect x="485" y="420" width="370" height="60" rx="8" fill="var(--success-500)"/>
  <text x="670" y="444" text-anchor="middle" font-size="14" font-weight="bold" fill="var(--diagram-block-ink)">Metric says: 1 active address</text>
  <text x="670" y="466" text-anchor="middle" font-size="14" font-weight="bold" fill="var(--diagram-block-ink)">Reality: millions. Count is too low.</text>

  <!-- ===== BOTTOM BAND ===== -->
  <rect x="25" y="514" width="850" height="64" rx="8" fill="var(--danger-500)"/>
  <text x="450" y="540" text-anchor="middle" font-size="14" font-weight="bold" fill="var(--diagram-block-ink)">Both errors occur at the same time, in opposite directions, and neither can be measured.</text>
  <text x="450" y="562" text-anchor="middle" font-size="14" fill="var(--diagram-block-ink)">So a count of active addresses is a count of addresses. It is not a count of people.</text>
</svg>
<svg data-key="crypto/crypto-02-5-reflexivity-loop" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 640" font-family="Arial, Helvetica, sans-serif">
  <rect x="0" y="0" width="980" height="640" fill="var(--diagram-bg)"/>

  <text x="490" y="34" text-anchor="middle" font-size="22" font-weight="bold" fill="var(--diagram-text)">The Reflexive Loop</text>
  <text x="490" y="56" text-anchor="middle" font-size="13" fill="var(--diagram-text)">The same circle runs both ways. Nothing about the asset has to change.</text>

  <!-- ================= LEFT PANEL: BOOM ================= -->

  <text x="250" y="163" text-anchor="middle" font-size="11.5" fill="var(--diagram-block-ink)">"this will be worth more"</text>

  <!-- Node 2: buying -->
  <rect x="300" y="222" width="168" height="52" rx="8" fill="var(--info-500)"/>

  <text x="384" y="263" text-anchor="middle" font-size="11.5" fill="var(--diagram-block-ink)">acting on the story</text>

  <!-- Node 3: price up -->
  <rect x="300" y="342" width="168" height="52" rx="8" fill="var(--success-500)"/>
  <text x="384" y="365" text-anchor="middle" font-size="13" font-weight="bold" fill="var(--diagram-block-ink)">3. Price rises</text>
  <text x="384" y="383" text-anchor="middle" font-size="11.5" fill="var(--diagram-block-ink)">because they bought</text>

  <!-- Node 4: validation -->
  <rect x="90" y="452" width="320" height="52" rx="8" fill="var(--warning-500)"/>
  <text x="250" y="475" text-anchor="middle" font-size="13" font-weight="bold" fill="var(--diagram-block-ink)">4. The rise is read as proof</text>
  <text x="250" y="493" text-anchor="middle" font-size="11.5" fill="var(--diagram-block-ink)">"the chart shows the story is right"</text>

  <line x1="96" y1="452" x2="96" y2="156" stroke="var(--warning-500)" stroke-width="2.5"/>

  <text x="730" y="104" text-anchor="middle" font-size="17" font-weight="bold" fill="var(--danger-text)">Running backwards: the bust</text>

  <!-- Node 1: doubt -->
  <rect x="630" y="122" width="200" height="52" rx="8" fill="var(--diagram-block-2)"/>
  <text x="730" y="145" text-anchor="middle" font-size="13" font-weight="bold" fill="var(--diagram-block-ink)">1. Doubt spreads</text>
  <text x="730" y="163" text-anchor="middle" font-size="11.5" fill="var(--diagram-block-ink)">"maybe the story was wrong"</text>

  <!-- Node 2: selling -->
  <rect x="780" y="222" width="168" height="52" rx="8" fill="var(--info-500)"/>
  <text x="864" y="245" text-anchor="middle" font-size="13" font-weight="bold" fill="var(--diagram-block-ink)">2. People sell</text>
  <text x="864" y="263" text-anchor="middle" font-size="11.5" fill="var(--diagram-block-ink)">acting on the doubt</text>

  <!-- Node 3: price down -->
  <rect x="780" y="342" width="168" height="52" rx="8" fill="var(--danger-500)"/>
  <text x="864" y="365" text-anchor="middle" font-size="13" font-weight="bold" fill="var(--diagram-block-ink)">3. Price falls</text>
  <text x="864" y="383" text-anchor="middle" font-size="11.5" fill="var(--diagram-block-ink)">because they sold</text>

  <!-- Node 4: refutation -->
  <rect x="570" y="452" width="320" height="52" rx="8" fill="var(--warning-500)"/>
  <text x="730" y="475" text-anchor="middle" font-size="13" font-weight="bold" fill="var(--diagram-block-ink)">4. The fall is read as proof</text>
  <text x="730" y="493" text-anchor="middle" font-size="11.5" fill="var(--diagram-block-ink)">"the chart shows the story failed"</text>

  <!-- arrows -->
  <line x1="810" y1="176" x2="858" y2="214" stroke="var(--diagram-text)" stroke-width="2.5"/>
  <polygon points="864,219 851,216 859,206" fill="var(--diagram-block-2)"/>

  <line x1="864" y1="274" x2="864" y2="334" stroke="var(--info-500)" stroke-width="2.5"/>
  <polygon points="864,340 857,326 871,326" fill="var(--info-500)"/>

  <line x1="856" y1="394" x2="810" y2="444" stroke="var(--danger-500)" stroke-width="2.5"/>
  <polygon points="805,450 808,436 818,445" fill="var(--danger-500)"/>

  <line x1="576" y1="452" x2="576" y2="156" stroke="var(--warning-500)" stroke-width="2.5"/>
  <line x1="576" y1="156" x2="622" y2="150" stroke="var(--warning-500)" stroke-width="2.5"/>
  <polygon points="628,149 615,144 617,156" fill="var(--warning-500)"/>
  <text x="566" y="310" text-anchor="middle" font-size="11.5" fill="var(--warning-text)" transform="rotate(-90 566 310)">5. more selling -&gt;</text>

  <!-- ================= FOOTER ================= -->
  <rect x="20" y="562" width="940" height="60" rx="8" fill="var(--diagram-bg)" stroke="var(--diagram-text)" stroke-width="1.5"/>
  <text x="490" y="586" text-anchor="middle" font-size="13" font-weight="bold" fill="var(--diagram-text)">Step 3 never tested step 1. The price moved because people acted on the story.</text>
  <text x="490" y="608" text-anchor="middle" font-size="12" fill="var(--diagram-text)">The loop says a move can run far past any sensible valuation, in either direction. It never says when it turns.</text>
</svg>
<svg data-key="crypto/crypto-03-1-position-sizing" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 600" font-family="Arial, Helvetica, sans-serif">
  <rect x="0" y="0" width="900" height="600" fill="var(--diagram-bg)"/>

  <text x="450" y="34" text-anchor="middle" font-size="22" font-weight="bold" fill="var(--diagram-text)">One Risk Budget, Three Stop Distances</text>
  <text x="450" y="56" text-anchor="middle" font-size="13" fill="var(--info-text)">The formula never changes. Only the denominator does.</text>

  <text x="450" y="96" text-anchor="middle" font-size="16" font-weight="bold" fill="var(--diagram-block-ink)">Account $5,000 -&gt; risk 1% -&gt; $50 at risk</text>
  <text x="450" y="117" text-anchor="middle" font-size="12" fill="var(--diagram-block-ink)">The same $50 in all three rows below. It never moves.</text>

  <line x1="450" y1="128" x2="450" y2="146" stroke="var(--diagram-text)" stroke-width="2.5"/>
