<svg viewBox="0 0 900 480" xmlns="http://www.w3.org/2000/svg" font-family="Arial, Helvetica, sans-serif">
  <rect width="900" height="480" fill="#FDFCF9"/>

  <text x="450" y="40" text-anchor="middle" font-size="24" font-weight="bold" fill="#1F3864">The Double Coincidence of Wants</text>

  <!-- LEFT: Without money -->
  <text x="230" y="80" text-anchor="middle" font-size="17" font-weight="bold" fill="#B23B2E">Without Money (Barter)</text>

  <!-- Farmer box -->
  <rect x="60" y="110" width="180" height="110" rx="10" fill="#FFF3EF" stroke="#B23B2E" stroke-width="2"/>
  <text x="150" y="140" text-anchor="middle" font-size="15" font-weight="bold" fill="#333333">Farmer</text>
  <text x="150" y="165" text-anchor="middle" font-size="13" fill="#333333">Has: Vegetables</text>
  <text x="150" y="185" text-anchor="middle" font-size="13" fill="#333333">Wants: Shoes</text>

  <!-- Shoemaker box -->
  <rect x="290" y="110" width="180" height="110" rx="10" fill="#FFF3EF" stroke="#B23B2E" stroke-width="2"/>
  <text x="380" y="140" text-anchor="middle" font-size="15" font-weight="bold" fill="#333333">Shoemaker</text>
  <text x="380" y="165" text-anchor="middle" font-size="13" fill="#333333">Has: Shoes</text>
  <text x="380" y="185" text-anchor="middle" font-size="13" fill="#333333">Wants: Meat</text>

  <!-- X mark between -->
  <line x1="250" y1="150" x2="280" y2="180" stroke="#B23B2E" stroke-width="4" stroke-linecap="round"/>
  <line x1="280" y1="150" x2="250" y2="180" stroke="#B23B2E" stroke-width="4" stroke-linecap="round"/>
  <text x="265" y="245" text-anchor="middle" font-size="13" font-style="italic" fill="#B23B2E">No match — trade fails</text>

  <!-- Butcher needed -->
  <rect x="175" y="270" width="180" height="90" rx="10" fill="#F5F5F5" stroke="#888888" stroke-width="1.5" stroke-dasharray="5,4"/>
  <text x="265" y="298" text-anchor="middle" font-size="14" font-weight="bold" fill="#555555">Butcher</text>
  <text x="265" y="320" text-anchor="middle" font-size="12" fill="#555555">Has: Meat</text>
  <text x="265" y="338" text-anchor="middle" font-size="12" fill="#555555">Wants: Vegetables</text>
  <text x="265" y="382" text-anchor="middle" font-size="12" font-style="italic" fill="#777777">A three-way trade might work — if you can find them all</text>

  <!-- Divider -->
  <line x1="500" y1="70" x2="500" y2="440" stroke="#DDDDDD" stroke-width="2"/>

  <!-- RIGHT: With money -->
  <text x="695" y="80" text-anchor="middle" font-size="17" font-weight="bold" fill="#1E7A4C">With Money</text>

  <rect x="540" y="110" width="150" height="100" rx="10" fill="#EFFAF3" stroke="#1E7A4C" stroke-width="2"/>
  <text x="615" y="140" text-anchor="middle" font-size="14" font-weight="bold" fill="#333333">Farmer</text>
  <text x="615" y="163" text-anchor="middle" font-size="12" fill="#333333">Sells vegetables</text>
  <text x="615" y="181" text-anchor="middle" font-size="12" fill="#333333">to anyone, for money</text>

  <rect x="720" y="110" width="150" height="100" rx="10" fill="#EFFAF3" stroke="#1E7A4C" stroke-width="2"/>
  <text x="795" y="140" text-anchor="middle" font-size="14" font-weight="bold" fill="#333333">Shoemaker</text>
  <text x="795" y="163" text-anchor="middle" font-size="12" fill="#333333">Accepts money,</text>
  <text x="795" y="181" text-anchor="middle" font-size="12" fill="#333333">buys meat separately</text>

  <!-- Arrow -->
  <line x1="695" y1="160" x2="715" y2="160" stroke="#1E7A4C" stroke-width="3" marker-end="url(#arrow)"/>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="6" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L6,3 z" fill="#1E7A4C"/>
    </marker>
  </defs>

  <!-- check -->
  <circle cx="700" cy="260" r="26" fill="#1E7A4C"/>
  <path d="M688,260 L697,270 L714,248" stroke="white" stroke-width="4" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="700" y="310" text-anchor="middle" font-size="13" font-weight="bold" fill="#1E7A4C">No matching wants needed</text>
  <text x="700" y="332" text-anchor="middle" font-size="12" fill="#555555">Money is accepted by everyone,</text>
  <text x="700" y="350" text-anchor="middle" font-size="12" fill="#555555">so each trade happens separately</text>

  <text x="450" y="455" text-anchor="middle" font-size="12" font-style="italic" fill="#888888">Money removes the need for both people to want exactly what the other has, at the same time.</text>
</svg>
