<svg viewBox="0 0 800 560" xmlns="http://www.w3.org/2000/svg" font-family="Arial, Helvetica, sans-serif">
  <rect width="800" height="560" fill="#FDFCF9"/>
  <text x="400" y="42" text-anchor="middle" font-size="24" font-weight="bold" fill="#1F3864">The Three Functions of Money</text>

  <!-- Center circle -->
  <circle cx="400" cy="280" r="70" fill="#2E5395"/>
  <text x="400" y="273" text-anchor="middle" font-size="18" font-weight="bold" fill="white">MONEY</text>
  <text x="400" y="295" text-anchor="middle" font-size="11" fill="#D9E1F2">must do all three</text>

  <!-- Lines to three nodes -->
  <line x1="400" y1="210" x2="400" y2="140" stroke="#B5C4E0" stroke-width="3"/>
  <line x1="345" y1="325" x2="185" y2="410" stroke="#B5C4E0" stroke-width="3"/>
  <line x1="455" y1="325" x2="615" y2="410" stroke="#B5C4E0" stroke-width="3"/>

  <!-- Top node: medium of exchange -->
  <rect x="250" y="60" width="300" height="90" rx="12" fill="#EAF0FB" stroke="#2E5395" stroke-width="2"/>
  <text x="400" y="88" text-anchor="middle" font-size="16" font-weight="bold" fill="#1F3864">Medium of Exchange</text>
  <text x="400" y="110" text-anchor="middle" font-size="12" fill="#333333">Widely accepted in trade for</text>
  <text x="400" y="128" text-anchor="middle" font-size="12" fill="#333333">goods and services</text>

  <!-- Bottom-left node: store of value -->
  <rect x="30" y="410" width="290" height="100" rx="12" fill="#EAF0FB" stroke="#2E5395" stroke-width="2"/>
  <text x="175" y="440" text-anchor="middle" font-size="16" font-weight="bold" fill="#1F3864">Store of Value</text>
  <text x="175" y="462" text-anchor="middle" font-size="12" fill="#333333">Holds its purchasing power,</text>
  <text x="175" y="480" text-anchor="middle" font-size="12" fill="#333333">so it can be saved and</text>
  <text x="175" y="498" text-anchor="middle" font-size="12" fill="#333333">used again later</text>

  <!-- Bottom-right node: unit of account -->
  <rect x="480" y="410" width="290" height="100" rx="12" fill="#EAF0FB" stroke="#2E5395" stroke-width="2"/>
  <text x="625" y="440" text-anchor="middle" font-size="16" font-weight="bold" fill="#1F3864">Unit of Account</text>
  <text x="625" y="462" text-anchor="middle" font-size="12" fill="#333333">A common measure for</text>
  <text x="625" y="480" text-anchor="middle" font-size="12" fill="#333333">comparing the value of very</text>
  <text x="625" y="498" text-anchor="middle" font-size="12" fill="#333333">different things</text>

  <text x="400" y="545" text-anchor="middle" font-size="12" font-style="italic" fill="#888888">If something fails at even one of these, it struggles to function as real money.</text>
</svg>
