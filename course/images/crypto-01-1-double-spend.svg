<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 560" font-family="Arial, Helvetica, sans-serif">
  <rect x="0" y="0" width="900" height="560" fill="#FDFCF9"/>
  <text x="450" y="36" text-anchor="middle" font-size="22" font-weight="bold" fill="#1F3864">The Double-Spend Problem vs a Shared Ledger</text>

  <!-- ===== LEFT PANEL: the problem ===== -->
  <rect x="30" y="60" width="410" height="470" rx="10" fill="#FFFFFF" stroke="#B23B2E" stroke-width="2"/>
  <text x="235" y="92" text-anchor="middle" font-size="17" font-weight="bold" fill="#B23B2E">Digital coin as a plain file</text>
  <text x="235" y="112" text-anchor="middle" font-size="13" fill="#1F3864">Files copy perfectly. So does the "coin".</text>

  <!-- Alice -->
  <circle cx="235" cy="170" r="30" fill="#2E5395"/>
  <text x="235" y="176" text-anchor="middle" font-size="14" font-weight="bold" fill="#FFFFFF">Alice</text>
  <!-- coin file at Alice -->
  <rect x="205" y="212" width="60" height="34" rx="6" fill="#C99A2E"/>
  <text x="235" y="233" text-anchor="middle" font-size="12" font-weight="bold" fill="#FFFFFF">coin.dat</text>

  <!-- arrow to Bob -->
  <line x1="200" y1="255" x2="125" y2="330" stroke="#1F3864" stroke-width="2.5"/>
  <polygon points="125,330 141,323 132,314" fill="#1F3864"/>
  <text x="120" y="290" text-anchor="middle" font-size="12" fill="#1F3864">sends file</text>

  <!-- arrow to Carol -->
  <line x1="270" y1="255" x2="345" y2="330" stroke="#B23B2E" stroke-width="2.5" stroke-dasharray="7,5"/>
  <polygon points="345,330 338,314 329,323" fill="#B23B2E"/>
  <text x="352" y="290" text-anchor="middle" font-size="12" fill="#B23B2E">sends a copy</text>

  <!-- Bob -->
  <circle cx="115" cy="365" r="28" fill="#1E7A4C"/>
  <text x="115" y="371" text-anchor="middle" font-size="14" font-weight="bold" fill="#FFFFFF">Bob</text>
  <rect x="85" y="404" width="60" height="30" rx="6" fill="#C99A2E"/>
  <text x="115" y="424" text-anchor="middle" font-size="12" font-weight="bold" fill="#FFFFFF">coin.dat</text>

  <!-- Carol -->
  <circle cx="355" cy="365" r="28" fill="#1E7A4C"/>
  <text x="355" y="371" text-anchor="middle" font-size="14" font-weight="bold" fill="#FFFFFF">Carol</text>
  <rect x="325" y="404" width="60" height="30" rx="6" fill="#C99A2E"/>
  <text x="355" y="424" text-anchor="middle" font-size="12" font-weight="bold" fill="#FFFFFF">coin.dat</text>

  <rect x="55" y="455" width="360" height="56" rx="8" fill="#B23B2E"/>
  <text x="235" y="479" text-anchor="middle" font-size="14" font-weight="bold" fill="#FFFFFF">Same coin spent twice.</text>
  <text x="235" y="499" text-anchor="middle" font-size="12" fill="#FFFFFF">Both payments look real. Money fails.</text>

  <!-- ===== RIGHT PANEL: the shared ledger ===== -->
  <rect x="460" y="60" width="410" height="470" rx="10" fill="#FFFFFF" stroke="#1E7A4C" stroke-width="2"/>
  <text x="665" y="92" text-anchor="middle" font-size="17" font-weight="bold" fill="#1E7A4C">One shared ledger, many copies</text>
  <text x="665" y="112" text-anchor="middle" font-size="13" fill="#1F3864">Every participant records the transaction.</text>

  <!-- central ledger -->
  <rect x="580" y="140" width="170" height="96" rx="8" fill="#1F3864"/>
  <text x="665" y="164" text-anchor="middle" font-size="13" font-weight="bold" fill="#FFFFFF">SHARED LEDGER</text>
  <line x1="596" y1="176" x2="734" y2="176" stroke="#FDFCF9" stroke-width="1"/>
  <text x="665" y="196" text-anchor="middle" font-size="12" fill="#FFFFFF">Alice pays Bob: 1 coin</text>
  <text x="665" y="218" text-anchor="middle" font-size="12" fill="#C99A2E">Coin marked as spent</text>

  <!-- network nodes each holding a copy -->
  <line x1="580" y1="240" x2="530" y2="300" stroke="#2E5395" stroke-width="2"/>
  <line x1="665" y1="240" x2="665" y2="300" stroke="#2E5395" stroke-width="2"/>
  <line x1="750" y1="240" x2="800" y2="300" stroke="#2E5395" stroke-width="2"/>

  <g>
    <rect x="495" y="302" width="70" height="46" rx="6" fill="#2E5395"/>
    <text x="530" y="321" text-anchor="middle" font-size="11" font-weight="bold" fill="#FFFFFF">Node 1</text>
    <text x="530" y="338" text-anchor="middle" font-size="10" fill="#FFFFFF">full copy</text>
  </g>
  <g>
    <rect x="630" y="302" width="70" height="46" rx="6" fill="#2E5395"/>
    <text x="665" y="321" text-anchor="middle" font-size="11" font-weight="bold" fill="#FFFFFF">Node 2</text>
    <text x="665" y="338" text-anchor="middle" font-size="10" fill="#FFFFFF">full copy</text>
  </g>
  <g>
    <rect x="765" y="302" width="70" height="46" rx="6" fill="#2E5395"/>
    <text x="800" y="321" text-anchor="middle" font-size="11" font-weight="bold" fill="#FFFFFF">Node 3</text>
    <text x="800" y="338" text-anchor="middle" font-size="10" fill="#FFFFFF">full copy</text>
  </g>

  <!-- attempted second spend -->
  <rect x="510" y="378" width="310" height="40" rx="8" fill="#FDFCF9" stroke="#B23B2E" stroke-width="2"/>
  <text x="665" y="403" text-anchor="middle" font-size="13" fill="#B23B2E">Alice tries: pay the same coin to Carol</text>

  <line x1="665" y1="418" x2="665" y2="448" stroke="#B23B2E" stroke-width="2.5"/>
  <polygon points="665,448 658,433 672,433" fill="#B23B2E"/>

  <rect x="510" y="452" width="310" height="60" rx="8" fill="#1E7A4C"/>
  <text x="665" y="477" text-anchor="middle" font-size="14" font-weight="bold" fill="#FFFFFF">REJECTED by every node</text>
  <text x="665" y="497" text-anchor="middle" font-size="12" fill="#FFFFFF">The ledger already shows that coin as spent.</text>

  <!-- footer -->
  <text x="450" y="550" text-anchor="middle" font-size="12" fill="#1F3864">Before Bitcoin, one trusted referee kept this ledger. Nakamoto (2008): let a peer-to-peer network keep it instead.</text>
</svg>
