<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 620" font-family="Arial, Helvetica, sans-serif">
  <rect x="0" y="0" width="900" height="620" fill="#FDFCF9"/>
  <text x="450" y="34" text-anchor="middle" font-size="22" font-weight="bold" fill="#1F3864">Chained Blocks: Why Editing Old History Shows</text>

  <!-- ===== TOP PANEL: healthy chain ===== -->
  <rect x="30" y="58" width="840" height="230" rx="10" fill="#FFFFFF" stroke="#1E7A4C" stroke-width="2"/>
  <text x="450" y="86" text-anchor="middle" font-size="16" font-weight="bold" fill="#1E7A4C">Healthy chain: each block stores the previous block's hash</text>

  <!-- Block 1 -->
  <rect x="60" y="104" width="200" height="150" rx="8" fill="#FFFFFF" stroke="#1F3864" stroke-width="2"/>
  <rect x="60" y="104" width="200" height="30" rx="8" fill="#1F3864"/>
  <text x="160" y="125" text-anchor="middle" font-size="14" font-weight="bold" fill="#FFFFFF">BLOCK 1</text>
  <text x="72" y="156" font-size="12" fill="#2E5395">Prev hash: (none)</text>
  <text x="72" y="178" font-size="12" fill="#1F3864">Txs: Ana pays Ben 2</text>
  <text x="72" y="200" font-size="12" fill="#1F3864">Nonce: 91772</text>
  <rect x="60" y="216" width="200" height="38" rx="6" fill="#C99A2E"/>
  <text x="160" y="240" text-anchor="middle" font-size="13" font-weight="bold" fill="#FFFFFF">Hash: 8f3c...</text>

  <!-- link 1 to 2 -->
  <line x1="260" y1="235" x2="310" y2="235" stroke="#1E7A4C" stroke-width="2.5"/>
  <line x1="310" y1="235" x2="310" y2="150" stroke="#1E7A4C" stroke-width="2.5"/>
  <line x1="310" y1="150" x2="332" y2="150" stroke="#1E7A4C" stroke-width="2.5"/>
  <polygon points="340,150 326,143 326,157" fill="#1E7A4C"/>

  <!-- Block 2 -->
  <rect x="340" y="104" width="200" height="150" rx="8" fill="#FFFFFF" stroke="#1F3864" stroke-width="2"/>
  <rect x="340" y="104" width="200" height="30" rx="8" fill="#1F3864"/>
  <text x="440" y="125" text-anchor="middle" font-size="14" font-weight="bold" fill="#FFFFFF">BLOCK 2</text>
  <text x="352" y="156" font-size="12" fill="#2E5395">Prev hash: 8f3c...</text>
  <text x="352" y="178" font-size="12" fill="#1F3864">Txs: Ben pays Cara 1</text>
  <text x="352" y="200" font-size="12" fill="#1F3864">Nonce: 40118</text>
  <rect x="340" y="216" width="200" height="38" rx="6" fill="#C99A2E"/>
  <text x="440" y="240" text-anchor="middle" font-size="13" font-weight="bold" fill="#FFFFFF">Hash: 2b71...</text>

  <!-- link 2 to 3 -->
  <line x1="540" y1="235" x2="590" y2="235" stroke="#1E7A4C" stroke-width="2.5"/>
  <line x1="590" y1="235" x2="590" y2="150" stroke="#1E7A4C" stroke-width="2.5"/>
  <line x1="590" y1="150" x2="612" y2="150" stroke="#1E7A4C" stroke-width="2.5"/>
  <polygon points="620,150 606,143 606,157" fill="#1E7A4C"/>

  <!-- Block 3 -->
  <rect x="620" y="104" width="200" height="150" rx="8" fill="#FFFFFF" stroke="#1F3864" stroke-width="2"/>
  <rect x="620" y="104" width="200" height="30" rx="8" fill="#1F3864"/>
  <text x="720" y="125" text-anchor="middle" font-size="14" font-weight="bold" fill="#FFFFFF">BLOCK 3</text>
  <text x="632" y="156" font-size="12" fill="#2E5395">Prev hash: 2b71...</text>
  <text x="632" y="178" font-size="12" fill="#1F3864">Txs: Cara pays Dan 3</text>
  <text x="632" y="200" font-size="12" fill="#1F3864">Nonce: 65530</text>
  <rect x="620" y="216" width="200" height="38" rx="6" fill="#C99A2E"/>
  <text x="720" y="240" text-anchor="middle" font-size="13" font-weight="bold" fill="#FFFFFF">Hash: 77aa...</text>

  <text x="450" y="276" text-anchor="middle" font-size="12" fill="#1F3864">Each hash is copied into the next block. Every link checks out. (Hashes shortened for display.)</text>

  <!-- ===== BOTTOM PANEL: tampered chain ===== -->
  <rect x="30" y="304" width="840" height="248" rx="10" fill="#FFFFFF" stroke="#B23B2E" stroke-width="2"/>
  <text x="450" y="332" text-anchor="middle" font-size="16" font-weight="bold" fill="#B23B2E">Tampered: one old transaction is edited in Block 2</text>

  <!-- Block 1 (unchanged) -->
  <rect x="60" y="350" width="200" height="150" rx="8" fill="#FFFFFF" stroke="#1F3864" stroke-width="2"/>
  <rect x="60" y="350" width="200" height="30" rx="8" fill="#1F3864"/>
  <text x="160" y="371" text-anchor="middle" font-size="14" font-weight="bold" fill="#FFFFFF">BLOCK 1</text>
  <text x="72" y="402" font-size="12" fill="#2E5395">Prev hash: (none)</text>
  <text x="72" y="424" font-size="12" fill="#1F3864">Txs: Ana pays Ben 2</text>
  <text x="72" y="446" font-size="12" fill="#1F3864">Nonce: 91772</text>
  <rect x="60" y="462" width="200" height="38" rx="6" fill="#C99A2E"/>
  <text x="160" y="486" text-anchor="middle" font-size="13" font-weight="bold" fill="#FFFFFF">Hash: 8f3c...</text>

  <!-- link 1 to 2 still fine -->
  <line x1="260" y1="481" x2="310" y2="481" stroke="#1E7A4C" stroke-width="2.5"/>
  <line x1="310" y1="481" x2="310" y2="396" stroke="#1E7A4C" stroke-width="2.5"/>
  <line x1="310" y1="396" x2="332" y2="396" stroke="#1E7A4C" stroke-width="2.5"/>
  <polygon points="340,396 326,389 326,403" fill="#1E7A4C"/>

  <!-- Block 2 (edited) -->
  <rect x="340" y="350" width="200" height="150" rx="8" fill="#FFFFFF" stroke="#B23B2E" stroke-width="3"/>
  <rect x="340" y="350" width="200" height="30" rx="8" fill="#B23B2E"/>
  <text x="440" y="371" text-anchor="middle" font-size="14" font-weight="bold" fill="#FFFFFF">BLOCK 2 (edited)</text>
  <text x="352" y="402" font-size="12" fill="#2E5395">Prev hash: 8f3c...</text>
  <text x="352" y="424" font-size="12" font-weight="bold" fill="#B23B2E">Txs: Ben pays Cara 900</text>
  <text x="352" y="446" font-size="12" fill="#1F3864">Nonce: 40118</text>
  <rect x="340" y="462" width="200" height="38" rx="6" fill="#B23B2E"/>
  <text x="440" y="486" text-anchor="middle" font-size="13" font-weight="bold" fill="#FFFFFF">New hash: e04d...</text>

  <!-- broken link 2 to 3 -->
  <line x1="540" y1="481" x2="590" y2="481" stroke="#B23B2E" stroke-width="2.5" stroke-dasharray="7,5"/>
  <line x1="590" y1="481" x2="590" y2="396" stroke="#B23B2E" stroke-width="2.5" stroke-dasharray="7,5"/>
  <line x1="590" y1="396" x2="612" y2="396" stroke="#B23B2E" stroke-width="2.5" stroke-dasharray="7,5"/>
  <line x1="596" y1="430" x2="620" y2="454" stroke="#B23B2E" stroke-width="4"/>
  <line x1="620" y1="430" x2="596" y2="454" stroke="#B23B2E" stroke-width="4"/>

  <!-- Block 3 (link now wrong) -->
  <rect x="620" y="350" width="200" height="150" rx="8" fill="#FFFFFF" stroke="#1F3864" stroke-width="2"/>
  <rect x="620" y="350" width="200" height="30" rx="8" fill="#1F3864"/>
  <text x="720" y="371" text-anchor="middle" font-size="14" font-weight="bold" fill="#FFFFFF">BLOCK 3</text>
  <text x="632" y="402" font-size="12" font-weight="bold" fill="#B23B2E">Prev hash: 2b71... ?!</text>
  <text x="632" y="424" font-size="12" fill="#1F3864">Txs: Cara pays Dan 3</text>
  <text x="632" y="446" font-size="12" fill="#1F3864">Nonce: 65530</text>
  <rect x="620" y="462" width="200" height="38" rx="6" fill="#C99A2E"/>
  <text x="720" y="486" text-anchor="middle" font-size="13" font-weight="bold" fill="#FFFFFF">Hash: 77aa...</text>

  <text x="450" y="524" text-anchor="middle" font-size="12" fill="#B23B2E">Block 2's hash changed (avalanche effect) -> Block 3's stored link no longer matches. Every node can see the break.</text>
  <text x="450" y="542" text-anchor="middle" font-size="12" fill="#1F3864">Hiding it means redoing the proof-of-work for Block 2 AND every block after it.</text>

  <!-- footer -->
  <text x="450" y="584" text-anchor="middle" font-size="13" font-weight="bold" fill="#1F3864">Meanwhile the honest chain keeps growing, about every 10 minutes. The attacker chases a moving target.</text>
  <text x="450" y="604" text-anchor="middle" font-size="12" fill="#1F3864">Nakamoto (2008): the chain forms "a record that cannot be changed without redoing the proof-of-work."</text>
</svg>
