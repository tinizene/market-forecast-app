<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 600" font-family="Arial, Helvetica, sans-serif">
  <rect x="0" y="0" width="900" height="600" fill="#FDFCF9"/>

  <text x="450" y="34" font-size="20" font-weight="bold" fill="#1F3864" text-anchor="middle">Two Ways to Make the Next Block Expensive</text>
  <text x="450" y="56" font-size="13" fill="#2E5395" text-anchor="middle">Consensus: who gets to write history, and what it costs them</text>

  <!-- Panel frames -->
  <rect x="30" y="80" width="410" height="420" rx="10" fill="none" stroke="#1F3864" stroke-width="1.5"/>
  <rect x="460" y="80" width="410" height="420" rx="10" fill="none" stroke="#1F3864" stroke-width="1.5"/>

  <text x="235" y="108" font-size="16" font-weight="bold" fill="#1F3864" text-anchor="middle">PROOF OF WORK</text>
  <text x="235" y="126" font-size="12" fill="#B23B2E" text-anchor="middle">pays with electricity</text>
  <text x="665" y="108" font-size="16" font-weight="bold" fill="#1F3864" text-anchor="middle">PROOF OF STAKE</text>
  <text x="665" y="126" font-size="12" fill="#B23B2E" text-anchor="middle">pays with locked capital</text>

  <!-- PoW: input box -->
  <rect x="70" y="145" width="330" height="58" rx="8" fill="#C99A2E" fill-opacity="0.15" stroke="#C99A2E" stroke-width="1.5"/>
  <text x="235" y="169" font-size="13" font-weight="bold" fill="#1F3864" text-anchor="middle">HARDWARE + ELECTRICITY</text>
  <text x="235" y="188" font-size="11.5" fill="#1F3864" text-anchor="middle">miners burn real resources on hash guesses</text>

  <!-- arrow down -->
  <line x1="235" y1="203" x2="235" y2="233" stroke="#2E5395" stroke-width="2"/>
  <polygon points="235,241 229,229 241,229" fill="#2E5395"/>

  <!-- PoW: race box -->
  <rect x="70" y="243" width="330" height="72" rx="8" fill="#2E5395" fill-opacity="0.10" stroke="#2E5395" stroke-width="1.5"/>
  <text x="235" y="266" font-size="13" font-weight="bold" fill="#1F3864" text-anchor="middle">THE NONCE RACE</text>
  <text x="235" y="284" font-size="11.5" fill="#1F3864" text-anchor="middle">every hash is a lottery ticket; first valid</text>
  <text x="235" y="300" font-size="11.5" fill="#1F3864" text-anchor="middle">nonce wins the right to propose the block</text>

  <line x1="235" y1="315" x2="235" y2="345" stroke="#2E5395" stroke-width="2"/>
  <polygon points="235,353 229,341 241,341" fill="#2E5395"/>

  <!-- PoW: block -->
  <rect x="100" y="355" width="270" height="52" rx="8" fill="#1F3864"/>
  <text x="235" y="377" font-size="13" font-weight="bold" fill="#FDFCF9" text-anchor="middle">NEW BLOCK</text>
  <text x="235" y="395" font-size="11.5" fill="#FDFCF9" text-anchor="middle">winner earns subsidy + fees</text>

  <!-- PoW: reward note -->
  <rect x="70" y="425" width="330" height="55" rx="8" fill="#1E7A4C" fill-opacity="0.12" stroke="#1E7A4C" stroke-width="1.5"/>
  <text x="235" y="447" font-size="11.5" fill="#1E7A4C" font-weight="bold" text-anchor="middle">SELF-REGULATING: difficulty retunes every</text>
  <text x="235" y="464" font-size="11.5" fill="#1E7A4C" text-anchor="middle">2,016 blocks to hold the target block pace</text>

  <!-- PoS: input box -->
  <rect x="500" y="145" width="330" height="58" rx="8" fill="#2E5395" fill-opacity="0.15" stroke="#2E5395" stroke-width="1.5"/>
  <text x="665" y="169" font-size="13" font-weight="bold" fill="#1F3864" text-anchor="middle">STAKED CAPITAL</text>
  <text x="665" y="188" font-size="11.5" fill="#1F3864" text-anchor="middle">validators lock tokens as a bond (32 ETH each)</text>

  <line x1="665" y1="203" x2="665" y2="233" stroke="#2E5395" stroke-width="2"/>
  <polygon points="665,241 659,229 671,229" fill="#2E5395"/>

  <!-- PoS: selection box -->
  <rect x="500" y="243" width="330" height="72" rx="8" fill="#2E5395" fill-opacity="0.10" stroke="#2E5395" stroke-width="1.5"/>
  <text x="665" y="266" font-size="13" font-weight="bold" fill="#1F3864" text-anchor="middle">SELECTION, NOT RACE</text>
  <text x="665" y="284" font-size="11.5" fill="#1F3864" text-anchor="middle">protocol picks one validator to propose;</text>
  <text x="665" y="300" font-size="11.5" fill="#1F3864" text-anchor="middle">committees of others attest to the block</text>

  <line x1="665" y1="315" x2="665" y2="345" stroke="#2E5395" stroke-width="2"/>
  <polygon points="665,353 659,341 671,341" fill="#2E5395"/>

  <!-- PoS: block -->
  <rect x="530" y="355" width="270" height="52" rx="8" fill="#1F3864"/>
  <text x="665" y="377" font-size="13" font-weight="bold" fill="#FDFCF9" text-anchor="middle">NEW BLOCK</text>
  <text x="665" y="395" font-size="11.5" fill="#FDFCF9" text-anchor="middle">honest work earns staking rewards</text>

  <!-- PoS: slashing note -->
  <rect x="500" y="425" width="330" height="55" rx="8" fill="#B23B2E" fill-opacity="0.12" stroke="#B23B2E" stroke-width="1.5"/>
  <text x="665" y="447" font-size="11.5" fill="#B23B2E" font-weight="bold" text-anchor="middle">SLASHING RISK: sign two conflicting blocks or</text>
  <text x="665" y="464" font-size="11.5" fill="#B23B2E" text-anchor="middle">votes and the protocol destroys part of your stake</text>

  <!-- Bottom shared bar -->
  <rect x="30" y="520" width="840" height="58" rx="10" fill="#C99A2E" fill-opacity="0.15" stroke="#C99A2E" stroke-width="1.5"/>
  <text x="450" y="544" font-size="13" font-weight="bold" fill="#1F3864" text-anchor="middle">SAME ASSUMPTION ON BOTH SIDES</text>
  <text x="450" y="563" font-size="12" fill="#1F3864" text-anchor="middle">Attack cost = a majority of the deciding resource: hashpower (PoW) or stake (PoS). Neither side escapes the 51% question.</text>
</svg>
