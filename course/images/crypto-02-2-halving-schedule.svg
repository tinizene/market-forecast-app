<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 600" width="900" height="600" role="img" aria-label="Bitcoin block subsidy step-down schedule across four halvings">
  <rect x="0" y="0" width="900" height="600" fill="#FDFCF9"/>

  <text x="450" y="36" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="21" font-weight="bold" fill="#1F3864">Bitcoin Block Subsidy: A Schedule Known In Advance</text>
  <text x="450" y="60" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="13" fill="#4A5568">New coins per block, and the resulting daily issuance, after each halving</text>

  <rect x="60" y="76" width="780" height="34" rx="5" fill="#EAF3EE" stroke="#1E7A4C" stroke-width="1.5"/>
  <text x="450" y="98" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="13" fill="#1E7A4C">KNOWN IN ADVANCE: every step below was fixed in Bitcoin's software rules in 2009. No step was a surprise.</text>

  <line x1="230" y1="170" x2="230" y2="452" stroke="#B23B2E" stroke-width="1.2" stroke-dasharray="5,4"/>
  <line x1="370" y1="170" x2="370" y2="452" stroke="#B23B2E" stroke-width="1.2" stroke-dasharray="5,4"/>
  <line x1="510" y1="170" x2="510" y2="452" stroke="#B23B2E" stroke-width="1.2" stroke-dasharray="5,4"/>
  <line x1="650" y1="170" x2="650" y2="452" stroke="#B23B2E" stroke-width="1.2" stroke-dasharray="5,4"/>

  <circle cx="230" cy="170" r="4" fill="#B23B2E"/>
  <circle cx="370" cy="170" r="4" fill="#B23B2E"/>
  <circle cx="510" cy="170" r="4" fill="#B23B2E"/>
  <circle cx="650" cy="170" r="4" fill="#B23B2E"/>

  <text x="230" y="144" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="11" font-weight="bold" fill="#B23B2E">Halving 1</text>
  <text x="230" y="158" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="11" fill="#B23B2E">Nov 2012</text>
  <text x="370" y="144" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="11" font-weight="bold" fill="#B23B2E">Halving 2</text>
  <text x="370" y="158" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="11" fill="#B23B2E">Jul 2016</text>
  <text x="510" y="144" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="11" font-weight="bold" fill="#B23B2E">Halving 3</text>
  <text x="510" y="158" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="11" fill="#B23B2E">May 2020</text>
  <text x="650" y="144" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="11" font-weight="bold" fill="#B23B2E">Halving 4</text>
  <text x="650" y="158" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="11" fill="#B23B2E">Apr 2024</text>

  <rect x="92" y="200" width="136" height="240" fill="#2E5395"/>
  <rect x="232" y="320" width="136" height="120" fill="#2E5395"/>
  <rect x="372" y="380" width="136" height="60" fill="#2E5395"/>
  <rect x="512" y="410" width="136" height="30" fill="#2E5395"/>
  <rect x="652" y="425" width="136" height="15" fill="#1E7A4C"/>

  <text x="160" y="222" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="15" font-weight="bold" fill="#FDFCF9">50 BTC / block</text>
  <text x="160" y="242" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#FDFCF9">about 7,200 / day</text>

  <text x="300" y="342" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="15" font-weight="bold" fill="#FDFCF9">25 BTC / block</text>
  <text x="300" y="362" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#FDFCF9">about 3,600 / day</text>

  <text x="440" y="402" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="14" font-weight="bold" fill="#FDFCF9">12.5 BTC / block</text>
  <text x="440" y="422" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="11" fill="#FDFCF9">about 1,800 / day</text>

  <text x="580" y="398" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="14" font-weight="bold" fill="#1F3864">6.25 BTC / block</text>
  <text x="580" y="431" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="11" fill="#FDFCF9">about 900 / day</text>

  <text x="720" y="398" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="14" font-weight="bold" fill="#1E7A4C">3.125 BTC / block</text>
  <text x="720" y="414" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="11" fill="#1E7A4C">about 450 / day (now)</text>

  <line x1="80" y1="440" x2="810" y2="440" stroke="#1F3864" stroke-width="2"/>

  <text x="160" y="458" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="11" fill="#4A5568">2009 to 2012</text>
  <text x="300" y="458" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="11" fill="#4A5568">2012 to 2016</text>
  <text x="440" y="458" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="11" fill="#4A5568">2016 to 2020</text>
  <text x="580" y="458" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="11" fill="#4A5568">2020 to 2024</text>
  <text x="720" y="458" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="11" fill="#4A5568">2024 to 2028</text>

  <rect x="60" y="482" width="380" height="66" rx="5" fill="#F7E9E6" stroke="#B23B2E" stroke-width="1.5"/>
  <text x="76" y="503" font-family="Helvetica, Arial, sans-serif" font-size="13" font-weight="bold" fill="#B23B2E">n = 4 events</text>
  <text x="76" y="521" font-family="Helvetica, Arial, sans-serif" font-size="11.5" fill="#B23B2E">Four halvings have ever happened. That is three complete</text>
  <text x="76" y="537" font-family="Helvetica, Arial, sans-serif" font-size="11.5" fill="#B23B2E">cycles at most, and a fourth still running. Not a sample.</text>

  <rect x="460" y="482" width="380" height="66" rx="5" fill="#FBF3DF" stroke="#C99A2E" stroke-width="1.5"/>
  <text x="476" y="503" font-family="Helvetica, Arial, sans-serif" font-size="13" font-weight="bold" fill="#8A6A16">Not actually four years</text>
  <text x="476" y="521" font-family="Helvetica, Arial, sans-serif" font-size="11.5" fill="#8A6A16">Gaps between halvings: 3.61, 3.84 and 3.94 years. The</text>
  <text x="476" y="537" font-family="Helvetica, Arial, sans-serif" font-size="11.5" fill="#8A6A16">schedule counts blocks, not calendar days.</text>

  <text x="450" y="576" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#1F3864">The supply schedule is certain. What price does in response is not.</text>
</svg>
