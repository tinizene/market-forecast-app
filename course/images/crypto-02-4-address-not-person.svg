<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 600" font-family="Arial, Helvetica, sans-serif">
  <rect x="0" y="0" width="900" height="600" fill="#FDFCF9"/>

  <text x="450" y="34" text-anchor="middle" font-size="22" font-weight="bold" fill="#1F3864">An Address Is Not a Person</text>
  <text x="450" y="58" text-anchor="middle" font-size="13" fill="#1F3864">Two counting errors, running in opposite directions, in every address-based metric</text>

  <!-- ===== LEFT PANEL: one user, many addresses ===== -->
  <rect x="25" y="78" width="410" height="420" rx="10" fill="#FFFFFF" stroke="#2E5395" stroke-width="2"/>
  <text x="230" y="106" text-anchor="middle" font-size="17" font-weight="bold" fill="#2E5395">One user, many addresses</text>
  <text x="230" y="126" text-anchor="middle" font-size="12" fill="#1F3864">Wallet software makes a fresh address for every</text>
  <text x="230" y="142" text-anchor="middle" font-size="12" fill="#1F3864">payment received and every bit of change returned.</text>

  <circle cx="112" cy="265" r="34" fill="#2E5395"/>
  <text x="112" y="262" text-anchor="middle" font-size="13" font-weight="bold" fill="#FFFFFF">1 REAL</text>
  <text x="112" y="278" text-anchor="middle" font-size="13" font-weight="bold" fill="#FFFFFF">PERSON</text>

  <line x1="150" y1="265" x2="248" y2="174" stroke="#2E5395" stroke-width="2"/>
  <line x1="150" y1="265" x2="248" y2="210" stroke="#2E5395" stroke-width="2"/>
  <line x1="150" y1="265" x2="248" y2="246" stroke="#2E5395" stroke-width="2"/>
  <line x1="150" y1="265" x2="248" y2="282" stroke="#2E5395" stroke-width="2"/>
  <line x1="150" y1="265" x2="248" y2="318" stroke="#2E5395" stroke-width="2"/>
  <line x1="150" y1="265" x2="248" y2="354" stroke="#2E5395" stroke-width="2"/>

  <rect x="250" y="160" width="150" height="28" rx="6" fill="#FFFFFF" stroke="#1F3864" stroke-width="1.5"/>
  <text x="325" y="179" text-anchor="middle" font-size="12" fill="#1F3864">address 1</text>
  <rect x="250" y="196" width="150" height="28" rx="6" fill="#FFFFFF" stroke="#1F3864" stroke-width="1.5"/>
  <text x="325" y="215" text-anchor="middle" font-size="12" fill="#1F3864">address 2</text>
  <rect x="250" y="232" width="150" height="28" rx="6" fill="#FFFFFF" stroke="#1F3864" stroke-width="1.5"/>
  <text x="325" y="251" text-anchor="middle" font-size="12" fill="#1F3864">address 3</text>
  <rect x="250" y="268" width="150" height="28" rx="6" fill="#FFFFFF" stroke="#1F3864" stroke-width="1.5"/>
  <text x="325" y="287" text-anchor="middle" font-size="12" fill="#1F3864">address 4</text>
  <rect x="250" y="304" width="150" height="28" rx="6" fill="#FFFFFF" stroke="#1F3864" stroke-width="1.5"/>
  <text x="325" y="323" text-anchor="middle" font-size="12" fill="#1F3864">change address</text>
  <rect x="250" y="340" width="150" height="28" rx="6" fill="#FFFFFF" stroke="#1F3864" stroke-width="1.5"/>
  <text x="325" y="359" text-anchor="middle" font-size="12" fill="#1F3864">change address</text>

  <text x="230" y="392" text-anchor="middle" font-size="12" fill="#C99A2E">Internal and change transfers move no money</text>
  <text x="230" y="408" text-anchor="middle" font-size="12" fill="#C99A2E">between people, but still add to the count.</text>

  <rect x="45" y="420" width="370" height="60" rx="8" fill="#2E5395"/>
  <text x="230" y="444" text-anchor="middle" font-size="14" font-weight="bold" fill="#FFFFFF">Metric says: 6 active addresses</text>
  <text x="230" y="466" text-anchor="middle" font-size="14" font-weight="bold" fill="#FFFFFF">Reality: 1 user. Count is too high.</text>

  <!-- ===== RIGHT PANEL: one address, many users ===== -->
  <rect x="465" y="78" width="410" height="420" rx="10" fill="#FFFFFF" stroke="#1E7A4C" stroke-width="2"/>
  <text x="670" y="106" text-anchor="middle" font-size="17" font-weight="bold" fill="#1E7A4C">One address, many users</text>
  <text x="670" y="126" text-anchor="middle" font-size="12" fill="#1F3864">A centralized exchange holds all customer coins in</text>
  <text x="670" y="142" text-anchor="middle" font-size="12" fill="#1F3864">wallets it controls. Customer trades are database rows.</text>

  <circle cx="528" cy="176" r="16" fill="#1E7A4C"/>
  <circle cx="528" cy="220" r="16" fill="#1E7A4C"/>
  <circle cx="528" cy="264" r="16" fill="#1E7A4C"/>
  <circle cx="528" cy="308" r="16" fill="#1E7A4C"/>
  <circle cx="528" cy="352" r="16" fill="#1E7A4C"/>
  <text x="528" y="386" text-anchor="middle" font-size="12" fill="#1F3864">plus millions</text>
  <text x="528" y="402" text-anchor="middle" font-size="12" fill="#1F3864">more customers</text>

  <line x1="546" y1="176" x2="712" y2="255" stroke="#1E7A4C" stroke-width="2"/>
  <line x1="546" y1="220" x2="712" y2="262" stroke="#1E7A4C" stroke-width="2"/>
  <line x1="546" y1="264" x2="712" y2="268" stroke="#1E7A4C" stroke-width="2"/>
  <line x1="546" y1="308" x2="712" y2="275" stroke="#1E7A4C" stroke-width="2"/>
  <line x1="546" y1="352" x2="712" y2="282" stroke="#1E7A4C" stroke-width="2"/>

  <rect x="714" y="232" width="146" height="72" rx="8" fill="#1E7A4C"/>
  <text x="787" y="258" text-anchor="middle" font-size="13" font-weight="bold" fill="#FFFFFF">EXCHANGE</text>
  <text x="787" y="277" text-anchor="middle" font-size="12" fill="#FFFFFF">1 pooled address</text>
  <text x="787" y="294" text-anchor="middle" font-size="12" fill="#FFFFFF">holds every balance</text>

  <text x="700" y="340" text-anchor="middle" font-size="12" fill="#C99A2E">Trades between customers never reach the chain,</text>
  <text x="700" y="356" text-anchor="middle" font-size="12" fill="#C99A2E">so they are counted zero times.</text>

  <rect x="485" y="420" width="370" height="60" rx="8" fill="#1E7A4C"/>
  <text x="670" y="444" text-anchor="middle" font-size="14" font-weight="bold" fill="#FFFFFF">Metric says: 1 active address</text>
  <text x="670" y="466" text-anchor="middle" font-size="14" font-weight="bold" fill="#FFFFFF">Reality: millions. Count is too low.</text>

  <!-- ===== BOTTOM BAND ===== -->
  <rect x="25" y="514" width="850" height="64" rx="8" fill="#B23B2E"/>
  <text x="450" y="540" text-anchor="middle" font-size="14" font-weight="bold" fill="#FFFFFF">Both errors occur at the same time, in opposite directions, and neither can be measured.</text>
  <text x="450" y="562" text-anchor="middle" font-size="14" fill="#FFFFFF">So a count of active addresses is a count of addresses. It is not a count of people.</text>
</svg>
