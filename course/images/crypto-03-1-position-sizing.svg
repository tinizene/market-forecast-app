<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 600" font-family="Arial, Helvetica, sans-serif">
  <rect x="0" y="0" width="900" height="600" fill="#FDFCF9"/>

  <text x="450" y="34" text-anchor="middle" font-size="22" font-weight="bold" fill="#1F3864">One Risk Budget, Three Stop Distances</text>
  <text x="450" y="56" text-anchor="middle" font-size="13" fill="#2E5395">The formula never changes. Only the denominator does.</text>

  <!-- ===== RISK BUDGET BANNER ===== -->
  <rect x="120" y="72" width="660" height="56" rx="8" fill="#1F3864"/>
  <text x="450" y="96" text-anchor="middle" font-size="16" font-weight="bold" fill="#FFFFFF">Account $5,000 -&gt; risk 1% -&gt; $50 at risk</text>
  <text x="450" y="117" text-anchor="middle" font-size="12" fill="#FFFFFF">The same $50 in all three rows below. It never moves.</text>

  <line x1="450" y1="128" x2="450" y2="146" stroke="#1F3864" stroke-width="2.5"/>
  <polygon points="450,154 443,138 457,138" fill="#1F3864"/>

  <rect x="220" y="158" width="460" height="34" rx="6" fill="#FFFFFF" stroke="#2E5395" stroke-width="2"/>
  <text x="450" y="180" text-anchor="middle" font-size="14" font-weight="bold" fill="#2E5395">Position size = $50 at risk / stop distance</text>

  <!-- column headers -->
  <text x="24" y="222" font-size="12" font-weight="bold" fill="#2E5395">Trade</text>
  <text x="250" y="222" font-size="12" font-weight="bold" fill="#2E5395">Stop distance, as a percent of price</text>
  <text x="700" y="222" font-size="12" font-weight="bold" fill="#2E5395">Position you can hold</text>

  <line x1="24" y1="230" x2="876" y2="230" stroke="#2E5395" stroke-width="1"/>

  <!-- ===== ROW 1: EUR/USD ===== -->
  <text x="24" y="256" font-size="14" font-weight="bold" fill="#1F3864">EUR/USD</text>
  <text x="24" y="274" font-size="11" fill="#1F3864">50-pip stop at 1.0800</text>
  <text x="24" y="290" font-size="11" fill="#1F3864">about 1.0 daily moves</text>

  <rect x="250" y="248" width="28" height="26" fill="#2E5395"/>
  <text x="286" y="266" font-size="12" fill="#1F3864">0.46% of price</text>

  <rect x="640" y="244" width="170" height="34" rx="5" fill="#2E5395"/>
  <text x="725" y="266" text-anchor="middle" font-size="14" font-weight="bold" fill="#FFFFFF">$10,800</text>
  <text x="725" y="292" text-anchor="middle" font-size="11" fill="#1F3864">0.10 standard lots</text>

  <line x1="24" y1="308" x2="876" y2="308" stroke="#2E5395" stroke-width="0.7"/>

  <!-- ===== ROW 2: BTC 2 x ATR ===== -->
  <text x="24" y="336" font-size="14" font-weight="bold" fill="#1E7A4C">Bitcoin at $60,000</text>
  <text x="24" y="354" font-size="11" fill="#1F3864">stop = 2 x ATR = $3,800</text>
  <text x="24" y="370" font-size="11" fill="#1F3864">about 2.6 daily moves</text>

  <rect x="250" y="328" width="380" height="26" fill="#1E7A4C"/>
  <text x="440" y="346" text-anchor="middle" font-size="12" font-weight="bold" fill="#FFFFFF">6.33% of price</text>

  <rect x="640" y="324" width="12" height="34" rx="3" fill="#1E7A4C"/>
  <text x="725" y="346" text-anchor="middle" font-size="14" font-weight="bold" fill="#1E7A4C">$789</text>
  <text x="725" y="372" text-anchor="middle" font-size="11" fill="#1F3864">0.01316 BTC</text>

  <line x1="24" y1="388" x2="876" y2="388" stroke="#2E5395" stroke-width="0.7"/>

  <!-- ===== ROW 3: the error ===== -->
  <text x="24" y="416" font-size="14" font-weight="bold" fill="#B23B2E">Bitcoin, forex-sized stop</text>
  <text x="24" y="434" font-size="11" fill="#1F3864">stop = $278, the classic error</text>
  <text x="24" y="450" font-size="11" fill="#1F3864">about 0.19 daily moves</text>

  <rect x="250" y="408" width="28" height="26" fill="#B23B2E"/>
  <text x="286" y="426" font-size="12" fill="#1F3864">0.46% of price</text>

  <rect x="640" y="404" width="170" height="34" rx="5" fill="#B23B2E"/>
  <text x="725" y="426" text-anchor="middle" font-size="14" font-weight="bold" fill="#FFFFFF">$10,800</text>
  <text x="725" y="452" text-anchor="middle" font-size="11" fill="#B23B2E">stopped out by noise</text>

  <line x1="24" y1="468" x2="876" y2="468" stroke="#2E5395" stroke-width="1"/>

  <!-- ===== FOOTER NOTES ===== -->
  <rect x="24" y="482" width="414" height="98" rx="8" fill="#FFFFFF" stroke="#1E7A4C" stroke-width="2"/>
  <text x="231" y="504" text-anchor="middle" font-size="13" font-weight="bold" fill="#1E7A4C">The arithmetic</text>
  <text x="38" y="526" font-size="11.5" fill="#1F3864">Stop 13.7x wider -&gt; position 13.7x smaller.</text>
  <text x="38" y="544" font-size="11.5" fill="#1F3864">6.33 / 0.46 = 13.7, and 10,800 / 789 = 13.7.</text>
  <text x="38" y="562" font-size="11.5" fill="#1F3864">Same $50 lost if either stop is hit.</text>

  <rect x="462" y="482" width="414" height="98" rx="8" fill="#FFFFFF" stroke="#B23B2E" stroke-width="2"/>
  <text x="669" y="504" text-anchor="middle" font-size="13" font-weight="bold" fill="#B23B2E">Why row 3 fails</text>
  <text x="476" y="526" font-size="11.5" fill="#1F3864">$278 is one-seventh of one day's ATR ($1,900).</text>
  <text x="476" y="544" font-size="11.5" fill="#1F3864">The smallest of the five daily true ranges was</text>
  <text x="476" y="562" font-size="11.5" fill="#1F3864">$1,700 - about 6.1 times the stop distance.</text>
</svg>
