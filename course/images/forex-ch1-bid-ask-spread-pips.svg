<svg viewBox="0 0 900 520" xmlns="http://www.w3.org/2000/svg" font-family="Arial, Helvetica, sans-serif">
  <rect width="900" height="520" fill="#FDFCF9"/>
  <text x="450" y="38" text-anchor="middle" font-size="22" font-weight="bold" fill="#1F3864">Bid, Ask &amp; the Spread</text>

  <!-- Bid/Ask visual -->
  <text x="450" y="70" text-anchor="middle" font-size="14" fill="#333333">EUR/USD quote right now:</text>

  <rect x="150" y="85" width="230" height="80" rx="10" fill="#FFF3EF" stroke="#B23B2E" stroke-width="2"/>
  <text x="265" y="112" text-anchor="middle" font-size="13" font-weight="bold" fill="#B23B2E">BID: 1.08500</text>
  <text x="265" y="132" text-anchor="middle" font-size="11" fill="#333333">What the market will</text>
  <text x="265" y="148" text-anchor="middle" font-size="11" fill="#333333">pay you to sell</text>

  <rect x="520" y="85" width="230" height="80" rx="10" fill="#EFFAF3" stroke="#1E7A4C" stroke-width="2"/>
  <text x="635" y="112" text-anchor="middle" font-size="13" font-weight="bold" fill="#1E7A4C">ASK: 1.08510</text>
  <text x="635" y="132" text-anchor="middle" font-size="11" fill="#333333">What the market charges</text>
  <text x="635" y="148" text-anchor="middle" font-size="11" fill="#333333">you to buy</text>

  <rect x="380" y="180" width="140" height="50" rx="8" fill="#FFF7E6" stroke="#C99A2E" stroke-width="2"/>
  <text x="450" y="203" text-anchor="middle" font-size="12" font-weight="bold" fill="#8A6D1F">Spread = 1 pip</text>
  <text x="450" y="219" text-anchor="middle" font-size="10" fill="#8A6D1F">= $10 per standard lot</text>

  <!-- Pip position illustration -->
  <text x="450" y="270" text-anchor="middle" font-size="15" font-weight="bold" fill="#1F3864">Where the Pip Sits</text>

  <rect x="80" y="285" width="330" height="95" rx="10" fill="#EAF0FB" stroke="#2E5395" stroke-width="1.5"/>
  <text x="245" y="308" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#2E5395">Most Pairs (EUR/USD, GBP/USD...)</text>
  <text x="245" y="335" text-anchor="middle" font-size="18" font-family="monospace" fill="#333333">1.0850<tspan fill="#B23B2E" font-weight="bold">0</tspan></text>
  <text x="245" y="358" text-anchor="middle" font-size="11" fill="#555555">Pip = 4th decimal place (0.0001)</text>

  <rect x="490" y="285" width="330" height="95" rx="10" fill="#FFF3EF" stroke="#B23B2E" stroke-width="1.5"/>
  <text x="655" y="308" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#B23B2E">Yen Pairs (USD/JPY, EUR/JPY...)</text>
  <text x="655" y="335" text-anchor="middle" font-size="18" font-family="monospace" fill="#333333">149.<tspan fill="#B23B2E" font-weight="bold">5</tspan>0</text>
  <text x="655" y="358" text-anchor="middle" font-size="11" fill="#555555">Pip = 2nd decimal place (0.01)</text>

  <!-- Why it exists -->
  <rect x="80" y="400" width="740" height="100" rx="10" fill="#F5F5F5" stroke="#888888" stroke-width="1.2" stroke-dasharray="5,4"/>
  <text x="450" y="425" text-anchor="middle" font-size="13.5" font-weight="bold" fill="#1F3864">Why Does the Spread Exist?</text>
  <text x="450" y="448" text-anchor="middle" font-size="11.5" fill="#333333">Glosten &amp; Milgrom (1985) — a landmark market microstructure paper — showed a positive spread</text>
  <text x="450" y="466" text-anchor="middle" font-size="11.5" fill="#333333">emerges even when the market maker takes zero average profit: it's protection against traders</text>
  <text x="450" y="484" text-anchor="middle" font-size="11.5" fill="#333333">who know more than they do. Not just a fee — a real, mathematically-grounded cost of uncertainty.</text>
</svg>
