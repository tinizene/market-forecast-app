<svg viewBox="0 0 900 560" xmlns="http://www.w3.org/2000/svg" font-family="Arial, Helvetica, sans-serif">
  <rect width="900" height="560" fill="#FDFCF9"/>
  <text x="450" y="38" text-anchor="middle" font-size="22" font-weight="bold" fill="#1F3864">Major, Minor &amp; Exotic Currency Pairs</text>

  <!-- Major -->
  <rect x="40" y="65" width="260" height="150" rx="12" fill="#EAF0FB" stroke="#2E5395" stroke-width="2"/>
  <text x="170" y="92" text-anchor="middle" font-size="16" font-weight="bold" fill="#2E5395">Major Pairs</text>
  <text x="170" y="114" text-anchor="middle" font-size="11.5" fill="#333333">USD + another major currency</text>
  <text x="170" y="134" text-anchor="middle" font-size="11" fill="#333333">EUR/USD · USD/JPY · GBP/USD</text>
  <text x="170" y="152" text-anchor="middle" font-size="11" fill="#333333">USD/CAD · AUD/USD · USD/CHF</text>
  <text x="170" y="180" text-anchor="middle" font-size="11" font-style="italic" fill="#555555">Highest liquidity,</text>
  <text x="170" y="197" text-anchor="middle" font-size="11" font-style="italic" fill="#555555">tightest spreads</text>

  <!-- Minor / Cross -->
  <rect x="320" y="65" width="260" height="150" rx="12" fill="#EFFAF3" stroke="#1E7A4C" stroke-width="2"/>
  <text x="450" y="92" text-anchor="middle" font-size="16" font-weight="bold" fill="#1E7A4C">Minor Pairs (Cross Pairs)</text>
  <text x="450" y="114" text-anchor="middle" font-size="11.5" fill="#333333">Two major currencies, no USD</text>
  <text x="450" y="134" text-anchor="middle" font-size="11" fill="#333333">EUR/GBP · GBP/JPY · CAD/JPY</text>
  <text x="450" y="152" text-anchor="middle" font-size="11" fill="#333333">EUR/JPY</text>
  <text x="450" y="180" text-anchor="middle" font-size="11" font-style="italic" fill="#555555">Moderate liquidity,</text>
  <text x="450" y="197" text-anchor="middle" font-size="11" font-style="italic" fill="#555555">wider spreads than majors</text>

  <!-- Exotic -->
  <rect x="600" y="65" width="260" height="150" rx="12" fill="#FFF3EF" stroke="#B23B2E" stroke-width="2"/>
  <text x="730" y="92" text-anchor="middle" font-size="16" font-weight="bold" fill="#B23B2E">Exotic Pairs</text>
  <text x="730" y="114" text-anchor="middle" font-size="11.5" fill="#333333">A major + emerging-market currency</text>
  <text x="730" y="134" text-anchor="middle" font-size="11" fill="#333333">USD/MXN · USD/TRY · USD/ZAR</text>
  <text x="730" y="152" text-anchor="middle" font-size="11" fill="#333333">USD/PLN</text>
  <text x="730" y="180" text-anchor="middle" font-size="11" font-style="italic" fill="#555555">Lowest liquidity,</text>
  <text x="730" y="197" text-anchor="middle" font-size="11" font-style="italic" fill="#555555">widest spreads, most volatile</text>

  <!-- Ranking table -->
  <text x="450" y="255" text-anchor="middle" font-size="16" font-weight="bold" fill="#1F3864">Actual Ranking — 2025 BIS Triennial Survey</text>
  <text x="450" y="275" text-anchor="middle" font-size="11.5" font-style="italic" fill="#6B6B6B">Share of global FX turnover, April 2025</text>

  <g font-size="12.5">
    <text x="120" y="305" fill="#333333" font-weight="bold">1. EUR/USD</text>
    <text x="280" y="305" fill="#2E5395" font-weight="bold">21.2%</text>
    <text x="450" y="305" fill="#333333" font-weight="bold">2. USD/JPY</text>
    <text x="610" y="305" fill="#2E5395" font-weight="bold">14.3%</text>

    <text x="120" y="335" fill="#333333" font-weight="bold">3. USD/CNY</text>
    <text x="280" y="335" fill="#eab308" font-weight="bold">8.1%</text>
    <text x="450" y="335" fill="#333333" font-weight="bold">4. GBP/USD</text>
    <text x="610" y="335" fill="#2E5395" font-weight="bold">7.6%</text>

    <text x="120" y="365" fill="#333333" font-weight="bold">5. USD/CAD</text>
    <text x="280" y="365" fill="#2E5395" font-weight="bold">5.3%</text>
    <text x="450" y="365" fill="#333333" font-weight="bold">6. AUD/USD</text>
    <text x="610" y="365" fill="#2E5395" font-weight="bold">4.9%</text>

    <text x="120" y="395" fill="#333333" font-weight="bold">7. USD/CHF</text>
    <text x="280" y="395" fill="#2E5395" font-weight="bold">4.9%</text>
  </g>

  <rect x="90" y="415" width="720" height="45" rx="8" fill="#FFF7E6" stroke="#C99A2E" stroke-width="1.2"/>
  <text x="450" y="443" text-anchor="middle" font-size="11.5" fill="#8A6D1F" font-weight="bold">Notable shift: USD/CNY (yuan) has overtaken GBP/USD as the 3rd most-traded pair — up from just 0.8% in 2010.</text>

  <!-- Nicknames -->
  <text x="450" y="490" text-anchor="middle" font-size="15" font-weight="bold" fill="#1F3864">A Few Nicknames You'll Hear</text>
  <text x="450" y="512" text-anchor="middle" font-size="11.5" fill="#333333">GBP/USD = "Cable" (1866 transatlantic telegraph)  ·  USD/CAD = "Loonie" (1987 loon coin)</text>
  <text x="450" y="530" text-anchor="middle" font-size="11.5" fill="#333333">AUD/USD = "Aussie"  ·  USD/CHF = "Swissy"  ·  NZD/USD = "Kiwi"</text>
</svg>
