<svg viewBox="0 0 900 560" xmlns="http://www.w3.org/2000/svg" font-family="Arial, Helvetica, sans-serif">
  <rect width="900" height="560" fill="#FDFCF9"/>
  <text x="450" y="38" text-anchor="middle" font-size="22" font-weight="bold" fill="#1F3864">Not All Currencies Are Equally Liquid</text>

  <!-- Liquidity bars -->
  <text x="80" y="70" font-size="13" font-weight="bold" fill="#1F3864">Share of global FX trades currency appears in (2025 BIS data)</text>

  <text x="80" y="95" font-size="12" fill="#333333">USD</text>
  <rect x="120" y="82" width="620" height="18" rx="3" fill="#2E5395"/>
  <text x="750" y="96" font-size="11" fill="#333333">~89%</text>

  <text x="80" y="120" font-size="12" fill="#333333">EUR</text>
  <rect x="120" y="107" width="215" height="18" rx="3" fill="#4A7BC8"/>
  <text x="345" y="121" font-size="11" fill="#333333">~31%</text>

  <text x="80" y="145" font-size="12" fill="#333333">JPY</text>
  <rect x="120" y="132" width="135" height="18" rx="3" fill="#7BA3D9"/>
  <text x="265" y="146" font-size="11" fill="#333333">~17%</text>

  <text x="80" y="170" font-size="12" fill="#333333">GBP</text>
  <rect x="120" y="157" width="90" height="18" rx="3" fill="#A8C2E8"/>
  <text x="220" y="171" font-size="11" fill="#333333">~13%</text>

  <text x="450" y="195" text-anchor="middle" font-size="11" font-style="italic" fill="#6B6B6B">USD appears in ~89% of all trades — roughly 3x more often than EUR, the next most liquid.</text>

  <!-- Major pairs with nicknames -->
  <text x="450" y="230" text-anchor="middle" font-size="15" font-weight="bold" fill="#1F3864">Major Pairs — and Their Nicknames</text>

  <g font-size="11.5">
    <rect x="70" y="245" width="150" height="42" rx="6" fill="#EAF0FB" stroke="#2E5395" stroke-width="1.2"/>
    <text x="145" y="263" text-anchor="middle" font-weight="bold" fill="#1F3864">EUR/USD</text>
    <text x="145" y="279" text-anchor="middle" fill="#555555">"Fiber"</text>

    <rect x="235" y="245" width="150" height="42" rx="6" fill="#EAF0FB" stroke="#2E5395" stroke-width="1.2"/>
    <text x="310" y="263" text-anchor="middle" font-weight="bold" fill="#1F3864">GBP/USD</text>
    <text x="310" y="279" text-anchor="middle" fill="#555555">"Cable"</text>

    <rect x="400" y="245" width="150" height="42" rx="6" fill="#EAF0FB" stroke="#2E5395" stroke-width="1.2"/>
    <text x="475" y="263" text-anchor="middle" font-weight="bold" fill="#1F3864">USD/JPY</text>
    <text x="475" y="279" text-anchor="middle" fill="#555555">(no common nickname)</text>

    <rect x="565" y="245" width="150" height="42" rx="6" fill="#EAF0FB" stroke="#2E5395" stroke-width="1.2"/>
    <text x="640" y="263" text-anchor="middle" font-weight="bold" fill="#1F3864">USD/CHF</text>
    <text x="640" y="279" text-anchor="middle" fill="#555555">"Swissie"</text>

    <rect x="150" y="297" width="150" height="42" rx="6" fill="#EAF0FB" stroke="#2E5395" stroke-width="1.2"/>
    <text x="225" y="315" text-anchor="middle" font-weight="bold" fill="#1F3864">USD/CAD</text>
    <text x="225" y="331" text-anchor="middle" fill="#555555">"Loonie"</text>

    <rect x="315" y="297" width="150" height="42" rx="6" fill="#EAF0FB" stroke="#2E5395" stroke-width="1.2"/>
    <text x="390" y="315" text-anchor="middle" font-weight="bold" fill="#1F3864">AUD/USD</text>
    <text x="390" y="331" text-anchor="middle" fill="#555555">"Aussie"</text>

    <rect x="480" y="297" width="150" height="42" rx="6" fill="#EAF0FB" stroke="#2E5395" stroke-width="1.2"/>
    <text x="555" y="315" text-anchor="middle" font-weight="bold" fill="#1F3864">NZD/USD</text>
    <text x="555" y="331" text-anchor="middle" fill="#555555">"Kiwi"</text>
  </g>

  <!-- Minors and cross pairs -->
  <text x="450" y="380" text-anchor="middle" font-size="15" font-weight="bold" fill="#1F3864">Minor Currencies vs. Cross Pairs</text>

  <rect x="60" y="395" width="360" height="90" rx="10" fill="#FFF7E6" stroke="#C99A2E" stroke-width="1.5"/>
  <text x="240" y="418" text-anchor="middle" font-size="13" font-weight="bold" fill="#8A6D1F">Minor Currency (e.g. MXN)</text>
  <text x="240" y="440" text-anchor="middle" font-size="11.5" fill="#333333">Not one of the majors — generally</text>
  <text x="240" y="457" text-anchor="middle" font-size="11.5" fill="#333333">quoted against USD, e.g. USD/MXN</text>
  <text x="240" y="474" text-anchor="middle" font-size="11.5" fill="#333333">— not against another minor.</text>

  <rect x="480" y="395" width="360" height="90" rx="10" fill="#EFFAF3" stroke="#1E7A4C" stroke-width="1.5"/>
  <text x="660" y="418" text-anchor="middle" font-size="13" font-weight="bold" fill="#1E7A4C">Cross Pair (e.g. CAD/JPY)</text>
  <text x="660" y="440" text-anchor="middle" font-size="11.5" fill="#333333">Any pair that does NOT include</text>
  <text x="660" y="457" text-anchor="middle" font-size="11.5" fill="#333333">the US dollar at all — both sides</text>
  <text x="660" y="474" text-anchor="middle" font-size="11.5" fill="#333333">are major currencies, just not USD.</text>

  <text x="450" y="520" text-anchor="middle" font-size="12" fill="#333333">You won't find MXN/JPY quoted directly — thin liquidity means it isn't traded that way.</text>
  <text x="450" y="540" text-anchor="middle" font-size="11" font-style="italic" fill="#6B6B6B">Source: Bank for International Settlements, Triennial Central Bank Survey, April 2025</text>
</svg>
