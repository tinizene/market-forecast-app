<svg viewBox="0 0 900 620" xmlns="http://www.w3.org/2000/svg" font-family="Arial, Helvetica, sans-serif">
  <rect width="900" height="620" fill="#FDFCF9"/>
  <text x="450" y="36" text-anchor="middle" font-size="20" font-weight="bold" fill="#1F3864">How Interest Rates Move a Currency - the Chain, and the Catch</text>

  <text x="450" y="70" text-anchor="middle" font-size="13.5" font-weight="bold" fill="#2E5395">The Standard Transmission Chain</text>

  <rect x="40" y="85" width="180" height="70" rx="9" fill="#EAF0FB" stroke="#2E5395" stroke-width="1.8"/>
  <text x="130" y="112" text-anchor="middle" font-size="12" font-weight="bold" fill="#2E5395">Central bank</text>
  <text x="130" y="130" text-anchor="middle" font-size="12" font-weight="bold" fill="#2E5395">raises rates</text>
  <text x="130" y="146" text-anchor="middle" font-size="9.5" fill="#555555">to cool inflation</text>

  <rect x="250" y="85" width="180" height="70" rx="9" fill="#EAF0FB" stroke="#2E5395" stroke-width="1.8"/>
  <text x="340" y="112" text-anchor="middle" font-size="12" font-weight="bold" fill="#2E5395">Higher return on</text>
  <text x="340" y="130" text-anchor="middle" font-size="12" font-weight="bold" fill="#2E5395">that currency</text>
  <text x="340" y="146" text-anchor="middle" font-size="9.5" fill="#555555">attracts capital</text>

  <rect x="460" y="85" width="180" height="70" rx="9" fill="#EAF0FB" stroke="#2E5395" stroke-width="1.8"/>
  <text x="550" y="112" text-anchor="middle" font-size="12" font-weight="bold" fill="#2E5395">Demand for the</text>
  <text x="550" y="130" text-anchor="middle" font-size="12" font-weight="bold" fill="#2E5395">currency rises</text>
  <text x="550" y="146" text-anchor="middle" font-size="9.5" fill="#555555">investors must buy it</text>

  <rect x="670" y="85" width="190" height="70" rx="9" fill="#EFFAF3" stroke="#1E7A4C" stroke-width="1.8"/>
  <text x="765" y="112" text-anchor="middle" font-size="12" font-weight="bold" fill="#1E7A4C">Currency tends</text>
  <text x="765" y="130" text-anchor="middle" font-size="12" font-weight="bold" fill="#1E7A4C">to appreciate</text>
  <text x="765" y="146" text-anchor="middle" font-size="9.5" fill="#555555">the textbook result</text>

  <line x1="220" y1="120" x2="248" y2="120" stroke="#888888" stroke-width="2"/>
  <line x1="430" y1="120" x2="458" y2="120" stroke="#888888" stroke-width="2"/>
  <line x1="640" y1="120" x2="668" y2="120" stroke="#888888" stroke-width="2"/>

  <text x="450" y="195" text-anchor="middle" font-size="13.5" font-weight="bold" fill="#1F3864">What Traders Watch: Expectations, Not Just the Rate</text>

  <rect x="70" y="210" width="360" height="90" rx="9" fill="#FFF3EF" stroke="#B23B2E" stroke-width="1.5"/>
  <text x="250" y="234" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#B23B2E">Hawkish</text>
  <text x="250" y="256" text-anchor="middle" font-size="11" fill="#333333">Favours higher rates to fight inflation.</text>
  <text x="250" y="274" text-anchor="middle" font-size="11" fill="#333333">Hawkish surprise: currency often rises.</text>
  <text x="250" y="292" text-anchor="middle" font-size="9.5" font-style="italic" fill="#555555">Hawks hunt inflation.</text>

  <rect x="470" y="210" width="360" height="90" rx="9" fill="#EAF0FB" stroke="#2E5395" stroke-width="1.5"/>
  <text x="650" y="234" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#2E5395">Dovish</text>
  <text x="650" y="256" text-anchor="middle" font-size="11" fill="#333333">Favours lower rates to boost growth.</text>
  <text x="650" y="274" text-anchor="middle" font-size="11" fill="#333333">Dovish surprise: currency often falls.</text>
  <text x="650" y="292" text-anchor="middle" font-size="9.5" font-style="italic" fill="#555555">Doves want easy money.</text>

  <rect x="140" y="315" width="620" height="48" rx="8" fill="#FFF7E6" stroke="#C99A2E" stroke-width="1.4"/>
  <text x="450" y="337" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#8A6D1F">Key idea: an expected hike is priced in before it happens.</text>
  <text x="450" y="354" text-anchor="middle" font-size="11" fill="#5C4813">Big moves come from surprises: when the bank confounds what the market expected.</text>

  <rect x="70" y="385" width="760" height="205" rx="10" fill="#F5F5F5" stroke="#888888" stroke-width="1.3"/>
  <text x="450" y="410" text-anchor="middle" font-size="14" font-weight="bold" fill="#1F3864">The Catch: The Real Evidence Is Messier Than the Chain</text>

  <text x="450" y="437" text-anchor="middle" font-size="11.5" fill="#333333">Uncovered Interest Parity (UIP) predicts a high-rate currency should later DEPRECIATE by just enough</text>
  <text x="450" y="454" text-anchor="middle" font-size="11.5" fill="#333333">to cancel the interest advantage, so no free lunch. That is the clean theory.</text>

  <text x="450" y="480" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#B23B2E">But decades of data show the opposite short-term: high-rate currencies have often kept APPRECIATING.</text>
  <text x="450" y="497" text-anchor="middle" font-size="11" fill="#333333">This is the forward premium puzzle (Fama, 1984), one of the most robust anomalies in the field.</text>

  <text x="450" y="523" text-anchor="middle" font-size="11" fill="#333333">It is why the carry trade (buy high-rate, fund with low-rate) has historically paid, but the returns</text>
  <text x="450" y="540" text-anchor="middle" font-size="11" fill="#333333">behave like compensation for risk: they collapse in global volatility spikes (Menkhoff et al., 2012).</text>

  <text x="450" y="567" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#1E7A4C">Takeaway: higher rates = stronger currency is a useful instinct, not a reliable rule.</text>
  <text x="450" y="583" text-anchor="middle" font-size="10" font-style="italic" fill="#555555">Direction, timing, and whether it is already priced in all matter more than the raw rate.</text>
</svg>
