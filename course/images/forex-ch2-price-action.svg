<svg viewBox="0 0 900 620" xmlns="http://www.w3.org/2000/svg" font-family="Arial, Helvetica, sans-serif">
  <rect width="900" height="620" fill="#FDFCF9"/>
  <text x="450" y="34" text-anchor="middle" font-size="20" font-weight="bold" fill="#1F3864">Price Action: What the Chart Shows, and What the Evidence Supports</text>
  <text x="450" y="58" text-anchor="middle" font-size="12" font-style="italic" fill="#6B6B6B">Read price directly (Lesson 1: an indicator only echoes price). Then weigh the evidence honestly.</text>

  <!-- ================= NAKED CHART PANEL ================= -->
  <rect x="40" y="78" width="820" height="300" rx="10" fill="#FFFFFF" stroke="#CBD3E1" stroke-width="1.5"/>
  <text x="60" y="102" font-size="13" font-weight="bold" fill="#1F3864">The naked chart: candles and one drawn level, no indicators</text>

  <!-- Support line at a round number -->
  <line x1="70" y1="320" x2="720" y2="320" stroke="#1E7A4C" stroke-width="2.5" stroke-dasharray="8 5"/>
  <text x="726" y="316" font-size="11.5" font-weight="bold" fill="#1E7A4C">Support</text>
  <text x="726" y="331" font-size="11" fill="#1E7A4C">1.1000</text>
  <text x="726" y="345" font-size="9.5" font-style="italic" fill="#6B6B6B">(round number)</text>

  <!-- Candlesticks: downtrend into support, then a reversal and bounce -->
  <!-- bearish = red #B23B2E, bullish = green #1E7A4C -->
  <!-- c1 --><line x1="110" y1="128" x2="110" y2="168" stroke="#B23B2E" stroke-width="1.5"/><rect x="103" y="136" width="14" height="24" fill="#B23B2E"/>
  <!-- c2 --><line x1="150" y1="150" x2="150" y2="190" stroke="#B23B2E" stroke-width="1.5"/><rect x="143" y="158" width="14" height="26" fill="#B23B2E"/>
  <!-- c3 --><line x1="190" y1="172" x2="190" y2="212" stroke="#B23B2E" stroke-width="1.5"/><rect x="183" y="180" width="14" height="26" fill="#B23B2E"/>
  <!-- c4 --><line x1="230" y1="196" x2="230" y2="238" stroke="#B23B2E" stroke-width="1.5"/><rect x="223" y="204" width="14" height="28" fill="#B23B2E"/>
  <!-- c5 --><line x1="270" y1="222" x2="270" y2="264" stroke="#B23B2E" stroke-width="1.5"/><rect x="263" y="230" width="14" height="28" fill="#B23B2E"/>
  <!-- c6 --><line x1="310" y1="250" x2="310" y2="292" stroke="#B23B2E" stroke-width="1.5"/><rect x="303" y="258" width="14" height="28" fill="#B23B2E"/>
  <!-- c7 reversal candle: small body, long lower wick piercing support --><line x1="350" y1="286" x2="350" y2="332" stroke="#C99A2E" stroke-width="1.5"/><rect x="343" y="300" width="14" height="12" fill="#C99A2E"/>
  <!-- c8 bullish --><line x1="390" y1="262" x2="390" y2="312" stroke="#1E7A4C" stroke-width="1.5"/><rect x="383" y="270" width="14" height="34" fill="#1E7A4C"/>
  <!-- c9 bullish --><line x1="430" y1="230" x2="430" y2="278" stroke="#1E7A4C" stroke-width="1.5"/><rect x="423" y="238" width="14" height="32" fill="#1E7A4C"/>
  <!-- c10 bullish --><line x1="470" y1="204" x2="470" y2="248" stroke="#1E7A4C" stroke-width="1.5"/><rect x="463" y="212" width="14" height="30" fill="#1E7A4C"/>

  <!-- reversal candle callout -->
  <line x1="350" y1="352" x2="350" y2="316" stroke="#8A6D1F" stroke-width="1.2"/>
  <text x="352" y="368" font-size="10.5" font-weight="bold" fill="#8A6D1F">reversal candle</text>
  <text x="352" y="382" font-size="9.5" font-style="italic" fill="#8A6D1F">a claim to test, not trust</text>

  <!-- order-flow mechanism annotation -->
  <text x="120" y="352" font-size="10.5" fill="#1E7A4C">Take-profit orders cluster at the level: price reverses.</text>
  <text x="120" y="368" font-size="10.5" fill="#B23B2E">Stop-loss orders sit just below: a clean break would accelerate.</text>

  <!-- ================= EVIDENCE VERDICT STRIP ================= -->
  <text x="450" y="416" text-anchor="middle" font-size="14" font-weight="bold" fill="#1F3864">The honest verdict: the two halves of price action are not equally supported</text>

  <!-- Support/Resistance: strong -->
  <rect x="40" y="432" width="400" height="150" rx="10" fill="#EFFAF3" stroke="#1E7A4C" stroke-width="2"/>
  <text x="60" y="458" font-size="14" font-weight="bold" fill="#1E7A4C">Support and Resistance</text>
  <text x="60" y="478" font-size="12" font-weight="bold" fill="#1E7A4C">Evidence: STRONG, and forex-specific</text>
  <text x="60" y="500" font-size="11" fill="#333333">Osler 2000 (NY Fed): published S/R levels helped</text>
  <text x="60" y="515" font-size="11" fill="#333333">predict intraday trend reversals, for at least 5 days.</text>
  <text x="60" y="536" font-size="11" fill="#333333">Osler 2003 (J. Finance): orders cluster at round</text>
  <text x="60" y="551" font-size="11" fill="#333333">numbers - the concrete mechanism behind the levels.</text>
  <text x="60" y="572" font-size="10.5" font-style="italic" fill="#1E7A4C">A tested effect with a known cause. Still a probability.</text>

  <!-- Candlestick patterns: contested -->
  <rect x="460" y="432" width="400" height="150" rx="10" fill="#FFF7E6" stroke="#C99A2E" stroke-width="2"/>
  <text x="480" y="458" font-size="14" font-weight="bold" fill="#8A6D1F">Candlestick Patterns</text>
  <text x="480" y="478" font-size="12" font-weight="bold" fill="#8A6D1F">Evidence: CONTESTED</text>
  <text x="480" y="500" font-size="11" fill="#333333">Caginalp and Laurent 1998: profitable on S&amp;P 500.</text>
  <text x="480" y="515" font-size="11" fill="#333333">Marshall, Young and Rose 2006: no value on the Dow.</text>
  <text x="480" y="536" font-size="11" fill="#333333">Same era, major US stocks, opposite conclusions -</text>
  <text x="480" y="551" font-size="11" fill="#333333">the result flips with the exit rule chosen.</text>
  <text x="480" y="572" font-size="10.5" font-style="italic" fill="#8A6D1F">Lesson 5's data-snooping warning, in a new place.</text>

  <text x="450" y="606" text-anchor="middle" font-size="11" font-style="italic" fill="#6B6B6B">Weight each tool by the strength of its evidence - not by how confidently it is marketed.</text>
</svg>
