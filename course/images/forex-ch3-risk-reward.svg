<svg viewBox="0 0 900 610" xmlns="http://www.w3.org/2000/svg" font-family="Arial, Helvetica, sans-serif">
  <rect width="900" height="610" fill="#FDFCF9"/>
  <text x="450" y="34" text-anchor="middle" font-size="20" font-weight="bold" fill="#1F3864">Risk-to-Reward: Why Being Right Is Not the Same as Trading Well</text>
  <text x="450" y="58" text-anchor="middle" font-size="12" font-style="italic" fill="#6B6B6B">The ratio decides the win rate you need. Win rate on its own tells you only half the story.</text>

  <!-- R:R scale (left) -->
  <rect x="40" y="80" width="330" height="216" rx="10" fill="#FFFFFF" stroke="#CBD3E1" stroke-width="1.5"/>
  <text x="60" y="104" font-size="13" font-weight="bold" fill="#1F3864">One trade, measured in R</text>
  <!-- target zone -->
  <rect x="150" y="118" width="180" height="56" rx="5" fill="#EFFAF3" stroke="#1E7A4C" stroke-width="1.5"/>
  <text x="240" y="141" text-anchor="middle" font-size="12" font-weight="bold" fill="#1E7A4C">Target: +2R</text>
  <text x="240" y="159" text-anchor="middle" font-size="10.5" fill="#333333">60 pips (2x the stop)</text>
  <!-- entry line -->
  <line x1="70" y1="196" x2="340" y2="196" stroke="#1F3864" stroke-width="2" stroke-dasharray="6 4"/>
  <text x="70" y="190" font-size="10.5" font-weight="bold" fill="#1F3864">Entry 1.1000</text>
  <!-- stop zone -->
  <rect x="150" y="212" width="180" height="42" rx="5" fill="#FFF3EF" stroke="#B23B2E" stroke-width="1.5"/>
  <text x="240" y="230" text-anchor="middle" font-size="12" font-weight="bold" fill="#B23B2E">Stop: -1R</text>
  <text x="240" y="247" text-anchor="middle" font-size="10.5" fill="#333333">30 pips = your risk</text>
  <text x="60" y="278" font-size="10.5" font-style="italic" fill="#6B6B6B">Risk = stop distance x pip value x size.</text>
  <text x="60" y="292" font-size="10.5" font-style="italic" fill="#6B6B6B">That is 1R. Reward is measured against it.</text>

  <!-- Break-even table (right) -->
  <rect x="390" y="80" width="470" height="216" rx="10" fill="#FFFFFF" stroke="#CBD3E1" stroke-width="1.5"/>
  <text x="410" y="104" font-size="13" font-weight="bold" fill="#1F3864">Break-even win rate = 1 / (1 + R)</text>
  <line x1="410" y1="116" x2="840" y2="116" stroke="#E1E5EE" stroke-width="1.5"/>
  <text x="430" y="140" font-size="12" fill="#333333">Reward : Risk</text>
  <text x="700" y="140" font-size="12" fill="#333333">You must win</text>
  <text x="430" y="168" font-size="12.5" font-weight="bold" fill="#B23B2E">1 : 0.5  (reward smaller than risk)</text>
  <text x="700" y="168" font-size="12.5" font-weight="bold" fill="#B23B2E">66.7%</text>
  <text x="430" y="196" font-size="12.5" font-weight="bold" fill="#8A6D1F">1 : 1</text>
  <text x="700" y="196" font-size="12.5" font-weight="bold" fill="#8A6D1F">50.0%</text>
  <text x="430" y="224" font-size="12.5" font-weight="bold" fill="#1E7A4C">1 : 2</text>
  <text x="700" y="224" font-size="12.5" font-weight="bold" fill="#1E7A4C">33.3%</text>
  <text x="430" y="252" font-size="12.5" font-weight="bold" fill="#1E7A4C">1 : 3</text>
  <text x="700" y="252" font-size="12.5" font-weight="bold" fill="#1E7A4C">25.0%</text>
  <text x="410" y="282" font-size="10.5" font-style="italic" fill="#6B6B6B">A better ratio lowers the win rate you need; a worse one raises it fast.</text>

  <!-- Three traders -->
  <text x="450" y="326" text-anchor="middle" font-size="13" font-weight="bold" fill="#1F3864">Ten trades each -- the win rate alone hides who wins</text>

  <rect x="40" y="338" width="260" height="210" rx="10" fill="#EFFAF3" stroke="#1E7A4C" stroke-width="2"/>
  <text x="170" y="362" text-anchor="middle" font-size="13" font-weight="bold" fill="#1E7A4C">Trader A</text>
  <text x="170" y="384" text-anchor="middle" font-size="12" fill="#333333">40% win rate, at 1:2</text>
  <text x="60" y="414" font-size="11.5" fill="#333333">4 wins x +2R = +8R</text>
  <text x="60" y="436" font-size="11.5" fill="#333333">6 losses x -1R = -6R</text>
  <line x1="60" y1="450" x2="280" y2="450" stroke="#1E7A4C" stroke-width="1"/>
  <text x="60" y="474" font-size="14" font-weight="bold" fill="#1E7A4C">Net = +2R (profit)</text>
  <text x="60" y="512" font-size="11" font-style="italic" fill="#1E7A4C">Wrong more often than right,</text>
  <text x="60" y="528" font-size="11" font-style="italic" fill="#1E7A4C">and still makes money.</text>

  <rect x="320" y="338" width="260" height="210" rx="10" fill="#EAF0FB" stroke="#2E5395" stroke-width="2"/>
  <text x="450" y="362" text-anchor="middle" font-size="13" font-weight="bold" fill="#2E5395">Trader B</text>
  <text x="450" y="384" text-anchor="middle" font-size="12" fill="#333333">60% win rate, at 1:1</text>
  <text x="340" y="414" font-size="11.5" fill="#333333">6 wins x +1R = +6R</text>
  <text x="340" y="436" font-size="11.5" fill="#333333">4 losses x -1R = -4R</text>
  <line x1="340" y1="450" x2="560" y2="450" stroke="#2E5395" stroke-width="1"/>
  <text x="340" y="474" font-size="14" font-weight="bold" fill="#2E5395">Net = +2R (profit)</text>
  <text x="340" y="512" font-size="11" font-style="italic" fill="#2E5395">Same profit as A, from an</text>
  <text x="340" y="528" font-size="11" font-style="italic" fill="#2E5395">opposite-looking record.</text>

  <rect x="600" y="338" width="260" height="210" rx="10" fill="#FFF3EF" stroke="#B23B2E" stroke-width="2"/>
  <text x="730" y="362" text-anchor="middle" font-size="13" font-weight="bold" fill="#B23B2E">Trader C</text>
  <text x="730" y="384" text-anchor="middle" font-size="12" fill="#333333">70% win rate, at 1:0.5</text>
  <text x="620" y="414" font-size="11.5" fill="#333333">7 wins x +0.5R = +3.5R</text>
  <text x="620" y="436" font-size="11.5" fill="#333333">3 losses x -1R = -3R</text>
  <line x1="620" y1="450" x2="840" y2="450" stroke="#B23B2E" stroke-width="1"/>
  <text x="620" y="474" font-size="14" font-weight="bold" fill="#B23B2E">Net = +0.5R (barely)</text>
  <text x="620" y="512" font-size="11" font-style="italic" fill="#B23B2E">Right most often, trading</text>
  <text x="620" y="528" font-size="11" font-style="italic" fill="#B23B2E">worst -- a quarter of A's gain.</text>

  <text x="450" y="580" text-anchor="middle" font-size="12" font-style="italic" fill="#1F3864">What makes money is win rate and the risk-to-reward ratio together -- never either one alone.</text>
  <text x="450" y="600" text-anchor="middle" font-size="10.5" font-style="italic" fill="#6B6B6B">Set both prices from real levels before entry; never widen a stop or pull in a target to rescue a trade.</text>
</svg>
