<svg viewBox="0 0 900 600" xmlns="http://www.w3.org/2000/svg" font-family="Arial, Helvetica, sans-serif">
  <rect width="900" height="600" fill="#FDFCF9"/>
  <text x="450" y="34" text-anchor="middle" font-size="20" font-weight="bold" fill="#1F3864">Trading Psychology: Two Engines That Drain Accounts -- and the Fix</text>
  <text x="450" y="58" text-anchor="middle" font-size="12" font-style="italic" fill="#6B6B6B">The problem is rarely the analysis. It is good rules abandoned under fear and greed.</text>

  <!-- emotion chips -->
  <rect x="360" y="76" width="80" height="30" rx="15" fill="#FFF3EF" stroke="#B23B2E" stroke-width="1.5"/>
  <text x="400" y="96" text-anchor="middle" font-size="13" font-weight="bold" fill="#B23B2E">FEAR</text>
  <rect x="460" y="76" width="80" height="30" rx="15" fill="#FFF7E6" stroke="#C99A2E" stroke-width="1.5"/>
  <text x="500" y="96" text-anchor="middle" font-size="13" font-weight="bold" fill="#8A6D1F">GREED</text>
  <line x1="400" y1="106" x2="250" y2="128" stroke="#888888" stroke-width="1.5"/>
  <line x1="500" y1="106" x2="650" y2="128" stroke="#888888" stroke-width="1.5"/>

  <!-- Disposition effect card -->
  <rect x="40" y="130" width="400" height="200" rx="10" fill="#FFF3EF" stroke="#B23B2E" stroke-width="2"/>
  <text x="60" y="156" font-size="15" font-weight="bold" fill="#B23B2E">1. The Disposition Effect</text>
  <text x="60" y="178" font-size="12" fill="#333333">Sell winners too early (bank the sure gain);</text>
  <text x="60" y="195" font-size="12" fill="#333333">ride losers too long (hope they come back).</text>
  <text x="60" y="213" font-size="10.5" font-style="italic" fill="#6B6B6B">Named by Shefrin and Statman (1985).</text>
  <rect x="60" y="226" width="360" height="86" rx="8" fill="#FDFCF9" stroke="#B23B2E" stroke-width="1"/>
  <text x="72" y="248" font-size="11.5" font-weight="bold" fill="#B23B2E">Evidence: Odean (1998), J. Finance</text>
  <text x="72" y="267" font-size="11" fill="#333333">10,000 accounts: 1.5 to 2x more likely to sell</text>
  <text x="72" y="284" font-size="11" fill="#333333">a winner than a loser -- and the winners sold</text>
  <text x="72" y="301" font-size="11" fill="#333333">went on to beat the losers kept. It cost them.</text>

  <!-- Overtrading card -->
  <rect x="460" y="130" width="400" height="200" rx="10" fill="#FFF7E6" stroke="#C99A2E" stroke-width="2"/>
  <text x="480" y="156" font-size="15" font-weight="bold" fill="#8A6D1F">2. Overtrading</text>
  <text x="480" y="178" font-size="12" fill="#333333">Trade more often or bigger than the strategy</text>
  <text x="480" y="195" font-size="12" fill="#333333">justifies -- driven by overconfidence.</text>
  <text x="480" y="213" font-size="10.5" font-style="italic" fill="#6B6B6B">Every trade also pays the spread (Ch1 L4).</text>
  <rect x="480" y="226" width="360" height="86" rx="8" fill="#FDFCF9" stroke="#C99A2E" stroke-width="1"/>
  <text x="492" y="248" font-size="11.5" font-weight="bold" fill="#8A6D1F">Evidence: Barber and Odean (2000), J. Finance</text>
  <text x="492" y="267" font-size="11" fill="#333333">66,465 households: the most active traders</text>
  <text x="492" y="284" font-size="13" font-weight="bold" fill="#B23B2E">earned 11.4%/yr vs the market's 17.9%</text>
  <text x="492" y="301" font-size="11" fill="#333333">Same market, same years -- the gap was activity.</text>

  <!-- arrow down to fix -->
  <text x="450" y="356" text-anchor="middle" font-size="12" font-weight="bold" fill="#1F3864">Both are feelings you cannot reliably beat in the moment. So do not try to.</text>

  <!-- Discipline card -->
  <rect x="120" y="372" width="660" height="176" rx="10" fill="#EFFAF3" stroke="#1E7A4C" stroke-width="2"/>
  <text x="450" y="398" text-anchor="middle" font-size="15" font-weight="bold" fill="#1E7A4C">The Fix: Discipline = a pre-committed plan, not a feeling</text>
  <text x="450" y="422" text-anchor="middle" font-size="12" fill="#333333">Decide entry, stop, target, and size in advance -- while calm -- then remove the live decision.</text>
  <rect x="150" y="436" width="290" height="96" rx="8" fill="#FDFCF9" stroke="#1E7A4C" stroke-width="1"/>
  <text x="295" y="458" text-anchor="middle" font-size="12" font-weight="bold" fill="#1E7A4C">Beats the disposition effect</text>
  <text x="295" y="479" text-anchor="middle" font-size="11" fill="#333333">OCO order (Ch1 L7): stop and target</text>
  <text x="295" y="495" text-anchor="middle" font-size="11" fill="#333333">set before entry, execute on their own.</text>
  <text x="295" y="516" text-anchor="middle" font-size="10.5" font-style="italic" fill="#6B6B6B">No live choice to fumble.</text>
  <rect x="460" y="436" width="290" height="96" rx="8" fill="#FDFCF9" stroke="#1E7A4C" stroke-width="1"/>
  <text x="605" y="458" text-anchor="middle" font-size="12" font-weight="bold" fill="#1E7A4C">Beats overtrading</text>
  <text x="605" y="479" text-anchor="middle" font-size="11" fill="#333333">Preset size (Ch3 L1) removes "go bigger";</text>
  <text x="605" y="495" text-anchor="middle" font-size="11" fill="#333333">rules define what counts as a setup.</text>
  <text x="605" y="516" text-anchor="middle" font-size="10.5" font-style="italic" fill="#6B6B6B">Trade the plan, not the mood.</text>

  <text x="450" y="576" text-anchor="middle" font-size="11" font-style="italic" fill="#6B6B6B">No one removes fear and greed -- professionals included. You build a process that makes them irrelevant to the decision.</text>
</svg>
