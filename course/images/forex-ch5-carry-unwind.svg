<svg viewBox="0 0 900 560" xmlns="http://www.w3.org/2000/svg" font-family="Arial, Helvetica, sans-serif">
  <rect width="900" height="560" fill="#FDFCF9"/>
  <text x="450" y="32" text-anchor="middle" font-size="20" font-weight="bold" fill="#1F3864">The Yen Carry Trade Unwind (AUD/JPY, 2007-2008)</text>
  <text x="450" y="55" text-anchor="middle" font-size="12" font-style="italic" fill="#6B6B6B">Steady income for years, then a sudden correlated crash -- exactly as the evidence warned.</text>

  <!-- chart -->
  <rect x="40" y="74" width="500" height="240" rx="8" fill="#FFFFFF" stroke="#CBD3E1" stroke-width="1.5"/>
  <text x="52" y="94" font-size="10.5" fill="#6B6B6B">AUD/JPY</text>
  <line x1="70" y1="110" x2="520" y2="110" stroke="#E1E5EE" stroke-width="1" stroke-dasharray="4 4"/>
  <text x="44" y="114" font-size="10" fill="#6B6B6B">108</text>
  <line x1="70" y1="270" x2="520" y2="270" stroke="#E1E5EE" stroke-width="1" stroke-dasharray="4 4"/>
  <text x="48" y="274" font-size="10" fill="#6B6B6B">55</text>
  <!-- rising then collapse -->
  <polyline points="70,210 180,175 280,140 350,112 380,120 420,175 470,250 520,268" fill="none" stroke="#1E7A4C" stroke-width="2.5"/>
  <polyline points="350,112 380,120 420,175 470,250 520,268" fill="none" stroke="#B23B2E" stroke-width="2.5"/>
  <text x="95" y="200" font-size="10.5" fill="#1E7A4C">Build-up 2004-2007: yen weak,</text>
  <text x="95" y="214" font-size="10.5" fill="#1E7A4C">AUD strong, carry pays.</text>
  <text x="300" y="104" font-size="10.5" font-weight="bold" fill="#1E7A4C">Peak ~107.80 (Oct 2007)</text>
  <text x="360" y="300" font-size="10.5" font-weight="bold" fill="#B23B2E">2008: -45% to ~55</text>

  <!-- build-up panel -->
  <rect x="560" y="74" width="300" height="112" rx="8" fill="#EFFAF3" stroke="#1E7A4C" stroke-width="2"/>
  <text x="580" y="96" font-size="12.5" font-weight="bold" fill="#1E7A4C">The trade (paid twice)</text>
  <text x="580" y="118" font-size="11" fill="#333333">Borrow yen at ~0.5% (BoJ),</text>
  <text x="580" y="133" font-size="11" fill="#333333">buy AUD at ~6.75% (RBA):</text>
  <text x="580" y="150" font-size="11" font-weight="bold" fill="#1E7A4C">~5% rate gap, plus a rising pair.</text>
  <text x="580" y="172" font-size="10.5" font-style="italic" fill="#6B6B6B">"Free money" -- steady and calm.</text>

  <!-- unwind panel -->
  <rect x="560" y="194" width="300" height="120" rx="8" fill="#FFF3EF" stroke="#B23B2E" stroke-width="2"/>
  <text x="580" y="216" font-size="12.5" font-weight="bold" fill="#B23B2E">The unwind (2008)</text>
  <text x="580" y="238" font-size="11" fill="#333333">Crisis hits: everyone closes at once.</text>
  <text x="580" y="255" font-size="11" fill="#333333">Closing = buying yen back, together,</text>
  <text x="580" y="270" font-size="11" fill="#333333">so the yen surges. Crowded exit.</text>
  <text x="580" y="292" font-size="11" fill="#333333">Years of interest lost in weeks.</text>

  <!-- lesson strip -->
  <rect x="40" y="330" width="820" height="130" rx="10" fill="#EAF0FB" stroke="#2E5395" stroke-width="2"/>
  <text x="60" y="354" font-size="14" font-weight="bold" fill="#2E5395">What the evidence already told you (Ch2 L3)</text>
  <text x="60" y="378" font-size="11.5" fill="#333333">Menkhoff, Sarno, Schmeling and Schrimpf (2012): carry returns are steady in calm periods and crash together</text>
  <text x="60" y="396" font-size="11.5" fill="#333333">when volatility spikes. Brunnermeier, Nagel and Pedersen ("Carry Trades and Currency Crashes"): the same shape.</text>
  <text x="60" y="420" font-size="12" font-weight="bold" fill="#2E5395">The steady income is payment for bearing crash risk -- not a free lunch. 2008 was the year it was called.</text>
  <text x="60" y="444" font-size="11" font-style="italic" fill="#6B6B6B">A strategy that pays a little reliably with rare severe blow-ups is being paid a premium for a risk not yet shown up.</text>

  <text x="450" y="502" text-anchor="middle" font-size="12" font-style="italic" fill="#1F3864">Size a carry position for the crash, not the calm. The quiet years are not the ones that decide survival.</text>
</svg>
