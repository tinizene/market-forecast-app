<svg viewBox="0 0 900 460" xmlns="http://www.w3.org/2000/svg" font-family="Arial, Helvetica, sans-serif">
  <rect width="900" height="460" fill="#FDFCF9"/>
  <text x="450" y="38" text-anchor="middle" font-size="22" font-weight="bold" fill="#1F3864">Trend, Support &amp; Resistance</text>

  <!-- Uptrend panel -->
  <text x="220" y="70" text-anchor="middle" font-size="16" font-weight="bold" fill="#1E7A4C">Uptrend — Higher Highs, Higher Lows</text>
  <rect x="60" y="85" width="320" height="180" rx="10" fill="#EFFAF3" stroke="#1E7A4C" stroke-width="1.5"/>
  <polyline points="80,240 130,160 160,190 210,120 240,150 290,90 340,110" fill="none" stroke="#1E7A4C" stroke-width="3"/>
  <circle cx="130" cy="160" r="4" fill="#1E7A4C"/>
  <circle cx="210" cy="120" r="4" fill="#1E7A4C"/>
  <circle cx="290" cy="90" r="4" fill="#1E7A4C"/>
  <text x="130" y="150" text-anchor="middle" font-size="9.5" fill="#1E7A4C">High 1</text>
  <text x="210" y="110" text-anchor="middle" font-size="9.5" fill="#1E7A4C">High 2</text>
  <text x="290" y="80" text-anchor="middle" font-size="9.5" fill="#1E7A4C">High 3</text>
  <circle cx="160" cy="190" r="4" fill="#2E5395"/>
  <circle cx="240" cy="150" r="4" fill="#2E5395"/>
  <text x="160" y="210" text-anchor="middle" font-size="9.5" fill="#2E5395">Low 1</text>
  <text x="240" y="170" text-anchor="middle" font-size="9.5" fill="#2E5395">Low 2</text>
  <text x="220" y="255" text-anchor="middle" font-size="11" font-style="italic" fill="#333333">Each high and low tops the last</text>

  <!-- Downtrend panel -->
  <text x="680" y="70" text-anchor="middle" font-size="16" font-weight="bold" fill="#B23B2E">Downtrend — Lower Highs, Lower Lows</text>
  <rect x="520" y="85" width="320" height="180" rx="10" fill="#FFF3EF" stroke="#B23B2E" stroke-width="1.5"/>
  <polyline points="540,110 590,150 620,130 670,190 700,170 750,230 800,215" fill="none" stroke="#B23B2E" stroke-width="3"/>
  <circle cx="590" cy="150" r="4" fill="#B23B2E"/>
  <circle cx="670" cy="190" r="4" fill="#B23B2E"/>
  <circle cx="750" cy="230" r="4" fill="#B23B2E"/>
  <text x="590" y="140" text-anchor="middle" font-size="9.5" fill="#B23B2E">Low 1</text>
  <text x="670" y="180" text-anchor="middle" font-size="9.5" fill="#B23B2E">Low 2</text>
  <text x="750" y="220" text-anchor="middle" font-size="9.5" fill="#B23B2E">Low 3</text>
  <circle cx="620" cy="130" r="4" fill="#2E5395"/>
  <circle cx="700" cy="170" r="4" fill="#2E5395"/>
  <text x="620" y="120" text-anchor="middle" font-size="9.5" fill="#2E5395">High 1</text>
  <text x="700" y="160" text-anchor="middle" font-size="9.5" fill="#2E5395">High 2</text>
  <text x="680" y="255" text-anchor="middle" font-size="11" font-style="italic" fill="#333333">Each high and low falls below the last</text>

  <!-- Support/Resistance panel -->
  <text x="450" y="300" text-anchor="middle" font-size="16" font-weight="bold" fill="#1F3864">Support and Resistance — Levels Price Reacts To</text>
  <rect x="150" y="315" width="600" height="120" rx="10" fill="#EAF0FB" stroke="#2E5395" stroke-width="1.5"/>
  <line x1="180" y1="345" x2="720" y2="345" stroke="#B23B2E" stroke-width="2" stroke-dasharray="6,4"/>
  <text x="730" y="349" font-size="11" fill="#B23B2E" font-weight="bold">Resistance</text>
  <line x1="180" y1="410" x2="720" y2="410" stroke="#1E7A4C" stroke-width="2" stroke-dasharray="6,4"/>
  <text x="730" y="414" font-size="11" fill="#1E7A4C" font-weight="bold">Support</text>
  <polyline points="190,378 230,347 270,378 310,410 350,380 390,347 430,378 470,410 510,380 550,347 590,378 630,410 670,380" fill="none" stroke="#333333" stroke-width="2.5"/>
  <text x="450" y="453" text-anchor="middle" font-size="11" font-style="italic" fill="#6B6B6B">Price repeatedly reverses at these levels — a probability built from history, not a guaranteed wall.</text>
</svg>
